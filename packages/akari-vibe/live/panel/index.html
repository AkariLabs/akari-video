<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AKARI バイブ</title>
<style>
  :root {
    color-scheme: dark;
    --accent: #f97316;
    --panel: rgba(24, 24, 27, .97);
    --panel-2: rgba(39, 39, 42, .98);
    --line: rgba(255, 255, 255, .14);
    --text: #fafafa;
    --muted: #a1a1aa;
    --quiet: #71717a;
    font-family: -apple-system, "Hiragino Sans", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: max-content;
    height: max-content;
    overflow: hidden;
    background: transparent;
  }
  button { font: inherit; }
  .panel {
    width: 44px;
    height: 44px;
    max-width: 720px;
    max-height: 360px;
    overflow: hidden;
    color: var(--text);
    background: transparent;
    border-radius: 22px;
    user-select: none;
  }
  .panel.expanded {
    width: var(--expanded-width, 620px);
    height: auto;
    min-height: 92px;
    max-height: var(--expanded-max-height, 360px);
    padding: 0 10px 10px 0;
    border-radius: 0;
    background: var(--panel);
  }
  .mainbar {
    display: flex;
    align-items: center;
    width: 44px;
    min-height: 44px;
    touch-action: none;
  }
  .expanded .mainbar {
    width: 100%;
    padding-block: 5px;
    padding-right: 34px;
    cursor: grab;
  }
  .mainbar.dragging { cursor: grabbing; }
  .mic {
    position: relative;
    flex: 0 0 44px;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    color: var(--text);
    background: transparent;
    cursor: pointer;
  }
  .orb {
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .1) inset, 0 0 18px rgba(249, 115, 22, .34);
    animation: breathe 2.7s ease-in-out infinite;
    transform: scale(var(--level, 1));
  }
  .mic.judging .orb { animation: judging .72s ease-in-out infinite; }
  .mic.off .orb {
    background: #71717a;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .08) inset;
    animation: none;
    transform: none;
  }
  @keyframes breathe { 0%, 100% { scale: .94; } 50% { scale: 1.04; } }
  @keyframes judging { 0%, 100% { scale: .91; } 50% { scale: 1.09; } }
  @media (prefers-reduced-motion: reduce) {
    .orb, .mic.judging .orb { animation: none; }
  }
  .summary {
    display: none;
    min-width: 0;
    flex: 1;
    padding-left: 6px;
  }
  .expanded .summary { display: block; }
  .heard {
    display: -webkit-box;
    min-height: 17px;
    overflow: hidden;
    color: var(--text);
    font-size: 13px;
    font-weight: 650;
    line-height: 1.28;
    overflow-wrap: anywhere;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }
  .heard.partial { color: var(--muted); font-weight: 500; }
  .heard:empty { display: none; }
  .outcome-row {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
    margin-top: 4px;
  }
  .heard:empty + .outcome-row { margin-top: 0; }
  .outcome {
    min-width: 0;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }
  .state {
    flex: none;
    padding: 1px 7px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    font-size: 10px;
    line-height: 16px;
  }
  .state[hidden] { display: none; }
  .state.exec, .state.judging { border-color: var(--accent); color: var(--accent); }
  .content { display: none; padding-left: 10px; }
  .expanded .content { display: block; padding-top: 1px; }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 30px;
    padding-top: 6px;
    border-top: 1px solid var(--line);
  }
  .toolbar .plain-button {
    min-height: 24px;
    padding: 2px 6px;
    font-size: 10px;
    line-height: 16px;
  }
  .plain-button, .undo-button {
    min-height: 24px;
    padding: 2px 9px;
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--text);
    background: rgba(255, 255, 255, .045);
    cursor: pointer;
  }
  .plain-button:hover, .undo-button:hover { border-color: var(--accent); }
  .plain-button[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
  .spacer { flex: 1; }
  .status-note { color: var(--quiet); font-size: 10px; }
  .subpanel {
    max-height: 218px;
    margin-top: 4px;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel-2);
  }
  .subpanel[hidden] { display: none; }
  .panel-heading {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 32px;
    padding: 4px 7px;
    border-bottom: 1px solid var(--line);
    font-size: 11px;
    font-weight: 700;
  }
  .panel-heading .plain-button { margin-left: auto; }
  .history-list { display: grid; }
  .history-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 8px;
    min-height: 34px;
    padding: 5px 7px;
    border-bottom: 1px solid rgba(255, 255, 255, .08);
  }
  .history-row:last-child { border-bottom: 0; }
  .history-copy { min-width: 0; }
  .history-copy b, .history-copy small {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .history-copy b { font-size: 11px; font-weight: 650; }
  .history-copy small { color: var(--muted); font-size: 10px; }
  .undo-button { color: var(--accent); font-size: 10px; }
  .empty { padding: 10px; color: var(--muted); font-size: 11px; }
  .details { padding: 7px; }
  .detail-grid {
    display: grid;
    grid-template-columns: 58px minmax(0, 1fr) 72px 36px minmax(0, 1.3fr);
    align-items: center;
    gap: 4px 7px;
    font-size: 10px;
  }
  .detail-grid .head { color: var(--quiet); font-size: 9px; }
  .detail-name, .detail-next {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .detail-key { color: var(--muted); }
  .probability {
    position: relative;
    height: 7px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(255, 255, 255, .08);
  }
  .probability i {
    display: block;
    height: 100%;
    border-radius: inherit;
    background: var(--accent);
  }
  .probability u {
    position: absolute;
    top: -2px;
    bottom: -2px;
    width: 1px;
    background: white;
    opacity: .72;
  }
  .detail-value { font-family: ui-monospace, monospace; color: var(--muted); }
  .detail-next { color: var(--muted); }
  .detail-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    margin-top: 8px;
    padding-top: 7px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-family: ui-monospace, monospace;
    font-size: 10px;
  }
  .rate-note { font-family: -apple-system, "Hiragino Sans", sans-serif; color: var(--quiet); }
  .delete-banner {
    display: flex;
    align-items: center;
    gap: 4px;
    min-height: 31px;
    margin-top: 4px;
    padding: 4px 7px;
    border: 1px solid var(--accent);
    border-radius: 9px;
    color: var(--text);
    background: rgba(249, 115, 22, .1);
    font-size: 11px;
  }
  .delete-banner[hidden] { display: none; }
  .delete-banner button {
    padding: 1px 5px;
    border: 0;
    color: var(--accent);
    background: transparent;
    font-weight: 700;
    cursor: pointer;
  }
  .setup-banner { padding: 8px 10px; font-size: 12px; line-height: 1.6; }
  .setup-banner[hidden] { display: none; }
  .setup-banner button { color: var(--accent); background: transparent; border: 0; cursor: pointer; }
  .mic:disabled { cursor: default; opacity: .5; }
</style>
</head>
<body>
<main id="panel" class="panel" aria-label="AKARI バイブ" data-testid="panel-root">
  <div id="mainbar" class="mainbar">
    <button id="mic" class="mic off" type="button" aria-label="AKARI バイブ" title="止まっています（押すと始める）">
      <span class="orb" aria-hidden="true"></span>
    </button>
    <div class="summary">
      <div id="heard" class="heard" data-testid="heard"></div>
      <div class="outcome-row">
        <div id="outcome" class="outcome">待機中</div>
        <span id="state" class="state" hidden>待機</span>
      </div>
    </div>
  </div>
  <div id="setup-banner" class="setup-banner" role="status" hidden><span id="setup-message"></span><button id="setup-action" type="button" hidden></button></div>
  <section class="content">
    <div class="toolbar">
      <button id="history-toggle" class="plain-button" type="button" aria-expanded="false">履歴 <span id="history-count">0</span></button>
      <button id="details-toggle" class="plain-button" type="button" aria-expanded="false" aria-label="くわしく">⋯</button>
      <span class="spacer"></span>
      <span id="mic-note" class="status-note">聞き取り停止中</span>
    </div>
    <div id="delete-banner" class="delete-banner" data-testid="delete-banner" hidden></div>
    <section id="history-panel" class="subpanel" data-testid="history-panel" hidden>
      <div class="panel-heading">履歴 <button id="undo-latest" class="plain-button" type="button">↶ 直前を戻す</button></div>
      <div id="history-list" class="history-list"></div>
    </section>
    <section id="details-panel" class="subpanel" data-testid="details-panel" hidden>
      <div class="panel-heading">くわしく</div>
      <div id="details" class="details"></div>
    </section>
  </section>
</main>
<script>
(() => {
  'use strict';

  const JPY_PER_USD = 150;
  const $ = (id) => document.getElementById(id);
  const panel = $('panel');
  const mic = $('mic');
  const mainbar = $('mainbar');
  const heard = $('heard');
  const outcome = $('outcome');
  const state = $('state');
  const historyToggle = $('history-toggle');
  const detailsToggle = $('details-toggle');
  const historyPanel = $('history-panel');
  const detailsPanel = $('details-panel');
  const deleteBanner = $('delete-banner');
  const key = new URL(location.href).searchParams.get('k') || '';
  const endpoint = (path) => `${path}?k=${encodeURIComponent(key)}`;
  const received = { snapshot: 0, decision: 0, stt: 0, level: 0, mic: 0, error: 0 };

  let setup = null;
  let setupAction = null;
  let setupFailure = null;
  let snapshot = null;
  let lastDecision = null;
  let listening = false;
  let judging = false;
  let micStatus = null;
  let deleteCandidate = null;
  let bannerTimer = null;
  // 位置は枠（シェルの側）が持つ。中身は「動いた差」だけを伝えるので、
  // 自分の絶対位置は持たない（持つと、つかんだ瞬間に画面の左端へ飛ぶ）。
  let mode = 'tab';
  let drag = null;

  window.__akariPanel = { received };

  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const number = (value, fallback = 0) => Number.isFinite(Number(value)) ? Number(value) : fallback;
  const probability = (value) => clamp(number(value), 0, 1);
  const fixed = (value) => probability(value).toFixed(2);
  // labels で人の言葉が届いたときはそれを優先する。届かない新しい
  // 内部 id は、そのまま見せずに意味の広い言葉へ落とす。
  const OPERATION_LABELS = Object.freeze({
    none: '編集', split: '分割', delete: '削除', delete_item: '削除', scale: '大きさ',
    move_time: 'タイミング', move_pos: '画面内の位置', color: '色', volume: '音量',
    select: '選択', multi_select: '複数選択', edit_text: '文言', add_text: '文字入れ',
    undo: '取り消し', redo: 'やり直し', repeat: 'もう一回',
    item_opacity: '不透明度', item_rotate: '回転', item_duration: '長さ', item_blend: '重なり方',
    playback_relative_seek: '再生位置', playback_relative_play: '再生', playback_relative_pause: '停止',
    playback_relative_fit: '全体表示', playback_relative_loop: '繰り返し再生',
    playback_relative_zoom_in: 'タイムラインを拡大', playback_relative_zoom_out: 'タイムラインを縮小',
    cut_look_freeze: '止め絵', cut_look_transition: '切り替え', cut_look_transition_remove: '切り替えを外す',
    audio_duck: '音量の自動調整', audio_fade: 'フェード', audio_mute: 'ミュート',
    speed: '再生速度', text_style_preset: '文字スタイル', motion_keyframes: '動き',
    followup_replies_listen: '聞き取り', shell_ui_open: 'パネルを開く'
  });
  const GRAMMAR_LABELS = Object.freeze({
    'play.start': '再生', 'play.pause': '停止', 'mic.pause': '聞き取り停止', 'mic.resume': '聞き取り再開',
    'history.repeat': 'もう一回', 'history.repeat-times': '指定回数だけくり返す', 'history.redo': 'やり直し',
    'history.redo-as-undo': '取り消し', 'history.undo': '取り消し', 'seek.absolute-time': '時刻へ移動',
    'seek.cut': 'カットへ移動', 'seek.first': '先頭へ移動', 'seek.last': '最後へ移動',
    'seek.relative-back': '前へ移動', 'seek.relative-forward': '後ろへ移動',
    'selected.move.pixels': '画面内の位置', 'selected.rotate.degrees': '回転',
    'selected.scale.percent': '大きさ', 'selected.scale.multiplier': '大きさ'
  });
  const VALUE_LABELS = Object.freeze({
    none: 'なし', bigger: '大きく', smaller: '小さく', increase: '上げる', decrease: '下げる',
    set: '指定する', left: '左へ', right: '右へ', up: '上へ', down: '下へ',
    top_left: '左上へ', top_right: '右上へ', bottom_left: '左下へ', bottom_right: '右下へ',
    earlier: '前へ', later: '後ろへ', clockwise: '右回り', counterclockwise: '左回り'
  });
  const MISSING_LABELS = Object.freeze({
    which_knob: 'どの値', direction: '方向', amount: '量', position: '位置', color: '色', target: '対象'
  });
  const REJECT_LABELS = Object.freeze({
    missing_arg: '値が足りません', low_confidence: '確信が足りません', no_op: 'この操作はまだ対応していません'
  });
  const RISK_LABELS = Object.freeze({ none: '変更なし', reversible: '戻せる編集', destructive: '削除を含む編集' });
  const INTERNAL_TOKEN = /\b(?:[a-z][a-z0-9]*(?:_[a-z0-9]+)+|[a-z][a-z0-9-]*(?:\.[a-z0-9-]+)+)\b/giu;
  const tidy = (value) => String(value ?? '').replace(INTERNAL_TOKEN, '').replace(/「\s*」/g, '').replace(/\s{2,}/g, ' ').trim();
  const providedLabel = (id, prefix = '', allowSame = false) => {
    const raw = lastDecision?.labels?.[prefix + id] ?? lastDecision?.labels?.[id];
    if (raw == null || (!allowSame && (String(raw) === String(id) || String(raw) === `${prefix}${id}`))) return null;
    return tidy(raw) || null;
  };
  const operationLabel = (id) => providedLabel(id, 'op:') ?? OPERATION_LABELS[id] ?? '編集';
  const grammarLabel = (id) => GRAMMAR_LABELS[id] ?? '操作';
  const targetLabel = (id) => {
    if (id == null || id === '' || id === 'none') return null;
    return providedLabel(id, '', true) ?? '対象';
  };
  const seekLabel = (id) => {
    if (id == null || id === '' || id === 'none') return null;
    return providedLabel(id) ?? '移動先';
  };
  const valueLabel = (id) => {
    if (id == null || id === '' || id === 'none' || id === '—') return null;
    return providedLabel(id) ?? VALUE_LABELS[id] ?? (tidy(id) || null);
  };

  function expand() {
    if (!panel.classList.contains('expanded')) panel.classList.add('expanded');
  }

  async function post(path, body) {
    try {
      const response = await fetch(endpoint(path), {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!response.ok) throw new Error(`${response.status}`);
      return await response.json();
    } catch (error) {
      expand();
      outcome.textContent = `通信できません: ${error.message}`;
      setState('保留', 'hold');
      return { ok: false };
    }
  }

  function renderSetup() {
    if (!setup) return;
    let text = '', action = '', route = null;
    if (setup.platform === 'unsupported' || setup.mic === 'unsupported') text = 'この OS ではまだ聞き取れません（macOS 26 以降で使えます）';
    else if (setup.lab === 'missing') { text = 'AKARI Video Lab に接続すると使えます（接続は無料）'; action = '接続する'; route = '/open-settings'; }
    else if (setup.providerKey === 'missing') { text = 'OpenRouter の API キーを登録してください。料金はご自身の OpenRouter のアカウントにかかります'; action = '登録する'; route = '/open-settings'; }
    else if (setupFailure === 'rejected') { text = 'OpenRouter がこのキーを受け付けませんでした'; action = '登録し直す'; route = '/open-settings'; }
    else if (setupFailure === 'limit') text = '今日の上限に達しました';
    else if (setup.mic === 'denied') { text = 'マイクの使用が許可されていません'; action = 'システム設定を開く'; route = '/open-privacy'; }
    mic.disabled = !listening && (setup.platform !== 'ok' || setup.mic === 'unsupported' || setup.lab === 'missing' || setup.providerKey === 'missing');
    $('setup-message').textContent = text;
    $('setup-action').textContent = action;
    $('setup-action').hidden = !action;
    $('setup-banner').hidden = !text;
    setupAction = route;
    if (text) expand();
  }
  async function refreshStatus() {
    try {
      const response = await fetch(endpoint('/status'));
      if (!response.ok) return;
      const value = await response.json();
      if (!['ok', 'unsupported'].includes(value.platform)) return;
      setup = value; renderSetup();
    } catch { /* Older lab servers do not expose status. */ }
  }
  $('setup-action').addEventListener('click', async () => {
    if (setupAction) await post(setupAction, {});
    // An older shell may reject settings.open; retain the guidance in that case.
    await refreshStatus();
  });
  window.addEventListener('focus', () => { setupFailure = null; void refreshStatus(); });
  setInterval(refreshStatus, 2000);
  void refreshStatus();

  function renderMicNote() {
    const listeningText = listening ? '聞いています' : '聞き取り停止中';
    const statusText = micStatus == null ? '' : ` · マイク ${micStatus}`;
    $('mic-note').textContent = listeningText + statusText;
  }

  function setListening(on) {
    listening = Boolean(on);
    mic.classList.toggle('off', !listening);
    mic.title = listening ? '聞いています（押すと止める）' : '止まっています（押すと始める）';
    if (outcome.textContent === '待機中' || outcome.textContent === '話しかけてください') {
      outcome.textContent = listening ? '話しかけてください' : '待機中';
    }
    if (state.textContent === '待機' || state.textContent === '聞いています') {
      setState(listening ? '聞いています' : '待機');
    }
    renderMicNote();
  }

  function setJudging(on) {
    judging = Boolean(on);
    mic.classList.toggle('judging', judging && listening);
  }

  function setState(text, kind = '') {
    state.textContent = text;
    state.className = `state${kind ? ` ${kind}` : ''}`;
    state.hidden = text === '待機' || text === '聞いています';
  }

  function formatTimestamp(seconds) {
    const value = Math.max(0, number(seconds));
    const minutes = Math.floor(value / 60);
    const rest = Math.floor(value % 60);
    return `${minutes}:${String(rest).padStart(2, '0')}`;
  }

  function navigationSeconds(fired) {
    for (const item of fired) {
      const match = String(item).match(/^seek\s*→\s*(-?\d+(?:\.\d+)?)秒/u);
      if (match) return Number(match[1]);
    }
    return null;
  }

  function editParts(payload) {
    const decision = payload.decision ?? {};
    const parts = [targetLabel(decision.target), operationLabel(decision.op)].filter(Boolean);
    const extra = payload.extra ?? {};
    const direction = valueLabel(extra.direction);
    const color = valueLabel(extra.color);
    const position = valueLabel(extra.position);
    if (direction) parts.push(direction);
    if (Number.isFinite(extra.amount) && ![0, 1].includes(extra.amount)) parts.push(`量 ${extra.amount}`);
    if (color) parts.push(color);
    if (position && position !== direction) parts.push(position);
    return parts;
  }

  function decisionPresentation(payload) {
    const decision = payload.decision ?? {};
    const fired = Array.isArray(payload.fired) ? payload.fired : [];
    const missingArgs = Array.isArray(payload.missingArgs) ? payload.missingArgs : [];
    const gate = snapshot?.gate ?? {};
    const parts = editParts(payload);
    const destination = parts.slice(0, 2).join(' › ') || '編集';
    const missing = Boolean(payload.held) && (payload.reject === 'missing_arg' || missingArgs.length > 0);
    const confidenceHold = Boolean(payload.held) && (payload.reject === 'low_confidence'
      || /(?:確信度|言い切っていない)/.test(payload.held?.reason ?? ''));
    const localFailed = payload.decisionSource === 'local-grammar' && payload.applied === false;

    if (missing) {
      const prompt = missingArgs.includes('target') ? '対象を選んでください' : '値を入れてください';
      return { text: `連れていった: ${destination}（${prompt}）`, state: '案内', kind: 'hold' };
    }
    if (confidenceHold) {
      return { text: `連れていった: ${destination}（確信が足りないので実行していません）`, state: '案内', kind: 'hold' };
    }
    if (localFailed || payload.held) {
      const reason = tidy(payload.held?.reason) || '操作を実行できませんでした';
      return { text: `保留: ${reason}`, state: '保留', kind: 'hold' };
    }
    const navigationOnly = fired.length > 0 && fired.every((item) => /^(?:seek|select)\b/u.test(String(item)));
    const selected = navigationOnly && fired.some((item) => /^select\b/u.test(String(item)));
    if (selected) {
      return { text: `選択: ${targetLabel(decision.target) ?? '対象'}`, state: '選択', kind: '' };
    }
    const seconds = navigationSeconds(fired);
    const moved = navigationOnly && (seconds != null || fired.some((item) => /^seek\b/u.test(String(item))));
    if (moved) {
      const where = seconds == null ? seekLabel(decision.seek_to) ?? '移動先' : formatTimestamp(seconds);
      return { text: `移動: ${where}`, state: '移動', kind: '' };
    }
    if (fired.length) {
      return { text: `変えた: ${parts.join(' › ') || '編集'}`, state: '実行', kind: 'exec' };
    }
    if (payload.reject) {
      return { text: `保留: ${REJECT_LABELS[payload.reject] ?? '操作を実行していません'}`, state: '保留', kind: 'hold' };
    }
    if (Number.isFinite(gate.command) && number(decision.is_command) < gate.command) {
      return { text: '操作の依頼ではないため、何もしません', state: '依頼ではない', kind: 'ignore' };
    }
    return { text: '実行する操作はありませんでした', state: '保留', kind: 'hold' };
  }

  function renderHistory() {
    const done = Array.isArray(snapshot?.done) ? snapshot.done : [];
    $('history-count').textContent = String(done.length);
    const list = $('history-list');
    list.replaceChildren();
    if (!done.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'まだありません';
      list.append(empty);
      return;
    }
    [...done].reverse().forEach((entry) => {
      const row = document.createElement('div');
      row.className = 'history-row';
      row.dataset.entryId = entry.id;
      const copy = document.createElement('span');
      copy.className = 'history-copy';
      const title = document.createElement('b');
      title.textContent = tidy(entry.label) || targetLabel(entry.target) || '変更';
      const detail = document.createElement('small');
      detail.textContent = tidy(entry.text) || [operationLabel(entry.op), targetLabel(entry.target)].filter(Boolean).join(' › ');
      copy.append(title, detail);
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'undo-button';
      button.textContent = '戻す';
      button.dataset.undoId = entry.id;
      button.addEventListener('click', () => post('/undo-entry', { id: entry.id }));
      row.append(copy, button);
      list.append(row);
    });
  }

  function distributionRow(name, list, threshold, kind, confidence = null, fallback = null) {
    const items = Array.isArray(list) && list.length ? list : (fallback ? [fallback] : [['—', 0]]);
    const top = items[0];
    const humanize = kind === 'operation' ? operationLabel
      : kind === 'target' ? targetLabel
        : kind === 'seek' ? seekLabel : (id) => tidy(id) || '—';
    const topName = humanize(top[0]) ?? '—';
    const topProbability = probability(top[1]);
    const next = items.slice(1, 3).map(([id, value]) => `${humanize(id) ?? '—'} ${fixed(value)}`).join(' / ');
    const confidenceText = typeof confidence === 'number' && Number.isFinite(confidence) ? `確信度 ${confidence.toFixed(2)}` : '';
    return { name, topName, topProbability, threshold, next: [confidenceText, next].filter(Boolean).join(' · ') };
  }

  function renderDetails() {
    const box = $('details');
    box.replaceChildren();
    if (!lastDecision) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'まだ判断がありません';
      box.append(empty);
      return;
    }

    const payload = lastDecision;
    if (payload.decisionSource === 'local-grammar') {
      const note = document.createElement('div');
      note.className = 'detail-meta';
      note.textContent = `${payload.applied === false ? 'ローカルで保留' : 'ローカルで実行'} · ${grammarLabel(payload.grammarRule)}`;
      box.append(note);
      return;
    }
    const decision = payload.decision ?? {};
    const probs = payload.probs ?? {};
    const conf = payload.conf ?? {};
    const gate = snapshot?.gate ?? {};
    const final = payload.final === true;
    const riskGate = gate.edit?.[payload.risk];
    const editGate = Number.isFinite(riskGate)
      ? (Number.isFinite(payload.editGate) ? payload.editGate : riskGate) : undefined;
    const rows = [
      distributionRow('依頼か', [['依頼', probability(decision.is_command)]], gate.command, 'literal', null),
      distributionRow('言い切り', [['言い切った', probability(decision.complete)]], final ? gate.completeOnFinal : gate.complete, 'literal', null),
      distributionRow('操作', probs.op, editGate, 'operation', conf.op),
      distributionRow('対象', probs.target, editGate, 'target', conf.target, ['none', 0]),
      distributionRow('移動先', probs.seek_to, final ? gate.seekOnFinal : gate.seek, 'seek', conf.seek_to, ['none', 0])
    ];
    const decisionText = payload.reject ? REJECT_LABELS[payload.reject] ?? '保留'
      : Number.isFinite(editGate) ? `しきい値 ${editGate.toFixed(2)} / ${RISK_LABELS[payload.risk] ?? '編集'}`
        : RISK_LABELS[payload.risk] ?? '編集';
    rows.push({ name: '判定', topName: decisionText, topProbability: editGate, threshold: editGate,
      next: (payload.missingArgs ?? []).map((id) => MISSING_LABELS[id] ?? '詳細').join('、') });

    const grid = document.createElement('div');
    grid.className = 'detail-grid';
    ['項目', 'いちばん上', '確率バー', '確信', rows.some(row => Number.isFinite(row.threshold)) ? '次点 ／ ｜= しきい値' : '次点'].forEach((text) => {
      const cell = document.createElement('span');
      cell.className = 'head';
      cell.textContent = text;
      grid.append(cell);
    });
    rows.forEach((row) => {
      const keyCell = document.createElement('span');
      keyCell.className = 'detail-key';
      keyCell.textContent = row.name;
      const nameCell = document.createElement('span');
      nameCell.className = 'detail-name';
      nameCell.title = row.topName;
      nameCell.textContent = row.topName;
      const bar = document.createElement('span');
      bar.className = 'probability';
      const fill = document.createElement('i');
      fill.style.width = `${probability(row.topProbability) * 100}%`;
      bar.append(fill);
      if (Number.isFinite(row.threshold)) {
        const marker = document.createElement('u');
        marker.style.left = `${probability(row.threshold) * 100}%`;
        bar.append(marker);
      }
      const valueCell = document.createElement('span');
      valueCell.className = 'detail-value';
      valueCell.textContent = fixed(row.topProbability);
      const nextCell = document.createElement('span');
      nextCell.className = 'detail-next';
      nextCell.title = row.next;
      nextCell.textContent = row.next;
      grid.append(keyCell, nameCell, bar, valueCell, nextCell);
    });

    const costUsd = number(payload.utteranceCost?.usd, number(payload.usage?.cost));
    const meta = document.createElement('div');
    meta.className = 'detail-meta';
    const latency = document.createElement('span');
    latency.textContent = `${Math.round(number(payload.latencyMs))}ms`;
    const cost = document.createElement('span');
    cost.textContent = `¥${(costUsd * JPY_PER_USD).toFixed(2)}`;
    const rate = document.createElement('small');
    rate.className = 'rate-note';
    rate.textContent = `¥（1 USD = ${JPY_PER_USD} 円の概算）`;
    meta.append(latency, cost, rate);
    box.append(grid, meta);
  }

  function hideDeleteBanner() {
    if (bannerTimer) clearTimeout(bannerTimer);
    bannerTimer = null;
    deleteBanner.hidden = true;
    deleteBanner.replaceChildren();
  }

  function showDeleteBanner(entry) {
    hideDeleteBanner();
    const text = document.createElement('span');
    text.textContent = `消した: ${entry.label || '項目'} — `;
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = '戻す';
    button.dataset.undoId = entry.id;
    button.addEventListener('click', () => {
      post('/undo-entry', { id: entry.id });
      hideDeleteBanner();
    });
    deleteBanner.append(text, button);
    deleteBanner.dataset.shownAt = String(Date.now());
    deleteBanner.dataset.entryId = entry.id;
    deleteBanner.hidden = false;
    bannerTimer = setTimeout(hideDeleteBanner, 8000);
  }

  function onSnapshot(payload) {
    snapshot = payload;
    setListening(payload.listening);
    if (/OpenRouter.*拒否/.test(payload.banner?.text ?? '')) setupFailure = 'rejected';
    else if (/今日の上限/.test(payload.banner?.text ?? '')) setupFailure = 'limit';
    renderSetup();
    renderHistory();
    if (!detailsPanel.hidden) renderDetails();
    if (deleteCandidate) {
      const candidate = deleteCandidate;
      deleteCandidate = null;
      const entry = (payload.done ?? []).find((item) => item.operationId === candidate.operationId);
      if (entry) {
        expand();
        showDeleteBanner(entry);
      }
    }
  }

  function onStt(payload) {
    expand();
    heard.textContent = payload.text ?? '';
    heard.classList.toggle('partial', payload.final !== true);
    outcome.textContent = payload.final ? '言葉を判断しています' : '聞き取り中…';
    setState('判断中', 'judging');
    setJudging(true);
  }

  function onDecision(payload) {
    expand();
    lastDecision = payload;
    setJudging(false);
    heard.textContent = payload.text ?? heard.textContent;
    heard.classList.toggle('partial', payload.final !== true);
    const presentation = decisionPresentation(payload);
    const localExecution = payload.decisionSource === 'local-grammar' && payload.applied !== false
      ? `ローカルで実行 · ${grammarLabel(payload.grammarRule)}` : null;
    outcome.textContent = localExecution ? `${localExecution} — ${presentation.text}` : presentation.text;
    setState(localExecution ? '実行' : presentation.state, localExecution ? 'exec' : presentation.kind);
    const fired = Array.isArray(payload.fired) ? payload.fired : [];
    if (!detailsPanel.hidden) renderDetails();

    if (payload.risk === 'destructive' && payload.final === true && fired.length > 0) {
      hideDeleteBanner();
      deleteCandidate = { operationId: payload.operationId, at: Date.now() };
    }
  }

  function onLevel(payload) {
    const scale = payload.speaking ? 1 + Math.min(.12, Math.sqrt(Math.max(0, number(payload.rms))) * .18) : 1;
    mic.style.setProperty('--level', scale.toFixed(3));
  }

  mic.addEventListener('click', () => {
    if (mic.disabled) return;
    const next = !listening;
    setListening(next);
    post('/listen', { on: next });
  });

  historyToggle.addEventListener('click', () => {
    const open = historyPanel.hidden;
    historyPanel.hidden = !open;
    historyToggle.setAttribute('aria-expanded', String(open));
    if (open) {
      detailsPanel.hidden = true;
      detailsToggle.setAttribute('aria-expanded', 'false');
      renderHistory();
    }
  });

  detailsToggle.addEventListener('click', () => {
    const open = detailsPanel.hidden;
    detailsPanel.hidden = !open;
    detailsToggle.setAttribute('aria-expanded', String(open));
    if (open) {
      historyPanel.hidden = true;
      historyToggle.setAttribute('aria-expanded', 'false');
      renderDetails();
    }
  });

  $('undo-latest').addEventListener('click', () => post('/undo', {}));

  function reportSize(extra = {}) {
    const rect = panel.getBoundingClientRect();
    window.parent.postMessage({
      type: 'akari-companion-panel',
      width: clamp(Math.round(rect.width), 44, 720),
      height: clamp(Math.round(rect.height), 44, 720),
      mode,
      ...extra
    }, '*');
  }

  window.addEventListener('message', (event) => {
    if (event.source !== window.parent || event.data?.type !== 'akari-companion-frame') return;
    const width = event.data.width;
    if (typeof width !== 'number' || !Number.isFinite(width)) return;
    panel.style.setProperty('--expanded-width', `${clamp(Math.round(width), 360, 720)}px`);
    panel.style.setProperty('--expanded-max-height', '720px');
    reportSize();
  });

  // 位置は枠（シェルの側）が持っている。ここは「動いた差」だけを伝える
  // （中身に絶対位置を持たせると、つかんだ瞬間に画面の左端へ飛ぶ）。
  const DRAG_THRESHOLD = 4;
  let suppressClick = false;

  // 差は **画面の座標** で測る。枠が動くと iframe ごと動くので、iframe の中の
  // 座標（clientX/Y）で測ると動かしたぶんが打ち消され、追いかけっこで震える。
  mainbar.addEventListener('pointerdown', (event) => {
    if (event.button !== 0) return;
    // 小さいとき（丸だけ）は帯の全部がボタンなので、ボタンの上でも受ける。
    // 4px 動くまでは押下のままなので、ふつうの押下は今までどおり効く。
    drag = { pointerId: event.pointerId, startX: event.screenX, startY: event.screenY,
      lastX: event.screenX, lastY: event.screenY, moved: false };
  });
  mainbar.addEventListener('pointermove', (event) => {
    if (!drag || drag.pointerId !== event.pointerId) return;
    if (!drag.moved) {
      if (Math.hypot(event.screenX - drag.startX, event.screenY - drag.startY) < DRAG_THRESHOLD) return;
      drag.moved = true;
      mainbar.classList.add('dragging');
      // ここから先は枠が引き受ける（枠が動くと iframe は指の下から逃げるため）。
      window.parent.postMessage({ type: 'akari-companion-panel', drag: { phase: 'start' } }, '*');
    }
  });
  const stopDrag = (event) => {
    if (!drag || drag.pointerId !== event.pointerId) return;
    const moved = drag.moved;
    drag = null;
    mainbar.classList.remove('dragging');
    if (moved) { suppressClick = true; reportSize(); }
  };
  // 動かしたときは、離したあとの押下を 1 回だけ飲み込む（丸を押して止めてしまわないため）。
  mainbar.addEventListener('click', (event) => {
    if (!suppressClick) return;
    suppressClick = false;
    event.preventDefault();
    event.stopPropagation();
  }, true);
  mainbar.addEventListener('pointerup', stopDrag);
  mainbar.addEventListener('pointercancel', stopDrag);
  mainbar.addEventListener('dblclick', (event) => {
    if (event.target.closest('button')) return;
    // 二度押しで既定の置き場所へ戻す（枠の側が呼び出しボタンの真下へ置き直す）。
    mode = 'tab';
    reportSize({ placement: 'default' });
  });

  const source = new EventSource(endpoint('/events'));
  const receive = (type, payload) => {
    received[type] += 1;
    if (type === 'snapshot') onSnapshot(payload);
    else if (type === 'decision') onDecision(payload);
    else if (type === 'stt') onStt(payload);
    else if (type === 'level') onLevel(payload);
    else if (type === 'mic') {
      micStatus = payload.status ?? '不明';
      renderMicNote();
      void refreshStatus();
    }
    else if (type === 'error') {
      expand();
      outcome.textContent = payload.message ?? 'エラー';
      setState('保留', 'hold');
    }
  };
  // 検査は係と同じ受信口に payload を流し込む。表示専用の別経路は持たない。
  window.__akariPanel.receive = receive;
  ['snapshot', 'decision', 'stt', 'level', 'mic', 'error'].forEach((type) => {
    source.addEventListener(type, (event) => {
      if (!event.data) return;
      const payload = JSON.parse(event.data);
      receive(type, payload);
    });
  });

  // ResizeObserver が渡す entries をそのまま reportSize へ流すと、
  // 複製できない DOM の値が postMessage に混ざって送信ごと落ちる。引数は捨てる。
  const observer = new ResizeObserver(() => reportSize());
  observer.observe(panel);
  reportSize();
})();
</script>
</body>
</html>
