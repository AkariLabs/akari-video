<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AKARI 素材 — 1ビュー</title>
<style>
  :root { --bg:#faf9f7; --panel:#fff; --line:#e7e2da; --text:#1f1c18; --muted:#8a8378; --accent:#e8590c; --ok:#2f9e44; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:"Hiragino Sans","Yu Gothic",sans-serif; background:var(--bg); color:var(--text); font-size:14px; }
  header { position:sticky; top:0; z-index:5; background:rgba(250,249,247,.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:10px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:15px; font-weight:800; }
  header h1 em { color:var(--accent); font-style:normal; }
  .home { margin-left:auto; font-size:11.5px; color:var(--muted); font-family:ui-monospace,monospace; }
  .toolbar { padding:10px 18px 0; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip-btn { border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:5px 12px; font-size:12.5px; cursor:pointer; color:var(--text); font-family:inherit; }
  .chip-btn:hover { border-color:var(--accent); }
  .chip-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .search { flex:1; min-width:200px; max-width:340px; border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:13px; font-family:inherit; background:var(--panel); }
  .search:focus { outline:none; border-color:var(--accent); }
  .meta-line { padding:8px 18px 0; color:var(--muted); font-size:12px; }
  main { display:grid; grid-template-columns:1fr 340px; gap:0; }
  .grid { padding:12px 18px 40px; display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; align-content:start; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; position:relative; transition:border-color .15s; }
  .card:hover { border-color:var(--accent); }
  .card.selected { outline:2px solid var(--accent); }
  .card .ph { aspect-ratio:16/9; background:linear-gradient(135deg,#ece7df,#d9d2c7); overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; }
  .card.audio .ph { aspect-ratio:2.2/1; }
  .card .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .card .cap { padding:8px 10px; display:flex; align-items:center; gap:6px; }
  .card .cap b { font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .badge { position:absolute; top:8px; right:8px; font-size:11px; padding:2px 8px; border-radius:999px; background:rgba(255,255,255,.92); border:1px solid var(--line); }
  .badge.got { background:var(--ok); border-color:var(--ok); color:#fff; }
  .badge.paid { background:#1f1c18; border-color:#1f1c18; color:#ffd8a8; }
  .kind { font-size:10.5px; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:1px 5px; flex:none; }
  aside { border-left:1px solid var(--line); background:var(--panel); position:sticky; top:49px; height:calc(100vh - 49px); overflow-y:auto; padding:16px; }
  aside .empty { color:var(--muted); font-size:12.5px; padding-top:40vh; text-align:center; }
  aside img.big { width:100%; border-radius:10px; border:1px solid var(--line); }
  aside h2 { font-size:15px; margin:10px 0 2px; }
  aside .id { font-size:11px; color:var(--muted); font-family:ui-monospace,monospace; }
  .tagrow { display:flex; flex-wrap:wrap; gap:4px; margin:8px 0; }
  .tagrow span { font-size:11px; border:1px solid var(--line); border-radius:999px; padding:1px 8px; color:var(--muted); }
  aside audio { width:100%; margin-top:8px; }
  .actions { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .btn { border:0; border-radius:8px; padding:9px 12px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; background:var(--accent); color:#fff; }
  .btn.secondary { background:var(--panel); color:var(--text); border:1px solid var(--line); font-weight:600; }
  .btn:disabled { opacity:.55; cursor:default; }
  .proj input { width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12px; font-family:ui-monospace,monospace; margin-bottom:6px; }
  .note { font-size:11.5px; color:var(--muted); margin-top:6px; line-height:1.5; }
  .msg { font-size:12px; margin-top:8px; padding:8px 10px; border-radius:8px; display:none; }
  .msg.ok { display:block; background:#ebfbee; color:#2b8a3e; }
  .msg.err { display:block; background:#fff5f5; color:#c92a2a; }
  details.prompt { margin-top:8px; font-size:12px; color:var(--muted); }
  details.prompt p { margin-top:4px; line-height:1.55; }
</style>
</head>
<body>
<header>
  <h1>AKARI Video — 素材 <em>1ビュー</em></h1>
  <span class="home" id="home-line">…</span>
</header>
<div class="toolbar" id="chips"></div>
<div class="toolbar">
  <input class="search" id="search" type="search" placeholder="タイトル・タグで探す">
  <button class="chip-btn" id="only-got">取得済みのみ</button>
</div>
<p class="meta-line" id="count-line">…</p>
<main>
  <div class="grid" id="grid"></div>
  <aside id="detail"><p class="empty">カードを選ぶと詳細と取得操作が出ます</p></aside>
</main>
<script src="app.js"></script>
</body>
</html>
