<div class="sparse-card">
  <style>
    .sparse-card { opacity: 1; transform: translateY(0); animation: sparse-entry 400ms both; }
    @keyframes sparse-entry {
      from { opacity: 0; transform: translateY(20px); }
      60% { opacity: 1; transform: translateY(-2px); }
      to { transform: translateY(0); }
    }
  </style>
  Sparse keyframes
</div>
