<div class="cap-b-root" style="--x: 0px; --y: 0px; --scale: 1; --rotate: 0deg; --font-size: 40px; --color: #ffe08a;">
  <style>
    .cap-b-root { position: absolute; left: 50%; bottom: 15%; transform: translateX(-50%); }
    .cap-b-root .box {
      display: inline-block; padding: 12px 28px; border-radius: 10px;
      background: rgba(10, 10, 16, 0.75); color: var(--color);
      font-size: var(--font-size); font-weight: 700;
      font-family: "Hiragino Sans", sans-serif;
      animation: cap-b-in 500ms ease-out both;
    }
    @keyframes cap-b-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <span class="box">字幕B</span>
</div>
