<div class="sampled-middle">
  <style>
    [data-akari-active] .sampled-middle, [data-no-timeline] .sampled-middle { animation: sampled-middle 1.2s ease-in-out both; }
    @keyframes sampled-middle {
      0% { opacity: 0; transform: scale(.7); }
      50% { opacity: .8; transform: scale(1.08); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
  <canvas style="position:absolute;inset:0;width:100%;height:100%"></canvas>
  <div data-akari-3d-fallback>3D fallback</div>
  <script type="application/json" data-akari-3d-scene>{"model":"assets/scene3d/smartphone-mockup/model.glb"}</script>
</div>
