<div class="sampled-descendant">
  <style>
    [data-akari-active] .sampled-descendant, [data-no-timeline] .sampled-descendant { animation: sampled-root-fade 1s linear both; }
    .deco { animation: sampled-deco 1s linear infinite; }
    @keyframes sampled-root-fade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes sampled-deco { from { opacity: .5; } to { opacity: 1; } }
  </style>
  <canvas style="position:absolute;inset:0;width:100%;height:100%"></canvas>
  <div class="deco">Decoration</div>
  <div data-akari-3d-fallback>3D fallback</div>
  <script type="application/json" data-akari-3d-scene>{"model":"assets/scene3d/smartphone-mockup/model.glb"}</script>
</div>
