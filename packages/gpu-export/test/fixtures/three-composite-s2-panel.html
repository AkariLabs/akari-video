<div class="s2-panel">
  <style>
    .s2-panel { position: absolute; inset: 0; perspective: 900px; }
    .s2-panel__canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .s2-panel__chat { position: absolute; right: 48px; top: 36px; width: 240px; padding: 18px; border-radius: 18px; background: rgba(12, 20, 38, .92); color: white; transform-style: preserve-3d; }
    .s2-panel__message { margin: 8px 0; padding: 10px; border-radius: 10px; background: rgba(34, 211, 238, .18); }
    [data-akari-active] .s2-panel__chat, [data-no-timeline] .s2-panel__chat { animation: s2-panel__turn 1.2s ease-out both; }
    [data-akari-active] .s2-panel__message:nth-child(1), [data-no-timeline] .s2-panel__message:nth-child(1) { animation: s2-panel__message-1 .8s ease-out .2s both; }
    [data-akari-active] .s2-panel__message:nth-child(2), [data-no-timeline] .s2-panel__message:nth-child(2) { animation: s2-panel__message-2 .8s ease-out .35s both; }
    [data-akari-active] .s2-panel__message:nth-child(3), [data-no-timeline] .s2-panel__message:nth-child(3) { animation: s2-panel__message-3 .8s ease-out .5s both; }
    [data-akari-active] .s2-panel__badge, [data-no-timeline] .s2-panel__badge { animation: s2-panel__badge 1s ease-in-out .65s both; }
    @keyframes s2-panel__turn { from { opacity: 0; transform: rotateY(58deg) translateZ(40px); } to { opacity: 1; transform: rotateY(-8deg) translateZ(40px); } }
    @keyframes s2-panel__message-1 { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes s2-panel__message-2 { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes s2-panel__message-3 { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes s2-panel__badge { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  </style>
  <canvas class="s2-panel__canvas"></canvas>
  <div data-akari-3d-fallback>3D fallback</div>
  <section class="s2-panel__chat">
    <div class="s2-panel__message">GPU rendering is ready.</div>
    <div class="s2-panel__message">The panel stays above the model.</div>
    <div class="s2-panel__message">DOM order is preserved.</div>
    <strong class="s2-panel__badge">LIVE</strong>
  </section>
  <script type="application/json" data-akari-3d-scene>{"model":"assets/scene3d/smartphone-mockup/model.glb"}</script>
</div>
