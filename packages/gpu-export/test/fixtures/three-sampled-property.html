<div class="sampled-property">
  <style>
    @property --entrance-scale { syntax: '<number>'; inherits: false; initial-value: .75; }
    [data-akari-active] .sampled-property, [data-no-timeline] .sampled-property { animation: sampled-property 1s ease-out both; }
    .sampled-property { opacity: var(--entrance-scale); transform: scale(var(--entrance-scale)); }
    @keyframes sampled-property { from { --entrance-scale: .75; } to { --entrance-scale: 1; } }
  </style>
  <canvas style="position:absolute;inset:0;width:100%;height:100%"></canvas>
  <div data-akari-3d-fallback>3D fallback</div>
  <script type="application/json" data-akari-3d-scene>{"model":"assets/scene3d/smartphone-mockup/model.glb"}</script>
</div>
