<div class="s1-composite">
  <style>
    .s1-composite { position: absolute; inset: 0; }
    .s1-composite__canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .s1-composite__title, .s1-composite__rule, .s1-composite__tag { position: absolute; left: 48px; color: white; }
    .s1-composite__title { top: 42px; font: 700 42px sans-serif; }
    .s1-composite__rule { top: 100px; width: 220px; height: 4px; background: #22d3ee; }
    .s1-composite__tag { top: 120px; padding: 8px 12px; background: #7c3aed; }
    [data-akari-active] .s1-composite__title, [data-no-timeline] .s1-composite__title { animation: s1-composite-title 1s ease-out both; }
    [data-akari-active] .s1-composite__rule, [data-no-timeline] .s1-composite__rule { animation: s1-composite-rule .8s ease-out .15s both; }
    [data-akari-active] .s1-composite__tag, [data-no-timeline] .s1-composite__tag { animation: s1-composite-tag .8s ease-out .3s both; }
    @keyframes s1-composite-title { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes s1-composite-rule { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }
    @keyframes s1-composite-tag { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes s1-composite-spare-1 { from { opacity: .1; } to { opacity: 1; } }
    @keyframes s1-composite-spare-2 { from { transform: translateX(10px); } to { transform: translateX(0); } }
    @keyframes s1-composite-spare-3 { from { opacity: .2; } to { opacity: .8; } }
    @keyframes s1-composite-spare-4 { from { transform: translateY(10px); } to { transform: translateY(0); } }
    @keyframes s1-composite-spare-5 { from { opacity: .3; } to { opacity: .9; } }
  </style>
  <canvas class="s1-composite__canvas"></canvas>
  <div data-akari-3d-fallback>3D fallback</div>
  <h1 class="s1-composite__title">Sampled Composite</h1>
  <div class="s1-composite__rule"></div>
  <div class="s1-composite__tag">GPU + DOM</div>
  <script type="application/json" data-akari-3d-scene>{"model":"assets/scene3d/smartphone-mockup/model.glb"}</script>
</div>
