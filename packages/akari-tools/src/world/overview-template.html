<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AKARI World Overview</title>
<style>
:root{color-scheme:dark;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d1017;color:#edf2ff}*{box-sizing:border-box}body{margin:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid #30384a;background:#111620;min-height:58px}h1{font-size:17px;margin:0 auto 0 0}button,select{color:inherit;background:#202838;border:1px solid #465169;border-radius:6px;padding:6px 9px}button{cursor:pointer}main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px}.stage{padding:12px;display:grid;grid-template-rows:auto minmax(120px,1fr) auto auto auto;gap:9px;min-width:0}.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.toolbar label{white-space:nowrap}.map{position:relative;overflow:hidden;border:1px solid #30384a;border-radius:10px;background:#f5f2eb;touch-action:none}.map iframe,.map canvas{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}.fallback-note{position:absolute;left:12px;bottom:12px;padding:8px 11px;background:#34283cdd;border:1px solid #ce328b;border-radius:7px}body:not([data-fallback]) .fallback-note{display:none}.band{display:flex;height:38px;overflow:hidden;border:1px solid #30384a;border-radius:7px}.world-band{position:relative;display:grid;place-items:center;color:#111;font-weight:800}.edge-marker{position:absolute;right:-4px;z-index:2;width:8px;height:100%;background:#fff}.edges{display:flex;gap:5px;overflow:auto}.edge-chip{font-size:11px;white-space:nowrap}input[type=range]{width:100%}aside{padding:16px;border-left:1px solid #30384a;background:#141924;overflow:auto}.video-slot{aspect-ratio:16/9;max-height:32vh;border:1px dashed #526079;border-radius:8px;display:grid;place-items:center;color:#8d9ab3;margin-bottom:15px;overflow:hidden}video{width:100%;height:100%;object-fit:contain}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:15px}.stats div{padding:8px;background:#1e2533;border-radius:6px}dl{display:grid;grid-template-columns:90px 1fr;gap:8px;margin:0}dt{color:#8d9ab3}dd{margin:0;overflow-wrap:anywhere}@media (max-width:900px){body{height:auto;min-height:100vh;overflow:auto}main{display:block;flex:none}.stage{display:block;padding:12px}.stage>*+*{margin-top:9px}.map{height:42vh;min-height:220px}aside{border-left:0;border-top:1px solid #30384a;max-height:none;overflow:visible}.video-slot{max-height:none}}
</style></head>
<body __FALLBACK_ATTRIBUTE__>
<header><h1>World Overview</h1><button id="observe3d" disabled title="spatial の build 票の後">3D 観察</button><button id="play">再生</button><label>速度 <select id="speed"><option>0.5</option><option selected>1</option><option>2</option></select></label><output id="time">0.000 s</output></header>
<main><section class="stage">
<div class="toolbar"><button id="fit">全体を表示</button><button id="plus">＋</button><button id="minus">−</button><label><input id="camera-path" type="checkbox" checked> カメラ軌道</label><label><input id="carry-path" type="checkbox" checked> 素材の軌道</label><label><input id="follow" type="checkbox"> カメラを追う</label><select id="jumps" aria-label="場面ジャンプ"><option value="">場面ジャンプ</option></select></div>
<div class="map" id="map"><iframe id="atlas" title="実素材アトラス"></iframe><canvas id="overlay"></canvas><div class="fallback-note" id="fallback-note"><code>akari world build</code> を実行すると実際の素材が並びます</div></div>
<input id="scrub" type="range" min="0" max="__DURATION__" value="0" step="0.001" aria-label="時刻">
<div class="band" id="band">__WORLD_BANDS__</div><div class="edges" id="edges">__EDGE_CHIPS__</div>
</section><aside><div class="video-slot" id="videos">__VIDEOS__</div><div class="stats"><div>X<br><b id="x">-</b></div><div>Y<br><b id="y">-</b></div><div>倍率<br><b id="scale">-</b></div></div><dl id="details"><dt>world</dt><dd>-</dd><dt>停留所 / 辺</dt><dd>-</dd><dt>型</dt><dd>-</dd><dt>transition</dt><dd>-</dd><dt>cover</dt><dd>-</dd><dt>via</dt><dd>-</dd><dt>carry</dt><dd>-</dd></dl></aside></main>
<script>__CAMERA_SOURCE__</script><script>__RUNTIME_SOURCE__</script>
<script>
(()=>{
const worldMap=__WORLD_MAP__,proofFrames=__CAMERA_PROOF__,atlasEnabled=__ATLAS_ENABLED__,atlasDocument=__ATLAS_DOCUMENT__,editable=worldMap.kind==='flat';
const cameraAt=globalThis.__akariCreateCamera(worldMap),mapNode=document.getElementById('map'),canvas=document.getElementById('overlay'),ctx=canvas.getContext('2d'),scrub=document.getElementById('scrub'),atlas=document.getElementById('atlas'),video=document.querySelector('video');
let hostApi=null;try{hostApi=typeof acquireVsCodeApi==='function'?acquireVsCodeApi():typeof acquireTheiaApi==='function'?acquireTheiaApi():null}catch{}
let view={scale:1,ox:0,oy:0},seconds=0,playing=false,lastClock=0,lastDrawError=null,pendingRequest=null,drag=null,readyResolve;const ready=new Promise(resolve=>{readyResolve=resolve});document.getElementById('observe3d').hidden=editable;
const stopsById=new Map(worldMap.cameraStops.map(stop=>[stop.id,stop])),zonesById=new Map(worldMap.zones.map(zone=>[zone.id,zone]));
function overviewPoints(map){if(map.kind==='spatial')return map.worlds.flatMap(w=>{const c=w.spatial?.c||[0,0],f=w.spatial?.floor;if(!f)return[c];const fc=f.center||c,s=f.size||[1,1];return[[fc[0]-s[0]/2,fc[1]-s[1]/2],[fc[0]+s[0]/2,fc[1]+s[1]/2],c]});return map.worlds.flatMap(w=>{const b=w.flat.bounds;return[[b[0],b[1]],[b[0]+b[2],b[1]+b[3]]]})}
function fitView(){const p=overviewPoints(worldMap),xs=p.map(v=>v[0]),ys=p.map(v=>v[1]),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),pad=40,w=mapNode.clientWidth,h=mapNode.clientHeight,dx=Math.max(1,maxX-minX),dy=Math.max(1,maxY-minY),scale=Math.min((w-pad*2)/dx,(h-pad*2)/dy);view={scale,ox:(w-dx*scale)/2-minX*scale,oy:(h-dy*scale)/2-minY*scale};draw()}
const screen=p=>[view.ox+p[0]*view.scale,view.oy+p[1]*view.scale];
function active(t){const stop=worldMap.cameraStops.find(s=>s.at<=t&&t<=s.leave);if(stop)return{label:stop.id,type:'stop'};const edge=worldMap.edges.find(e=>e.t0<=t&&t<=e.t1);return edge?{label:edge.id,type:edge.type,transition:edge.transition?.kind,cover:edge.transition?.cover,via:edge.via,carry:edge.carry}:{} }
function frameRect(){if(worldMap.kind!=='flat')return null;const camera=cameraAt(seconds),[cx,cy]=screen([camera.x,camera.y]),w=worldMap.frame.width/camera.scale*view.scale,h=worldMap.frame.height/camera.scale*view.scale;return{x:cx-w/2,y:cy-h/2,width:w,height:h}}
function worldRects(){return worldMap.kind==='flat'?worldMap.worlds.map(world=>{const b=world.flat.bounds,[x,y]=screen(b);return{id:world.id,x,y,width:b[2]*view.scale,height:b[3]*view.scale}}):[]}
function line(a,b,type,color,width=2){const p=screen(a),q=screen(b);ctx.setLineDash(type==='portal'?[7,5]:type==='cut'?[2,4]:[]);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(...p);ctx.lineTo(...q);ctx.stroke();ctx.setLineDash([])}
function fallbackDraw(camera){const runtimeDraw=globalThis.akari?.worldRuntime?.drawOverview;if(typeof runtimeDraw==='function'&&worldMap.kind==='flat')runtimeDraw(ctx,worldMap,view,seconds);else{for(const r of worldRects()){const world=worldMap.worlds.find(w=>w.id===r.id);ctx.fillStyle=world.palette?.background||'#30384a';ctx.strokeStyle=world.palette?.accent||'#fff';ctx.fillRect(r.x,r.y,r.width,r.height);ctx.strokeRect(r.x,r.y,r.width,r.height)}}}
function overlayDraw(camera){if(document.getElementById('camera-path').checked){for(const edge of worldMap.edges){const a=stopsById.get(edge.from),b=stopsById.get(edge.to);if(a&&b&&a.c&&b.c)line(a.c,b.c,edge.type,'#ce328b',2)}for(const frame of proofFrames){const c=frame.camera;if(c&&Number.isFinite(c.x)){const p=screen([c.x,c.y]);ctx.fillStyle='#ee82df88';ctx.fillRect(p[0]-1,p[1]-1,2,2)}}}if(document.getElementById('carry-path').checked)for(const edge of worldMap.edges.filter(e=>e.carry?.length)){const a=stopsById.get(edge.from),b=stopsById.get(edge.to),via=zonesById.get(edge.via);if(a&&b){if(via){line(a.c,via.c,'move','#159a9d',1.5);line(via.c,b.c,'move','#159a9d',1.5)}else line(a.c,b.c,'move','#159a9d',1.5);const p=screen(via?.c||[(a.c[0]+b.c[0])/2,(a.c[1]+b.c[1])/2]),label=edge.carry.join(', ');ctx.font='11px sans-serif';ctx.lineWidth=3;ctx.strokeStyle='#ffffffcc';ctx.strokeText(label,p[0]+5,p[1]-5);ctx.fillStyle='#0d6f70';ctx.fillText(label,p[0]+5,p[1]-5)}}const rect=frameRect();if(rect){ctx.fillStyle='#ee82df22';ctx.strokeStyle='#ce328b';ctx.lineWidth=2.5;ctx.fillRect(rect.x,rect.y,rect.width,rect.height);ctx.strokeRect(rect.x,rect.y,rect.width,rect.height)}for(const w of worldRects()){const label=worldMap.worlds.find(x=>x.id===w.id)?.label||w.id;ctx.font='600 12px sans-serif';ctx.lineWidth=3;ctx.strokeStyle='#ffffffcc';ctx.strokeText(label,w.x,w.y-7);ctx.fillStyle='#1b2130';ctx.fillText(label,w.x,w.y-7)}for(const stop of worldMap.cameraStops){const p=screen(stop.c),moving=drag?.kind==='stop'&&drag.stop.id===stop.id||pendingRequest?.stopId===stop.id;ctx.save();ctx.setLineDash(moving?[5,4]:[]);ctx.fillStyle=moving?'#f7d774':'#fff';ctx.strokeStyle=moving?'#f7d774':'#273044';ctx.lineWidth=moving?2:1.5;ctx.beginPath();ctx.arc(p[0],p[1],moving?6:5,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore()}}
function resize(){const dpr=devicePixelRatio||1,w=mapNode.clientWidth,h=mapNode.clientHeight;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);return{w,h}}
function draw(){try{const size=resize(),camera=cameraAt(seconds);if(document.getElementById('follow').checked&&worldMap.kind==='flat'){view.ox=size.w/2-camera.x*view.scale;view.oy=size.h/2-camera.y*view.scale}if(atlasEnabled&&atlas.contentWindow?.akariAtlasReady)atlas.contentWindow.akariAtlasRender(seconds,{...view,width:size.w,height:size.h});else if(!atlasEnabled)fallbackDraw(camera);overlayDraw(camera);document.getElementById('time').value=seconds.toFixed(3)+' s';scrub.value=String(seconds);document.getElementById('x').textContent=Number(camera.x??camera.eye?.[0]??0).toFixed(1);document.getElementById('y').textContent=Number(camera.y??camera.eye?.[1]??0).toFixed(1);document.getElementById('scale').textContent=Number(camera.scale??1).toFixed(2);const item=active(seconds),values=[camera.world,item.label||'-',item.type||'-',item.transition||'-',item.cover??'-',item.via||'-',(item.carry||[]).join(', ')||'-'];document.querySelectorAll('#details dd').forEach((node,i)=>node.textContent=String(values[i]));lastDrawError=null}catch(error){lastDrawError=String(error);console.error(error)}}
async function seek(t){seconds=Math.max(0,Math.min(Number(scrub.max),Number(t)||0));if(video&&Math.abs(video.currentTime-seconds)>.01){video.currentTime=seconds;await new Promise(resolve=>{const done=()=>{video.removeEventListener('seeked',done);resolve()};video.addEventListener('seeked',done);setTimeout(done,250)})}draw()}
function tick(now){if(!playing)return;if(video&&!video.paused)seconds=video.currentTime;else seconds=Math.min(Number(scrub.max),seconds+(now-lastClock)/1000*Number(document.getElementById('speed').value));lastClock=now;draw();if(seconds>=Number(scrub.max)){playing=false;document.getElementById('play').textContent='再生';return}requestAnimationFrame(tick)}
function togglePlay(){playing=!playing;document.getElementById('play').textContent=playing?'一時停止':'再生';if(playing){lastClock=performance.now();if(video){video.playbackRate=Number(document.getElementById('speed').value);video.play().catch(()=>{})}requestAnimationFrame(tick)}else video?.pause()}
const targets=[...worldMap.cameraStops.map(s=>({id:s.id,kind:'stop',time:(s.at+s.leave)/2})),...worldMap.edges.map(e=>({id:e.id,kind:'edge',time:(e.t0+e.t1)/2}))].sort((a,b)=>a.time-b.time);for(const target of targets){const option=document.createElement('option');option.value=target.id;option.textContent=`${target.kind==='stop'?'停留所':'辺'} · ${target.id}`;document.getElementById('jumps').append(option)}
document.getElementById('play').onclick=togglePlay;document.getElementById('fit').onclick=fitView;document.getElementById('plus').onclick=()=>zoomBy(1.2);document.getElementById('minus').onclick=()=>zoomBy(1/1.2);document.getElementById('jumps').onchange=e=>jumpTo(e.target.value);document.querySelectorAll('[data-edge-jump]').forEach(n=>n.onclick=()=>jumpTo(n.dataset.edgeJump));document.getElementById('camera-path').onchange=draw;document.getElementById('carry-path').onchange=draw;document.getElementById('follow').onchange=draw;scrub.oninput=()=>seek(scrub.value);
function zoomBy(f,cx=mapNode.clientWidth/2,cy=mapNode.clientHeight/2){const wx=(cx-view.ox)/view.scale,wy=(cy-view.oy)/view.scale;view.scale*=f;view.ox=cx-wx*view.scale;view.oy=cy-wy*view.scale;draw()}function panBy(dx,dy){view.ox+=dx;view.oy+=dy;draw()}function jumpTo(id){const target=targets.find(x=>x.id===id);if(target)return seek(target.time)}
mapNode.onpointerdown=e=>{const r=mapNode.getBoundingClientRect(),local=[e.clientX-r.left,e.clientY-r.top],stop=e.altKey&&editable&&!pendingRequest?worldMap.cameraStops.find(s=>{const p=screen(s.c);return Math.hypot(p[0]-local[0],p[1]-local[1])<=12}):null;drag=stop?{kind:'stop',stop,before:[...stop.c]}:{kind:'pan',x:e.clientX,y:e.clientY};mapNode.setPointerCapture(e.pointerId)};mapNode.onpointermove=e=>{if(!drag)return;if(drag.kind==='pan'){panBy(e.clientX-drag.x,e.clientY-drag.y);drag.x=e.clientX;drag.y=e.clientY}else{const r=mapNode.getBoundingClientRect();drag.stop.c[0]=(e.clientX-r.left-view.ox)/view.scale;drag.stop.c[1]=(e.clientY-r.top-view.oy)/view.scale;draw()}};mapNode.onpointerup=()=>{if(drag?.kind==='stop'){const requestId=`world-${Date.now()}`,message={type:'akari-world-move-stop',stopId:drag.stop.id,c:[...drag.stop.c],requestId};if(typeof hostApi?.postMessage==='function'){pendingRequest={requestId,stopId:drag.stop.id,before:drag.before};hostApi.postMessage(message)}else{drag.stop.c=[...drag.before];lastDrawError=null}}drag=null;draw()};mapNode.addEventListener('wheel',e=>{e.preventDefault();const r=mapNode.getBoundingClientRect();zoomBy(e.deltaY<0?1.2:1/1.2,e.clientX-r.left,e.clientY-r.top)},{passive:false});
window.addEventListener('message',event=>{const m=event.data;if(m?.type==='akari-world-seek'&&Number.isFinite(m.time))seek(m.time);else if(m?.type==='akari-world-move-failed'&&m.requestId===pendingRequest?.requestId){const stop=stopsById.get(pendingRequest.stopId);if(stop)stop.c=[...pendingRequest.before];pendingRequest=null;lastDrawError=String(m.reason||'停留所を移動できませんでした');draw()}});window.addEventListener('resize',fitView);
window.__akariWorldOverview={editable,get seconds(){return seconds},stops:()=>worldMap.cameraStops.map(s=>({id:s.id,c:[...(s.c||[])]})),view:()=>({...view}),screenOf:id=>{const s=stopsById.get(id);if(!s?.c)return null;const p=screen(s.c);return{x:p[0],y:p[1]}},toastCount:()=>0,pending:()=>pendingRequest,map:()=>structuredClone(worldMap),lastDrawError:()=>lastDrawError,atlas:atlasEnabled,ready,seek,frameRect,worldRects,jumpTargets:()=>targets.map(x=>({...x})),jumpTo,fit:fitView,zoomBy,panBy,follow:value=>{document.getElementById('follow').checked=Boolean(value);draw()},mapSize:()=>({width:mapNode.clientWidth,height:mapNode.clientHeight}),mapOrigin:()=>{const r=mapNode.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height}}};
if(atlasEnabled){atlas.onload=()=>{fitView();readyResolve()};atlas.srcdoc=new TextDecoder().decode(Uint8Array.from(atob(atlasDocument),c=>c.charCodeAt(0)))}else{atlas.remove();fitView();readyResolve()}
})();
</script></body></html>
