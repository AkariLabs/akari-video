<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=320,height=240">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent !important; }
    #stage { position: relative; width: 320px; height: 240px; overflow: hidden; background: transparent; }
    .akari-overlay-container { position: absolute; inset: 0; visibility: hidden; pointer-events: none; }
    .box { width: 60px; height: 60px; background: #f00; animation: slide 1s linear both; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(200px); } }
  </style>
</head>
<body>
  <div id="stage" data-composition-id="akari-render-cut" data-start="0" data-duration="1" data-width="320" data-height="240" data-fps="10" data-no-timeline>
    <div class="akari-overlay-container scene clip" data-overlay-id="probe" data-start="0.2" data-duration="0.5" data-track-index="1"><div class="scene-content"><div class="box"></div></div></div>
  </div>
  <script>
    window.__akariSeek = async function(seconds) {
      console.log('[akari-probe] __akariSeek called t=' + seconds);
      for (const container of document.querySelectorAll('.akari-overlay-container')) {
        const start = Number(container.dataset.start);
        const duration = Number(container.dataset.duration);
        const active = seconds >= start && seconds < start + duration;
        container.style.visibility = active ? 'visible' : 'hidden';
        const localMilliseconds = Math.max(0, Math.min(duration, seconds - start)) * 1000;
        for (const animation of container.getAnimations({ subtree: true })) {
          animation.pause();
          try { animation.currentTime = localMilliseconds; } catch {}
        }
      }
      await Promise.resolve();
    };
    window.__akariReady = (async function() {
      await document.fonts.ready;
      await window.__akariSeek(0);
      return true;
    })();
    window.__hf = Object.assign(window.__hf || {}, { duration: 1, seek: function(t) { console.log("[akari-probe] PAGE __hf.seek called t=" + t); return window.__akariSeek(t); } });
    console.log("[akari-probe] page defined __hf.seek");
    // probe: observe who owns window.__hf and whether its seek is called per frame
    console.log('[akari-probe] initial window.__hf typeof=' + typeof window.__hf);
    (function poll() {
      if (window.__hf && typeof window.__hf.seek === 'function' && !window.__hf.__akariWrapped) {
        console.log('[akari-probe] __hf appeared; duration=' + window.__hf.duration + ' keys=' + Object.keys(window.__hf).join(','));
        const original = window.__hf.seek;
        window.__hf.seek = function(t) {
          console.log('[akari-probe] __hf.seek called t=' + t);
          return original.apply(this, arguments);
        };
        window.__hf.__akariWrapped = true;
        return;
      }
      setTimeout(poll, 25);
    })();
  </script>
</body>
</html>
