name: バグ報告 / Bug report
description: 動かない・期待と違う挙動の報告 / Report something that is not working
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        バグ報告ありがとうございます。投稿前に以下を必ず除去してください:
        **`.akari/connections.json` の中身・API キー・トークン・私的データを含む映像 / スクリーンショット**。

        未修正の脆弱性・攻撃手順・キー漏洩を含む場合は、公開 issue にせず
        [Security タブ](https://github.com/AkariLabs/akari-video/security)から報告してください（手順: [SECURITY.ja.md](https://github.com/AkariLabs/akari-video/blob/main/SECURITY.ja.md)）。
  - type: textarea
    id: problem
    attributes:
      label: 何が起きたか / Problem
      description: 何が起き、何を期待していたか
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順 / Reproduction steps
      description: 再現できる最小の手順
      placeholder: |
        1. アプリのホームで「＋ 新しい動画を始める」を押す（または `akari new` を実行）
        2. ...
        3. こうなる
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: バージョン / Version
      description: アプリの設定の「このアプリについて」、またはターミナルで `akari --version` の表示。開発版ならコミット SHA / App Settings > About this app, or `akari --version`. Commit SHA if you run from a clone
      placeholder: "v1.5.0 / v1.5.0-beta.6 / abc1234"
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: 受け取る版 / Release channel
      description: 設定の「受け取る版」。ベータ版（プレリリース）は版の名前に `-beta.N` が付きます / Settings > Release channel. Beta versions have `-beta.N` in the version name
      options:
        - "安定版 / Stable"
        - "ベータ版（プレリリース）/ Beta (pre-release)"
        - "開発版（clone して実行）/ From a clone (development)"
        - "わからない / Not sure"
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - "macOS (Apple Silicon)"
        - "macOS (Intel)"
        - "Windows"
        - "Linux / WSL2"
        - "その他 / Other"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 環境 / Environment
      description: OS のバージョン、アプリ / CLI / プラグインのどれで起きたか、使っている AI パートナー（Claude Code・Codex など） / OS version, whether it happened in the app, CLI or plugin, and which AI partner you use
      placeholder: "macOS 26, デスクトップアプリ, Claude Code / Windows 11, CLI (npm), Codex"
  - type: dropdown
    id: risk_area
    attributes:
      label: 領域 / Area
      description: 一番近いものを選んでください（トリアージが速くなります）
      options:
        - "セットアップ / インストール / 更新"
        - "CLI（akari コマンド）"
        - "書き出し"
        - "字幕 / テロップ"
        - "素材 / 動く部品（オーバーレイ）/ スタイル / テンプレート / ライブラリ"
        - "作り方 / 台本 / タイムライン"
        - "プレビュー / 注釈 / アプリの画面"
        - "AI パートナー / スキルの挙動"
        - "Lab / 連携（akari store connect）"
        - "ドキュメント"
        - "わからない"
  - type: textarea
    id: logs
    attributes:
      label: ログ・スクリーンショット / Logs or screenshots
      description: サニタイズ済みのもののみ（API キー・私的データを除去）
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: 安全チェック / Safety check
      options:
        - label: "`.akari/connections.json` の中身・API キー・トークン・私的データを除去しました"
          required: true
        - label: これは未修正の脆弱性の公開開示ではありません（該当する場合は Security タブで報告します）
          required: true
