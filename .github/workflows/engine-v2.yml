name: Engine v2 required checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: engine-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frame-engine-golden:
    name: frame-engine-golden
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
          cache: npm
      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb unzip libnss3 libgbm1 libgtk-3-0 libasound2t64 libatk-bridge2.0-0 libxkbcommon0
      - name: Install frame-engine dependencies and Electron
        run: >-
          npm install --workspace @akari-video/frame-engine
          --include-workspace-root=false --include=optional
          --no-audit --no-fund --no-save electron@39.8.7
      - name: Install Electron in an isolated directory (avoids monorepo native builds and npm 11 allow-scripts)
        shell: bash
        run: |
          set -e
          pkg="$RUNNER_TEMP/electron-pkg"
          mkdir -p "$pkg" && cd "$pkg"
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund --ignore-scripts electron@39.8.7
          # install.js（@electron/get）は失敗時に console.error 直後に process.exit するため CI のパイプ出力では
          # メッセージが落ちる（無言 exit 1）。GitHub Releases の zip を直接展開して同じ dist/ 配置を作る。
          ver="$(node -p "require('./node_modules/electron/package.json').version")"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/electron.zip" \
            "https://github.com/electron/electron/releases/download/v${ver}/electron-v${ver}-linux-x64.zip"
          rm -rf node_modules/electron/dist && mkdir -p node_modules/electron/dist
          unzip -q "$RUNNER_TEMP/electron.zip" -d node_modules/electron/dist
          printf 'electron' > node_modules/electron/path.txt
          test -x node_modules/electron/dist/electron
          test -f node_modules/electron/dist/version
          echo "electron dist $(cat node_modules/electron/dist/version)"
      - name: Link Electron into the repository
        shell: bash
        run: |
          set -e
          rm -rf node_modules/electron
          ln -s "$RUNNER_TEMP/electron-pkg/node_modules/electron" node_modules/electron
          node -e "console.log('electron =', require('electron'))"
          test -x "$(node -e "process.stdout.write(require('electron'))")"
      - name: Force Electron golden runs through SwiftShader
        shell: bash
        run: |
          electron_cli="$(pwd)/node_modules/electron/cli.js"
          rm -f node_modules/.bin/electron
          printf '%s\n' '#!/usr/bin/env bash' \
            "exec node \"${electron_cli}\" --disable-gpu --enable-unsafe-swiftshader --use-angle=swiftshader \"\$@\"" \
            > node_modules/.bin/electron
          chmod +x node_modules/.bin/electron
          test -x node_modules/electron/dist/electron
          test -f node_modules/electron/dist/version
      - name: Probe WebCodecs software decode support
        shell: bash
        run: |
          probe_dir="$RUNNER_TEMP/webcodecs-probe"
          mkdir -p "$probe_dir"
          cat > "$probe_dir/index.html" <<'HTML'
          <html><body>probe</body></html>
          HTML
          cat > "$probe_dir/main.cjs" <<'NODE'
          const { app, BrowserWindow } = require('electron');
          app.commandLine.appendSwitch('ignore-gpu-blocklist');
          app.whenReady().then(async () => {
            const win = new BrowserWindow({ show: false, webPreferences: { offscreen: true } });
            await win.loadURL(process.env.PROBE_URL);
            const script = `
              (async () => {
                const base = { codec: 'avc1.64000d', codedWidth: 320, codedHeight: 180 };
                const out = {};
                for (const hw of ['no-preference', 'prefer-hardware', 'prefer-software']) {
                  try { out[hw] = (await VideoDecoder.isConfigSupported({ ...base, hardwareAcceleration: hw })).supported; }
                  catch (e) { out[hw] = 'throw: ' + e.message; }
                }
                return JSON.stringify(out);
              })()
            `;
            process.stdout.write('PROBE ' + (await win.webContents.executeJavaScript(script, true)) + '\n');
            app.exit(0);
          });
          NODE
          PROBE_URL="file://$probe_dir/index.html" \
            xvfb-run -a node_modules/.bin/electron "$probe_dir/main.cjs" --no-sandbox
      - name: Run required frame-engine suite (build + unit + seek)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          npm --prefix packages/frame-engine run build
          npm --prefix packages/frame-engine run test:unit
          xvfb-run -a npm --prefix packages/frame-engine run test:seek

  frame-engine-golden-soft:
    # 参考ジョブ（2026-08-28 司令塔）: ソフト描画（SwiftShader）では colorPatches の許容差が未定義で Δ1〜12 が出るため、
    # 許容差の別票が入るまで continue-on-error。他の点群（parity / layer / matte / transition / look / gopTail / bFrame）はソフトでも 0 fail。
    name: frame-engine-golden-soft (reference)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
          cache: npm
      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb unzip libnss3 libgbm1 libgtk-3-0 libasound2t64 libatk-bridge2.0-0 libxkbcommon0
      - name: Install frame-engine dependencies and Electron
        run: >-
          npm install --workspace @akari-video/frame-engine
          --include-workspace-root=false --include=optional
          --no-audit --no-fund --no-save electron@39.8.7
      - name: Install Electron in an isolated directory (avoids monorepo native builds and npm 11 allow-scripts)
        shell: bash
        run: |
          set -e
          pkg="$RUNNER_TEMP/electron-pkg"
          mkdir -p "$pkg" && cd "$pkg"
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund --ignore-scripts electron@39.8.7
          # install.js（@electron/get）は失敗時に console.error 直後に process.exit するため CI のパイプ出力では
          # メッセージが落ちる（無言 exit 1）。GitHub Releases の zip を直接展開して同じ dist/ 配置を作る。
          ver="$(node -p "require('./node_modules/electron/package.json').version")"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/electron.zip" \
            "https://github.com/electron/electron/releases/download/v${ver}/electron-v${ver}-linux-x64.zip"
          rm -rf node_modules/electron/dist && mkdir -p node_modules/electron/dist
          unzip -q "$RUNNER_TEMP/electron.zip" -d node_modules/electron/dist
          printf 'electron' > node_modules/electron/path.txt
          test -x node_modules/electron/dist/electron
          test -f node_modules/electron/dist/version
          echo "electron dist $(cat node_modules/electron/dist/version)"
      - name: Link Electron into the repository
        shell: bash
        run: |
          set -e
          rm -rf node_modules/electron
          ln -s "$RUNNER_TEMP/electron-pkg/node_modules/electron" node_modules/electron
          node -e "console.log('electron =', require('electron'))"
          test -x "$(node -e "process.stdout.write(require('electron'))")"
      - name: Force Electron golden runs through SwiftShader
        shell: bash
        run: |
          electron_cli="$(pwd)/node_modules/electron/cli.js"
          rm -f node_modules/.bin/electron
          printf '%s\n' '#!/usr/bin/env bash' \
            "exec node \"${electron_cli}\" --disable-gpu --enable-unsafe-swiftshader --use-angle=swiftshader \"\$@\"" \
            > node_modules/.bin/electron
          chmod +x node_modules/.bin/electron
      - name: Run golden under SwiftShader (reference only)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          npm --prefix packages/frame-engine run build
          xvfb-run -a npm --prefix packages/frame-engine run test:golden

  osr-export-soft:
    name: osr-export-soft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
          cache: npm
      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb unzip libnss3 libgbm1 libgtk-3-0 libasound2t64 libatk-bridge2.0-0 libxkbcommon0
      - name: Install osr-export dependencies with Electron postinstall
        run: >-
          npm install --workspace @akari-video/osr-export
          --include-workspace-root=false --include=optional
          --no-audit --no-fund --no-save
      - name: Install Electron in an isolated directory (avoids monorepo native builds and npm 11 allow-scripts)
        shell: bash
        run: |
          set -e
          pkg="$RUNNER_TEMP/electron-pkg"
          mkdir -p "$pkg" && cd "$pkg"
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund --ignore-scripts electron@39.8.7
          # install.js（@electron/get）は失敗時に console.error 直後に process.exit するため CI のパイプ出力では
          # メッセージが落ちる（無言 exit 1）。GitHub Releases の zip を直接展開して同じ dist/ 配置を作る。
          ver="$(node -p "require('./node_modules/electron/package.json').version")"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/electron.zip" \
            "https://github.com/electron/electron/releases/download/v${ver}/electron-v${ver}-linux-x64.zip"
          rm -rf node_modules/electron/dist && mkdir -p node_modules/electron/dist
          unzip -q "$RUNNER_TEMP/electron.zip" -d node_modules/electron/dist
          printf 'electron' > node_modules/electron/path.txt
          test -x node_modules/electron/dist/electron
          test -f node_modules/electron/dist/version
          echo "electron dist $(cat node_modules/electron/dist/version)"
      - name: Link Electron into the repository
        shell: bash
        run: |
          set -e
          rm -rf node_modules/electron
          ln -s "$RUNNER_TEMP/electron-pkg/node_modules/electron" node_modules/electron
          node -e "console.log('electron =', require('electron'))"
          test -x "$(node -e "process.stdout.write(require('electron'))")"
      - name: Assert Electron installation
        run: |
          test -x node_modules/electron/dist/electron
          test -f node_modules/electron/dist/version
      - name: Run required osr-export tests
        env:
          AKARI_OSR_SOFT: "1"
          ELECTRON_DISABLE_SANDBOX: "1"
        run: npm --prefix packages/osr-export run ci:required
      - name: Build deterministic fixture
        run: npm --prefix packages/osr-export run ci:fixture -- "$RUNNER_TEMP/osr-fixture" --verify
      - name: Probe WebCodecs software decode support
        shell: bash
        run: |
          probe_dir="$RUNNER_TEMP/webcodecs-probe"
          mkdir -p "$probe_dir"
          cat > "$probe_dir/index.html" <<'HTML'
          <html><body>probe</body></html>
          HTML
          cat > "$probe_dir/main.cjs" <<'NODE'
          const { app, BrowserWindow } = require('electron');
          app.commandLine.appendSwitch('ignore-gpu-blocklist');
          app.whenReady().then(async () => {
            const win = new BrowserWindow({ show: false, webPreferences: { offscreen: true } });
            await win.loadURL(process.env.PROBE_URL);
            const script = `
              (async () => {
                const base = { codec: 'avc1.64000d', codedWidth: 320, codedHeight: 180 };
                const out = {};
                for (const hw of ['no-preference', 'prefer-hardware', 'prefer-software']) {
                  try { out[hw] = (await VideoDecoder.isConfigSupported({ ...base, hardwareAcceleration: hw })).supported; }
                  catch (e) { out[hw] = 'throw: ' + e.message; }
                }
                return JSON.stringify(out);
              })()
            `;
            process.stdout.write('PROBE ' + (await win.webContents.executeJavaScript(script, true)) + '\n');
            app.exit(0);
          });
          NODE
          PROBE_URL="file://$probe_dir/index.html" \
            xvfb-run -a node_modules/.bin/electron "$probe_dir/main.cjs" \
              --no-sandbox --disable-gpu --enable-unsafe-swiftshader --use-angle=swiftshader
      - name: Run OSR soft render twice
        env:
          AKARI_OSR_SOFT: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          # GitHub の ubuntu ランナーは Electron の SUID sandbox が未設定（SIGTRAP で即死）。CI に限りサンドボックスを外す
          ELECTRON_DISABLE_SANDBOX: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/osr-run-1" "$RUNNER_TEMP/osr-run-2"
          xvfb-run -a node packages/osr-export/bin/akari-osr-export.mjs \
            "$RUNNER_TEMP/osr-fixture" \
            --out "$RUNNER_TEMP/osr-run-1/composite.mp4" \
            --duration 12 --fps 30 --width 1920 --height 1080 --soft
          xvfb-run -a node packages/osr-export/bin/akari-osr-export.mjs \
            "$RUNNER_TEMP/osr-fixture" \
            --out "$RUNNER_TEMP/osr-run-2/composite.mp4" \
            --duration 12 --fps 30 --width 1920 --height 1080 --soft
      - name: Require byte-exact frames and MP4
        shell: bash
        run: |
          node --input-type=module - \
            "$RUNNER_TEMP/osr-run-1/run.json" \
            "$RUNNER_TEMP/osr-run-2/run.json" <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          const [leftPath, rightPath] = process.argv.slice(2);
          const left = JSON.parse(await readFile(leftPath, "utf8"));
          const right = JSON.parse(await readFile(rightPath, "utf8"));
          assert.equal(left.status, "completed");
          assert.equal(right.status, "completed");
          assert.equal(left.mode, "soft");
          assert.equal(right.mode, "soft");
          assert.equal(left.framesCompleted, 360);
          assert.equal(right.framesCompleted, 360);
          assert.deepEqual(left.frameHashes, right.frameHashes);
          process.stdout.write(`raw BGRA SHA-256 matched for ${left.frameHashes.length} frames\n`);
          NODE
          first_sha="$(sha256sum "$RUNNER_TEMP/osr-run-1/composite.mp4" | cut -d ' ' -f 1)"
          second_sha="$(sha256sum "$RUNNER_TEMP/osr-run-2/composite.mp4" | cut -d ' ' -f 1)"
          test "$first_sha" = "$second_sha"
          echo "MP4 SHA-256 matched: $first_sha"

  gpu-export-soft:
    name: gpu-export-soft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
          cache: npm
      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb unzip libnss3 libgbm1 libgtk-3-0 libasound2t64 libatk-bridge2.0-0 libxkbcommon0
      - name: Install GPU export dependencies without lifecycle scripts
        run: >-
          npm install --ignore-scripts
          --workspace @akari-video/gpu-export --workspace @akari-video/osr-export
          --include-workspace-root=false --include=optional
          --no-audit --no-fund --no-save
      - name: Install stock Electron in an isolated directory
        shell: bash
        run: |
          set -e
          pkg="$RUNNER_TEMP/electron-pkg"
          mkdir -p "$pkg" && cd "$pkg"
          npm init -y >/dev/null
          npm install --no-save --no-audit --no-fund --ignore-scripts electron@39.8.7
          ver="$(node -p "require('./node_modules/electron/package.json').version")"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/electron.zip" \
            "https://github.com/electron/electron/releases/download/v${ver}/electron-v${ver}-linux-x64.zip"
          rm -rf node_modules/electron/dist && mkdir -p node_modules/electron/dist
          unzip -q "$RUNNER_TEMP/electron.zip" -d node_modules/electron/dist
          printf 'electron' > node_modules/electron/path.txt
          test -x node_modules/electron/dist/electron
          test -f node_modules/electron/dist/version
      - name: Link Electron into the repository
        shell: bash
        run: |
          set -e
          rm -rf node_modules/electron
          ln -s "$RUNNER_TEMP/electron-pkg/node_modules/electron" node_modules/electron
          test -x "$(node -e "process.stdout.write(require('electron'))")"
      - name: Run required GPU export checks
        run: npm --prefix packages/gpu-export run ci:required
      - name: Build deterministic 360-frame audio fixture
        run: |
          npm --prefix packages/osr-export run ci:fixture -- "$RUNNER_TEMP/gpu-fixture" --verify
          node --input-type=module - "$RUNNER_TEMP/gpu-fixture" <<'NODE'
          import { mkdir, readFile, writeFile } from "node:fs/promises";
          import { join } from "node:path";
          const root = process.argv[2];
          const path = join(root, "edit.json");
          const edit = JSON.parse(await readFile(path, "utf8"));
          edit.tracks = edit.tracks.filter((track) => track.lane === "audio" || track.id === "v-main");
          edit.tracks.push({
            id: "v-dom-dynamic",
            lane: "visual",
            items: [{ id: "dom-dynamic", at: 0, duration: 360, source: { kind: "html", path: "overlays/dom-dynamic.html" } }],
          });
          await mkdir(join(root, "overlays"), { recursive: true });
          await writeFile(join(root, "overlays", "dom-dynamic.html"), `
            <style>
              @property --bench-frame { syntax: "<integer>"; inherits: false; initial-value: 0; }
              .dom-fixture { position:absolute;left:48px;top:48px;width:360px;height:120px;background:#155e75;color:white;animation:move 12s linear both;counter-reset:x var(--bench-frame); }
              .dom-fixture::after { content:counter(x);font:700 48px sans-serif; }
              @keyframes move { from { --bench-frame:0; transform:translateX(0); } to { --bench-frame:360; transform:translateX(240px); } }
            </style><div class="dom-fixture">DOM </div>\n`);
          await writeFile(path, JSON.stringify(edit, null, 2) + "\n");
          await writeFile(join(root, "captions.json"), JSON.stringify({ captions: [{
            id: "c-0001", start: 2, end: 5, text: "カラオケ字幕", style: "karaoke",
            speaker: null, sourceRef: null, edited: false, time_domain: "output",
            words: [
              { start: 2, end: 3, text: "カラオケ" },
              { start: 3, end: 5, text: "字幕" },
            ],
          }] }, null, 2) + "\n");
          NODE
      - name: Probe SwiftShader drawElementImage support
        shell: bash
        run: |
          probe_dir="$RUNNER_TEMP/gpu-dom-probe"
          mkdir -p "$probe_dir"
          cat > "$probe_dir/main.cjs" <<'NODE'
          const { app, BrowserWindow } = require('electron');
          app.commandLine.appendSwitch('enable-features', 'CanvasDrawElement');
          app.commandLine.appendSwitch('enable-unsafe-swiftshader');
          app.commandLine.appendSwitch('use-angle', 'swiftshader');
          app.whenReady().then(async () => {
            const win = new BrowserWindow({ show: false });
            await win.loadURL('data:text/html,<canvas id=c></canvas>');
            const probe = await win.webContents.executeJavaScript(`(() => {
              const drawElementImage = typeof document.querySelector('#c').getContext('2d').drawElementImage === 'function';
              return { drawElementImage, renderer: 'swiftshader' };
            })()`);
            require('fs').writeFileSync(process.env.PROBE_OUT, JSON.stringify(probe));
            app.exit(0);
          });
          NODE
          rm -f "$RUNNER_TEMP/gpu-dom-probe.json"
          PROBE_OUT="$RUNNER_TEMP/gpu-dom-probe.json" LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a node_modules/electron/dist/electron "$probe_dir/main.cjs" --no-sandbox --enable-unsafe-swiftshader --use-angle=swiftshader > "$RUNNER_TEMP/gpu-dom-probe.stdout" 2>&1 || true
          echo "--- drawElementImage probe stdout/stderr ---"; cat "$RUNNER_TEMP/gpu-dom-probe.stdout" || true
          if ! node -e "JSON.parse(require('fs').readFileSync('$RUNNER_TEMP/gpu-dom-probe.json','utf8'))" 2>/dev/null; then
            echo "::warning::drawElementImage probe did not produce JSON (crash or timeout); treating as unsupported"
            printf '%s\n' '{"drawElementImage":false,"renderer":"swiftshader","error":"probe-no-output"}' > "$RUNNER_TEMP/gpu-dom-probe.json"
          fi
          if node -e "const p=require('$RUNNER_TEMP/gpu-dom-probe.json');process.exit(p.drawElementImage===true?0:1)"; then
            echo "GPU_DOM_LAYER=yes" >> "$GITHUB_ENV"
            echo "gpu-export-soft DOM layer: supported (SwiftShader)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GPU_DOM_LAYER=no" >> "$GITHUB_ENV"
            echo "gpu-export-soft DOM layer: unsupported (SwiftShader)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::drawElementImage unsupported on SwiftShader; DOM fixture will be removed."
            node --input-type=module - "$RUNNER_TEMP/gpu-fixture/edit.json" <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const path = process.argv[2];
          const edit = JSON.parse(await readFile(path, "utf8"));
          edit.tracks = edit.tracks.filter((track) => track.id !== "v-dom-dynamic");
          await writeFile(path, JSON.stringify(edit, null, 2) + "\n");
          NODE
          fi
      - name: Probe WebCodecs H.264 software encode support
        shell: bash
        run: |
          probe_dir="$RUNNER_TEMP/gpu-encode-probe"
          mkdir -p "$probe_dir"
          cat > "$probe_dir/index.html" <<'HTML'
          <html><body>probe</body></html>
          HTML
          cat > "$probe_dir/main.cjs" <<'NODE'
          const { app, BrowserWindow } = require('electron');
          app.disableHardwareAcceleration();
          app.whenReady().then(async () => {
            const win = new BrowserWindow({ show: false });
            await win.loadURL(process.env.PROBE_URL);
            const supported = await win.webContents.executeJavaScript(`VideoEncoder.isConfigSupported({
              codec:'avc1.640028', width:1920, height:1080, bitrate:8000000, framerate:30,
              hardwareAcceleration:'prefer-software', latencyMode:'realtime', avc:{format:'annexb'}
            }).then(v=>v.supported).catch(()=>false)`);
            process.stdout.write(String(Boolean(supported)));
            app.exit(0);
          });
          NODE
          result="$(PROBE_URL="file://$probe_dir/index.html" LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a node_modules/electron/dist/electron "$probe_dir/main.cjs" \
            --no-sandbox --disable-gpu --enable-unsafe-swiftshader --use-angle=swiftshader)"
          if [ "$result" = "true" ]; then echo "GPU_H264_ENCODER=yes" >> "$GITHUB_ENV"; else echo "GPU_H264_ENCODER=no" >> "$GITHUB_ENV"; fi
      - name: Run software frame verification twice
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          ELECTRON_DISABLE_SANDBOX: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/gpu-run-a" "$RUNNER_TEMP/gpu-run-b"
          for run in a b; do
            xvfb-run -a node packages/gpu-export/bin/akari-gpu-export.mjs \
              "$RUNNER_TEMP/gpu-fixture" --out "$RUNNER_TEMP/gpu-run-$run/composite.mp4" \
              --duration 12 --frames 360 --fps 30 --width 1920 --height 1080 --soft --verify-frames
          done
      - name: Require 360 matching pre-encode frame hashes
        shell: bash
        run: |
          node --input-type=module - "$RUNNER_TEMP/gpu-run-a/run.json" "$RUNNER_TEMP/gpu-run-b/run.json" "$RUNNER_TEMP/gpu-dom-probe.json" <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          const [leftPath, rightPath, probePath] = process.argv.slice(2);
          const left = JSON.parse(await readFile(leftPath, "utf8"));
          const right = JSON.parse(await readFile(rightPath, "utf8"));
          const probe = JSON.parse(await readFile(probePath, "utf8"));
          assert.equal(left.framesCompleted, 360);
          assert.equal(right.framesCompleted, 360);
          assert.equal(left.frameHashes.length, 360);
          assert.deepEqual(left.frameHashes, right.frameHashes);
          assert.ok(["completed", "unsupported"].includes(left.status));
          assert.equal(left.status, right.status);
          if (process.env.GPU_DOM_LAYER === "yes") {
            assert.deepEqual(probe, { drawElementImage: true, renderer: "swiftshader" });
            assert.ok(left.domLayer.runs >= 1);
            assert.equal(left.domLayer.sentinel.matched, 360);
            assert.equal(left.domLayer.sentinel.mismatchCount, 0);
          } else {
            assert.equal(probe.drawElementImage, false);
            assert.equal(probe.renderer, "swiftshader");
            assert.equal(left.domLayer.runs, 0);
          }
          NODE
      - name: Record unsupported encoder or verify encoded output
        shell: bash
        run: |
          status="$(node -p "require('$RUNNER_TEMP/gpu-run-a/run.json').status")"
          echo "gpu-export run status=$status (isConfigSupported probe said: ${GPU_H264_ENCODER:-unknown})"
          if [ "$status" = "unsupported" ]; then
            echo "GPU_H264_ENCODER=no" >> "$GITHUB_ENV"
            echo "::warning::Stock Linux Electron has no H.264 encoder; pre-encode frame SHA remains required and passed."
          else
            if [ "$GPU_H264_ENCODER" = "no" ]; then
              echo "::notice::isConfigSupported probe said no, but the export encoded (the probe config is stricter than the product encoder); trusting the run."
            fi
            echo "GPU_H264_ENCODER=yes" >> "$GITHUB_ENV"
            ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$RUNNER_TEMP/gpu-run-a/composite.mp4" | grep -x 360
            first_sha="$(sha256sum "$RUNNER_TEMP/gpu-run-a/composite.mp4" | cut -d ' ' -f 1)"
            second_sha="$(sha256sum "$RUNNER_TEMP/gpu-run-b/composite.mp4" | cut -d ' ' -f 1)"
            if [ "$first_sha" != "$second_sha" ]; then echo "::warning::Software H.264 MP4 SHA differs; frame SHA is the required determinism gate."; fi
          fi
      - name: Run readback trap when the encoder is available
        if: env.GPU_H264_ENCODER == 'yes'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          ELECTRON_DISABLE_SANDBOX: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/gpu-run-trap"
          xvfb-run -a node packages/gpu-export/bin/akari-gpu-export.mjs \
            "$RUNNER_TEMP/gpu-fixture" --out "$RUNNER_TEMP/gpu-run-trap/composite.mp4" \
            --duration 12 --frames 360 --fps 30 --width 1920 --height 1080 --soft --trap-readback
          node -e "const r=require('$RUNNER_TEMP/gpu-run-trap/run.json'); if(r.status!=='completed'||Object.values(r.gpu.readbackCounters).some(Boolean)) process.exit(1)"
