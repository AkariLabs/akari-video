name: CI

# レーン構成（2026-09-02 オーナー裁定「本体とテストを 1 対 1 に」）:
#   required（赤なら main へ合流させない）: packaged-imports / skills-index / unit / L0
#   参考（ジョブは緑 + 警告。結果は見えるが止めない）: unit-quarantine / unit-media
# 参考ジョブは各ステップの失敗を許容し、最後の集計ステップが警告と Summary に結果を残す。
# 準備に失敗してテストが走らない場合も同じ場所で分かるようにする。
# ユニットテストのレーン定義（どのパッケージがどこに属し、何を載せていないか・その理由）の正本は
# scripts/ci/run-unit-tests.mjs（`npm run test:lanes` で一覧）。required に載せるのは「どの環境でも
# 同じ結果になる」テストだけ。環境依存を required にすると常時赤になって赤が情報でなくなる
# （engine-v2.yml の required / 参考の二分と同じ流儀）。frame-engine / osr-export / gpu-export は
# engine-v2.yml（Electron 実機付き）が担当し、ここには載せない。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # skills/ 正本と .claude/skills / .agents/skills / .cursor/skills の symlink 整合 + AGENTS.md 生成索引のドリフト検査。
  # スクリプト自体は依存ゼロで動く（js-yaml 不在時は最小フォールバック）が、この
  # ジョブでは root devDependencies（js-yaml のみ）を入れて厳密 YAML 検証（issue #4 の
  # 再発ゲート）を CI で 1 レーン担保する。--no-workspaces で apps/shell 等の重い
  # workspace install は走らない
  packaged-imports:
    name: packaged-imports (extraResources を模擬 Resources に組んで入口の import グラフを検査)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
      # 同じ required の配布ゲートへ相乗りし、RVM コード・重みの混入を最短で止める。
      # Node 組み込みのみで追加 install は不要なため、依存 staging より先に実行する。
      - name: check-no-gpl-redistribution
        run: node scripts/release/check-no-gpl-redistribution.mjs
      - name: check-no-proprietary-licenses
        run: node scripts/release/check-no-proprietary-licenses.mjs
      # v0.1.25 の同梱漏れ（packages/gpu-export / skills/analyze-footage/bin/person-matte / @webav/mp4box.js）は
      # モノレポのテストでは見えず、実ビルドのパッケージ版でだけ ERR_MODULE_NOT_FOUND になった。
      # release.yml と同じ手順で同梱 npm 入口を staging し、extraResources どおりの模擬 Resources から
      # 入口（packages/*/bin/*.mjs + osr-export / gpu-export の electron-main.mjs）の静的 import を辿る。
      # 数秒・決定論。root の npm ci は要らない（同梱 CLI の入口だけを --no-save で入れる）。
      - name: Install bundled-CLI runtime deps (repo root, --no-save)
        run: node scripts/release/install-bundled-cli-deps.mjs
      - name: Stage resources/cli-node-modules
        run: node apps/shell/resources/scripts/bundle-cli-node-modules.mjs
      - name: check-packaged-imports
        run: node scripts/release/check-packaged-imports.mjs

  skills-index:
    name: skills-index (symlink 整合 + AGENTS.md drift + frontmatter YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
      - run: npm install --no-workspaces --ignore-scripts --no-audit --no-fund
      - run: node scripts/gen-skills-index.mjs --check --strict
      - run: node scripts/check-docs-sync.mjs
      - run: node scripts/check-entry-skill.mjs
      - name: "check-extension-deps (拡張間 file 依存と build:ext 順序の照合)"
        run: node scripts/ci/check-extension-deps.mjs

  # packages/* + scripts/test + skills/* のユニットテストのうち、外部ツール（ffmpeg / Chrome / Electron /
  # ネイティブモジュール）を一切要さず、どの OS でも同じ結果になるもの。2026-09-02 の実測で main が緑の集合。
  unit:
    name: unit (packages/* + scripts/test + skills/* — 外部ツール不要・required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
          cache: npm
      # root の package-lock.json は packages/* と apps/shell を含む workspace lock（lockfileVersion 3）。
      # --ignore-scripts で node-gyp / electron / puppeteer / onnxruntime の install script を全部止める
      # （pure レーンのテストはどれもネイティブ実体を要さない。要るものは unit-media レーン）。
      # ローカル実測 2026-09-02（macOS arm64・Node 26.3.0）: added 1480 packages / 7 s（キャッシュ有）。
      - name: Install workspace dependencies (repo root, npm ci --ignore-scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      # frame-engine 3 consumers + preview-server の Web UI バンドル 6 本
      # （pen-visuals / overlay-interaction.bundle.js / overlay-interaction.css /
      # overlay-motion-vocab.css / edit-kernel / frame-engine）を
      # 1 ステップでまとめて検査する。preview-server 側は packages/preview-server/package.json の build
      # スクリプトを読み、一時ディレクトリへ再生成してバイト比較するため working tree を汚さない。
      - name: check generated bundle drift (frame-engine 3 consumers + preview-server 6 bundles)
        run: node scripts/ci/check-frame-engine-drift.mjs
      # preview-server の frame-engine-client.ts は esbuild でバンドルされるだけで型検査されていなかった。
      # tsconfig（noEmit・frame-engine の設定を継承）で strict の型検査を通す
      - name: typecheck (preview-server frame-engine-client.ts)
        run: npm --prefix packages/preview-server run typecheck
      - name: unit tests (lane pure)
        run: node scripts/ci/run-unit-tests.mjs --lane pure
      # edit-store / pen-visuals の lib/ は追跡対象の生成物。pure レーンの npm test が src から作り直すので、
      # ここで差分が出たら「src を変えたのに lib を再生成していない」= stale lib が出荷される
      - name: generated lib drift (edit-store / pen-visuals)
        run: git diff --exit-code --stat -- packages/edit-store/lib packages/pen-visuals/lib

  # 参考: main で既に赤いパッケージを隔離し、緑のチェック + 警告で結果を見せる。
  # required に上げるときはステップ単位の continue-on-error と集計ステップを外し、準備ステップの門を外す。
  unit-quarantine:
    name: unit-quarantine (main で既に赤・修正待ち — 参考)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
      - uses: actions/setup-node@v4
        id: setup_node
        continue-on-error: true
        with:
          node-version: '26.3.0'
          cache: npm
      - name: Install workspace dependencies (repo root, npm ci --ignore-scripts)
        id: install
        continue-on-error: true
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: unit tests (lane quarantine)
        id: tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.setup_node.outcome == 'success' && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: GITHUB_STEP_SUMMARY="$RUNNER_TEMP/unit-quarantine-table.md" AKARI_UNIT_LANE_RESULT="$RUNNER_TEMP/unit-quarantine-result.json" node scripts/ci/run-unit-tests.mjs --lane quarantine
      - name: reference summary (参考ジョブの結果を警告で見せる)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          failed=()
          if [ "${{ steps.checkout.outcome }}" = failure ]; then failed+=(checkout); fi
          if [ "${{ steps.setup_node.outcome }}" = failure ]; then failed+=(setup-node); fi
          if [ "${{ steps.install.outcome }}" = failure ]; then failed+=(npm-ci); fi
          if [ "${{ steps.tests.outcome }}" != success ] && [ "${{ steps.tests.outcome }}" != failure ] && [ "${#failed[@]}" -gt 0 ]; then
            message="unit-quarantine (main で既に赤・修正待ち — 参考) は準備が失敗してテストが走らなかった（失敗: ${failed[*]}）"
            echo "::warning title=参考ジョブ::$message"
            printf '%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.tests.outcome }}" = failure ]; then
            result="$RUNNER_TEMP/unit-quarantine-result.json"
            count=1
            if [ -f "$result" ]; then count="$(node -e "const r=require(process.argv[1]);console.log(Math.max(1,r.failed.length))" "$result")"; fi
            echo "::warning title=参考ジョブ::unit-quarantine (main で既に赤・修正待ち — 参考) で $count 件落ちた（詳細は Summary）"
            printf 'unit-quarantine: %s 件落ちた\n' "$count" >> "$GITHUB_STEP_SUMMARY"
            if [ -f "$result" ]; then
              node -e "for(const e of require(process.argv[1]).entries.filter(e=>e.exit!==0)) console.log('- '+e.id+' (fail: '+(e.fail??'不明')+')')" "$result" >> "$GITHUB_STEP_SUMMARY"
            else
              echo '- unit tests (lane quarantine) (結果 JSON なし)' >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "${{ steps.tests.outcome }}" = success ]; then
            echo 'unit-quarantine: 0 件落ちた（すべて通過）' >> "$GITHUB_STEP_SUMMARY"
          else
            message="unit-quarantine (main で既に赤・修正待ち — 参考) のテストが走らなかった（tests outcome=${{ steps.tests.outcome }}）"
            echo "::warning title=参考ジョブ::$message"
            printf '%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/unit-quarantine-table.md" ]; then cat "$RUNNER_TEMP/unit-quarantine-table.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

  # 参考: ffmpeg / ffprobe / Chrome / Electron が要るパッケージを緑のチェック + 警告で見せる。
  # required に上げるときはステップ単位の continue-on-error と集計ステップを外し、準備ステップの門を外す。
  unit-media:
    name: unit-media (ffmpeg / Chrome が要る — 参考)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        id: setup_node
        continue-on-error: true
        with:
          node-version: '26.3.0'
          cache: npm
      - name: Install media and Electron system dependencies
        id: system_deps
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb unzip libnss3 libgbm1 libgtk-3-0 libasound2t64 libatk-bridge2.0-0 libxkbcommon0
      - name: Install workspace dependencies (repo root, npm ci --ignore-scripts)
        id: install
        continue-on-error: true
        run: npm ci --ignore-scripts --no-audit --no-fund
      # 失敗してもテストを走らせ、結果を集計で見せる。
      - name: Install Electron from the package version
        id: electron
        shell: bash
        continue-on-error: true
        run: |
          set -e
          ver="$(node -p "require('./node_modules/electron/package.json').version")"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/electron.zip" \
            "https://github.com/electron/electron/releases/download/v${ver}/electron-v${ver}-linux-x64.zip"
          mkdir -p node_modules/electron/dist
          unzip -q "$RUNNER_TEMP/electron.zip" -d node_modules/electron/dist
          printf 'electron' > node_modules/electron/path.txt
          test -x node_modules/electron/dist/electron
      # 失敗してもテストを走らせ、結果を集計で見せる。
      - name: Build transcript import dependencies
        id: transcript
        continue-on-error: true
        run: |
          npm --prefix packages/edit-store run build
          npm --prefix apps/shell/extensions/akari-preview run build
          npm --prefix apps/shell/extensions/akari-project run build
          npm --prefix apps/shell/extensions/akari-annotations run build
          npm --prefix apps/shell/extensions/akari-transcript run build
      # preview-server は Playwright chromium、overlay-runtime は puppeteer-core と
      # 専用の chrome-headless-shell を使う。CHROME_PATH は既存の他パッケージ向けに維持する。
      - name: Install Playwright chromium
        id: playwright
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      # ランナーは kernel.apparmor_restrict_unprivileged_userns=1 で Chrome sandbox を張れないため、Linux だけ --no-sandbox が要る。
      # headless-shell + single-process で overlay-runtime は 396/396 pass。
      # Google Chrome は EGL 初期化失敗で多数 fail したため、overlay-runtime には headless-shell を使う。
      # 失敗してもテストを走らせ、結果を集計で見せる。
      - name: Install overlay Chrome headless shell
        id: headless_shell
        shell: bash
        continue-on-error: true
        run: |
          set -e
          shell_version="$(node -p "require('puppeteer-core').PUPPETEER_REVISIONS['chrome-headless-shell']")"
          shell_bin="$(node node_modules/puppeteer-core/node_modules/@puppeteer/browsers/lib/main-cli.js \
            install "chrome-headless-shell@$shell_version" --path "$HOME/.cache/puppeteer" --format '{{path}}')"
          test -x "$shell_bin"
          echo "Installed chrome-headless-shell version=$shell_version path=$shell_bin"
          echo "AKARI_TEST_CHROME_PATH=$shell_bin" >> "$GITHUB_ENV"
      # 製品が配布するものと同じ同梱 ffmpeg で測る。
      # apt 6.1 は RGB→YUV を BT.601 の係数で変換し、BT.709 のタグだけを付けていたため、
      # OSR の色の 4 件が失敗していた。
      # apt の ffmpeg は取得・確認失敗時の予備と、PATH 上の ffmpeg を前提にする media-bin のテストのために残す。
      - name: Prepare bundled ffmpeg for media lane
        id: bundled_ffmpeg
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          set +e
          timeout -k 5s 4m node packages/media-bin/scripts/fetch-binaries.mjs
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::Bundled ffmpeg fetch failed (exit=$code); using apt ffmpeg"
            exit 0
          fi
          vendor_binary="$(node --input-type=module -e "import { vendorBinaryPath } from './packages/media-bin/src/binary-manifest.mjs'; process.stdout.write(vendorBinaryPath('ffmpeg'))")"
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::Bundled ffmpeg path lookup failed (exit=$code); using apt ffmpeg"
            exit 0
          fi
          vendor_dir="$(dirname "$vendor_binary")"
          for binary in ffmpeg ffprobe; do
            if [ ! -x "$vendor_dir/$binary" ]; then
              echo "::warning::Bundled $binary is not executable (exit=1); using apt ffmpeg"
              exit 0
            fi
            version="$("$vendor_dir/$binary" -version)"
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "::warning::Bundled $binary version check failed (exit=$code); using apt ffmpeg"
              exit 0
            fi
            if [ "$binary" = ffmpeg ]; then
              vendor_version="${version%%$'\n'*}"
            fi
          done
          printf '%s\n' "$vendor_dir" >> "$GITHUB_PATH"
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::Bundled ffmpeg PATH update failed (exit=$code); using apt ffmpeg"
            exit 0
          fi
          echo "Using bundled ffmpeg dir=$vendor_dir version=$vendor_version"
          exit 0
      - name: unit tests (lane media)
        id: tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.setup_node.outcome == 'success' && steps.system_deps.outcome == 'success' && steps.install.outcome == 'success' && steps.playwright.outcome == 'success' }}
        continue-on-error: true
        run: |
          ffmpeg_path="$(command -v ffmpeg || true)"
          ffprobe_path="$(command -v ffprobe || true)"
          ffmpeg_version="$(ffmpeg -version 2>/dev/null)" || ffmpeg_version=missing
          ffprobe_version="$(ffprobe -version 2>/dev/null)" || ffprobe_version=missing
          ffmpeg_version="${ffmpeg_version%%$'\n'*}"
          ffprobe_version="${ffprobe_version%%$'\n'*}"
          printf 'MEDIA_FFMPEG ffmpeg=%s version=%s\n' "${ffmpeg_path:-missing}" "${ffmpeg_version:-missing}"
          printf 'MEDIA_FFMPEG ffprobe=%s version=%s\n' "${ffprobe_path:-missing}" "${ffprobe_version:-missing}"
          GITHUB_STEP_SUMMARY="$RUNNER_TEMP/unit-media-table.md" AKARI_UNIT_LANE_RESULT="$RUNNER_TEMP/unit-media-result.json" xvfb-run -a node scripts/ci/run-unit-tests.mjs --lane media
        env:
          CHROME_PATH: /usr/bin/google-chrome
          ELECTRON_DISABLE_SANDBOX: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: reference summary (参考ジョブの結果を警告で見せる)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          failed=()
          if [ "${{ steps.checkout.outcome }}" = failure ]; then failed+=(checkout); fi
          if [ "${{ steps.setup_node.outcome }}" = failure ]; then failed+=(setup-node); fi
          if [ "${{ steps.system_deps.outcome }}" = failure ]; then failed+=(system-deps); fi
          if [ "${{ steps.install.outcome }}" = failure ]; then failed+=(npm-ci); fi
          if [ "${{ steps.playwright.outcome }}" = failure ]; then failed+=(Playwright); fi
          tolerated=()
          if [ "${{ steps.electron.outcome }}" = failure ]; then tolerated+=(Electron); fi
          if [ "${{ steps.transcript.outcome }}" = failure ]; then tolerated+=(transcript-build); fi
          if [ "${{ steps.headless_shell.outcome }}" = failure ]; then tolerated+=(headless-shell); fi
          if [ "${{ steps.bundled_ffmpeg.outcome }}" = failure ]; then tolerated+=(bundled-ffmpeg); fi
          if [ "${{ steps.tests.outcome }}" != success ] && [ "${{ steps.tests.outcome }}" != failure ] && [ "${#failed[@]}" -gt 0 ]; then
            message="unit-media (ffmpeg / Chrome が要る — 参考) は準備が失敗してテストが走らなかった（失敗: ${failed[*]}）"
            echo "::warning title=参考ジョブ::$message"
            printf '%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.tests.outcome }}" = failure ]; then
            result="$RUNNER_TEMP/unit-media-result.json"
            count=1
            if [ -f "$result" ]; then count="$(node -e "const r=require(process.argv[1]);console.log(Math.max(1,r.failed.length))" "$result")"; fi
            echo "::warning title=参考ジョブ::unit-media (ffmpeg / Chrome が要る — 参考) で $count 件落ちた（詳細は Summary）"
            printf 'unit-media: %s 件落ちた\n' "$count" >> "$GITHUB_STEP_SUMMARY"
            if [ "${#tolerated[@]}" -gt 0 ]; then printf '準備の一部が失敗したままテストを走らせた: %s\n' "${tolerated[*]}" >> "$GITHUB_STEP_SUMMARY"; fi
            if [ -f "$result" ]; then
              node -e "for(const e of require(process.argv[1]).entries.filter(e=>e.exit!==0)) console.log('- '+e.id+' (fail: '+(e.fail??'不明')+')')" "$result" >> "$GITHUB_STEP_SUMMARY"
            else
              echo '- unit tests (lane media) (結果 JSON なし)' >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "${{ steps.tests.outcome }}" = success ]; then
            echo 'unit-media: 0 件落ちた（すべて通過）' >> "$GITHUB_STEP_SUMMARY"
            if [ "${#tolerated[@]}" -gt 0 ]; then printf '準備の一部が失敗したままテストを走らせた: %s\n' "${tolerated[*]}" >> "$GITHUB_STEP_SUMMARY"; fi
          else
            message="unit-media (ffmpeg / Chrome が要る — 参考) のテストが走らなかった（tests outcome=${{ steps.tests.outcome }}）"
            echo "::warning title=参考ジョブ::$message"
            printf '%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/unit-media-table.md" ]; then cat "$RUNNER_TEMP/unit-media-table.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0

  l0:
    name: L0 (build:ext + lint + shell unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
          cache: npm
          cache-dependency-path: apps/shell/package-lock.json

      # frame-engine の再バンドルには repoRoot の node_modules が必要。CI の drift 検査を
      # 依存不足で skip させず実行するため、shell 側とは別にルート依存も用意する。
      # root の npm ci は workspaces を reify して apps/shell/node_modules を空にするため、
      # 必ず shell install より前に置く（2026-09-04 実測: 804 → 1 エントリ）。
      - name: Install workspace dependencies for frame-engine drift check (repo root)
        working-directory: ${{ github.workspace }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      # apps/shell/package-lock.json は 2026-08-19 から追跡対象（apps/shell/.gitignore 参照）なので
      # `npm ci` を使う（2026-09-02 に `npm install` から切替。`npm install` はその日のレジストリで
      # lock を書き換えるドリフトの入口）。--no-workspaces keeps the install isolated to
      # apps/shell/node_modules instead of hoisting into the repo-root workspace tree
      # (confirmed: plain `npm install` from apps/shell hoists ~800 packages to the repo
      # root and takes ~2x longer).
      #
      # --ignore-scripts skips every node-gyp build. This job type-checks (tsc -b), lints
      # (eslint) and runs the shell unit tests, and none of them needs a compiled native
      # module — only the packages' .d.ts and JS, which arrive in the tarballs regardless
      # of scripts. Without it the install dies on native-keymap, which needs X11 headers
      # absent from ubuntu-latest ("Package 'x11', required by 'virtual:world', not found").
      # Installing those headers would only move the failure to the next of the five
      # node-gyp packages (node-pty / drivelist / native-keymap / msgpackr-extract /
      # keytar), so skip the builds instead of chasing system deps.
      #
      # The tradeoff: this job cannot run `npm run build` (theia build needs a real
      # unpacked Electron) or `npm run package`. Those live in windows-build.yml (manual)
      # and release.yml, not here.
      - name: Install dependencies (npm ci --no-workspaces --ignore-scripts)
        run: npm ci --no-workspaces --ignore-scripts --no-audit --no-fund

      # akari-video（packages/akari-launcher の公開名）は apps/shell/package-lock.json に
      # "link": true（../../packages/akari-launcher）で記録されているので、npm ci が workspace 実体への
      # symlink を張る（2026-09-02 ローカル実測）。旧「registry 版をローカル実体へ張り替える」ステップは
      # lock 追跡で不要になった。

      - name: build:ext (tsc -b, 11 extensions)
        run: npm run build:ext

      # 拡張のテストの一部（akari-annotations の photo-panel-state / akari-preview の cut-size-basis・
      # photo-preview-mask）は packages/frame-engine/dist（git 管理外のビルド産物）を import する。
      # ここで作らないと clean checkout では ERR_MODULE_NOT_FOUND で必ず落ちる（手元は dist が残っていて気づけない）。
      - name: build frame-engine dist (拡張テストが import する)
        run: npm --prefix ../../packages/frame-engine run build

      - name: lint (eslint)
        run: npm run lint

      # apps/shell/test + 拡張 7 本 + akari-preview（実 Chrome を要する 1 ファイルを除外。理由と一覧は
      # scripts/ci/run-unit-tests.mjs の NOT_COVERED）。build:ext 済みなので拡張側の tsc -b は増分で数秒。
      - name: unit tests (lane shell)
        run: node ../../scripts/ci/run-unit-tests.mjs --lane shell
