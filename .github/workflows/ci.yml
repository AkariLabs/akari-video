name: CI

# レーン構成（2026-09-02 オーナー裁定「本体とテストを 1 対 1 に」）:
#   required（赤なら main へ合流させない）: packaged-imports / skills-index / unit / L0
#   参考（continue-on-error。結果は見えるが止めない）: unit-quarantine / unit-media
# ユニットテストのレーン定義（どのパッケージがどこに属し、何を載せていないか・その理由）の正本は
# scripts/ci/run-unit-tests.mjs（`npm run test:lanes` で一覧）。required に載せるのは「どの環境でも
# 同じ結果になる」テストだけ。環境依存を required にすると常時赤になって赤が情報でなくなる
# （engine-v2.yml の required / 参考の二分と同じ流儀）。frame-engine / osr-export / gpu-export は
# engine-v2.yml（Electron 実機付き）が担当し、ここには載せない。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # skills/ 正本と .claude/skills / .agents/skills / .cursor/skills の symlink 整合 + AGENTS.md 生成索引のドリフト検査。
  # スクリプト自体は依存ゼロで動く（js-yaml 不在時は最小フォールバック）が、この
  # ジョブでは root devDependencies（js-yaml のみ）を入れて厳密 YAML 検証（issue #4 の
  # 再発ゲート）を CI で 1 レーン担保する。--no-workspaces で apps/shell 等の重い
  # workspace install は走らない
  packaged-imports:
    name: packaged-imports (extraResources を模擬 Resources に組んで入口の import グラフを検査)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
      # 同じ required の配布ゲートへ相乗りし、RVM コード・重みの混入を最短で止める。
      # Node 組み込みのみで追加 install は不要なため、依存 staging より先に実行する。
      - name: check-no-gpl-redistribution
        run: node scripts/release/check-no-gpl-redistribution.mjs
      # v0.1.25 の同梱漏れ（packages/gpu-export / skills/analyze-footage/bin/person-matte / @webav/mp4box.js）は
      # モノレポのテストでは見えず、実ビルドのパッケージ版でだけ ERR_MODULE_NOT_FOUND になった。
      # release.yml と同じ手順で同梱 npm 入口を staging し、extraResources どおりの模擬 Resources から
      # 入口（packages/*/bin/*.mjs + osr-export / gpu-export の electron-main.mjs）の静的 import を辿る。
      # 数秒・決定論。root の npm ci は要らない（同梱 CLI の入口だけを --no-save で入れる）。
      - name: Install bundled-CLI runtime deps (repo root, --no-save)
        run: node scripts/release/install-bundled-cli-deps.mjs
      - name: Stage resources/cli-node-modules
        run: node apps/shell/resources/scripts/bundle-cli-node-modules.mjs
      - name: check-packaged-imports
        run: node scripts/release/check-packaged-imports.mjs

  skills-index:
    name: skills-index (symlink 整合 + AGENTS.md drift + frontmatter YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
      - run: npm install --no-workspaces --ignore-scripts --no-audit --no-fund
      - run: node scripts/gen-skills-index.mjs --check --strict
      - run: node scripts/check-docs-sync.mjs

  # packages/* + scripts/test + skills/* のユニットテストのうち、外部ツール（ffmpeg / Chrome / Electron /
  # ネイティブモジュール）を一切要さず、どの OS でも同じ結果になるもの。2026-09-02 の実測で main が緑の集合。
  unit:
    name: unit (packages/* + scripts/test + skills/* — 外部ツール不要・required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
          cache: npm
      # root の package-lock.json は packages/* と apps/shell を含む workspace lock（lockfileVersion 3）。
      # --ignore-scripts で node-gyp / electron / puppeteer / onnxruntime の install script を全部止める
      # （pure レーンのテストはどれもネイティブ実体を要さない。要るものは unit-media レーン）。
      # ローカル実測 2026-09-02（macOS arm64・Node 26.3.0）: added 1480 packages / 7 s（キャッシュ有）。
      - name: Install workspace dependencies (repo root, npm ci --ignore-scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: unit tests (lane pure)
        run: node scripts/ci/run-unit-tests.mjs --lane pure

  # 参考: main で既に赤いパッケージ（理由はレーン定義のコメント参照）。required に入れると初日から赤で
  # 止まるので隔離し、修正タスクで緑になったら pure へ移す。
  unit-quarantine:
    name: unit-quarantine (main で既に赤・修正待ち — 参考)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
          cache: npm
      - name: Install workspace dependencies (repo root, npm ci --ignore-scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: unit tests (lane quarantine)
        run: node scripts/ci/run-unit-tests.mjs --lane quarantine

  # 参考: ffmpeg / ffprobe / Chrome が要るパッケージ。Linux ランナーで通る保証は無い（symlink 権限・
  # GPU・フォントの差）。緑が安定したら required 化を検討する。
  unit-media:
    name: unit-media (ffmpeg / Chrome が要る — 参考)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install workspace dependencies (repo root, npm ci --ignore-scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      # preview-server は @playwright/test（root devDependency）の chromium を、overlay-runtime は
      # puppeteer-core + CHROME_PATH（ubuntu-latest 同梱の Google Chrome）を使う
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: unit tests (lane media)
        run: node scripts/ci/run-unit-tests.mjs --lane media
        env:
          CHROME_PATH: /usr/bin/google-chrome

  l0:
    name: L0 (build:ext + lint + shell unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
          cache: npm
          cache-dependency-path: apps/shell/package-lock.json

      # apps/shell/package-lock.json は 2026-08-19 から追跡対象（apps/shell/.gitignore 参照）なので
      # `npm ci` を使う（2026-09-02 に `npm install` から切替。`npm install` はその日のレジストリで
      # lock を書き換えるドリフトの入口）。--no-workspaces keeps the install isolated to
      # apps/shell/node_modules instead of hoisting into the repo-root workspace tree
      # (confirmed: plain `npm install` from apps/shell hoists ~800 packages to the repo
      # root and takes ~2x longer).
      #
      # --ignore-scripts skips every node-gyp build. This job type-checks (tsc -b), lints
      # (eslint) and runs the shell unit tests, and none of them needs a compiled native
      # module — only the packages' .d.ts and JS, which arrive in the tarballs regardless
      # of scripts. Without it the install dies on native-keymap, which needs X11 headers
      # absent from ubuntu-latest ("Package 'x11', required by 'virtual:world', not found").
      # Installing those headers would only move the failure to the next of the five
      # node-gyp packages (node-pty / drivelist / native-keymap / msgpackr-extract /
      # keytar), so skip the builds instead of chasing system deps.
      #
      # The tradeoff: this job cannot run `npm run build` (theia build needs a real
      # unpacked Electron) or `npm run package`. Those live in windows-build.yml (manual)
      # and release.yml, not here.
      - name: Install dependencies (npm ci --no-workspaces --ignore-scripts)
        run: npm ci --no-workspaces --ignore-scripts --no-audit --no-fund

      # akari-video（packages/akari-launcher の公開名）は apps/shell/package-lock.json に
      # "link": true（../../packages/akari-launcher）で記録されているので、npm ci が workspace 実体への
      # symlink を張る（2026-09-02 ローカル実測）。旧「registry 版をローカル実体へ張り替える」ステップは
      # lock 追跡で不要になった。

      - name: build:ext (tsc -b, 9 extensions)
        run: npm run build:ext

      - name: lint (eslint)
        run: npm run lint

      # apps/shell/test + 拡張 6 本 + akari-preview（実 Chrome を要する 1 ファイルを除外。理由と一覧は
      # scripts/ci/run-unit-tests.mjs の NOT_COVERED）。build:ext 済みなので拡張側の tsc -b は増分で数秒。
      - name: unit tests (lane shell)
        run: node ../../scripts/ci/run-unit-tests.mjs --lane shell
