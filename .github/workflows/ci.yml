name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # skills/ 正本と .claude/skills / .agents/skills / .cursor/skills の symlink 整合 + AGENTS.md 生成索引のドリフト検査。
  # スクリプト自体は依存ゼロで動く（js-yaml 不在時は最小フォールバック）が、この
  # ジョブでは root devDependencies（js-yaml のみ）を入れて厳密 YAML 検証（issue #4 の
  # 再発ゲート）を CI で 1 レーン担保する。--no-workspaces で apps/shell 等の重い
  # workspace install は走らない
  skills-index:
    name: skills-index (symlink 整合 + AGENTS.md drift + frontmatter YAML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
      - run: npm install --no-workspaces --ignore-scripts --no-audit --no-fund
      - run: node scripts/gen-skills-index.mjs --check --strict

  l0:
    name: L0 (build:ext + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'

      # apps/shell/package-lock.json is intentionally gitignored (apps/shell/.gitignore),
      # so this cannot use `npm ci`. --no-workspaces keeps the install isolated to
      # apps/shell/node_modules instead of hoisting into the repo-root workspace tree
      # (confirmed: plain `npm install` from apps/shell hoists ~800 packages to the repo
      # root and takes ~2x longer).
      #
      # --ignore-scripts skips every node-gyp build. This job only type-checks (tsc -b)
      # and lints (eslint), and neither needs a compiled native module — only the
      # packages' .d.ts and JS, which arrive in the tarballs regardless of scripts.
      # Without it the install dies on native-keymap, which needs X11 headers absent
      # from ubuntu-latest ("Package 'x11', required by 'virtual:world', not found").
      # Installing those headers would only move the failure to the next of the five
      # node-gyp packages (node-pty / drivelist / native-keymap / msgpackr-extract /
      # keytar), so skip the builds instead of chasing system deps.
      #
      # The tradeoff: this job cannot run `npm run build` (theia build needs a real
      # unpacked Electron) or `npm run package`. The app is macOS-only — electron-builder
      # targets mac alone — so a Linux runner could never verify the .app anyway.
      # Covering the real build requires a macOS runner (10x billing); deferred by owner
      # decision 2026-07-16.
      - name: Install dependencies
        run: npm install --no-workspaces --ignore-scripts

      # akari-video は workspace パッケージ（packages/akari-launcher）の公開名。
      # --no-workspaces install は npm registry の公開版を持ってくるため、未リリースの
      # モジュールを import する拡張（akari-project → store-device-connect）が TS2307 で
      # 落ちる。tsc の前に registry 版をローカル実体へ張り替える（ローカル開発は
      # repo-root の workspace link で同じ解決になっている — 挙動を CI が再現するだけ）。
      - name: Link workspace akari-video (launcher) over the registry copy
        run: rm -rf node_modules/akari-video && ln -s ../../../packages/akari-launcher node_modules/akari-video

      - name: build:ext (tsc -b, 6 extensions)
        run: npm run build:ext

      - name: lint (eslint)
        run: npm run lint
