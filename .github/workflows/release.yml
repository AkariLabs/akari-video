name: Release

# リリース列車 v0（版整合ゲート・latest.json フィード・リリースワークフローの契約は
# 非公開の内部リポジトリ akari-video-internal 側で管理している）。
#
# タグ vX.Y.Z の push、または workflow_dispatch（tag 選択 + dry_run / stable / feed_only 入力）で
# 発火する。実際にタグを push する・このワークフローを走らせる・GitHub Release を公開する・
# npm publish を実行する操作そのものは、このワークフローを追加した実装作業の範囲外
# （検収後に司令塔が行う）。ここに書くのは「発火されたら何が起きるか」のロジックのみ。
#
# 流れ: 版整合ゲート →（mac シェルビルド → DMG 公証 + staple → 署名検証ゲート）∥ win シェルビルド ∥ CLI tarball ∥
#       app tarball（CLI self-update 用フル構成ソース、並列）
#       → latest.json 生成 → draft + prerelease Release 作成・asset 添付
#       （updates フィードはここでは触らない — 2026-08-29 改訂・下記 feed_only）
#
# dry_run: true のときは版整合ゲート〜ビルドまでは通常どおり走らせ、Release 作成と
# フィード更新だけをスキップして成果物一式を artifact upload に留める。
# feed_only: true のときはビルド・Release 作成を全てスキップし、指定タグの既存 Release から
# 成果物を取得して latest.json を作り直し、updates フィードだけを差し替える。
# 2026-08-29 改訂: タグ push 時の自動フィード更新（旧 feed-update ジョブ）は廃止した。draft の段階で
# フィードが新版を指してしまい、自動更新クライアントが draft の asset を落とせない窓が開くため
# （v0.1.26 / v0.1.27 で実際に発生）。フィード更新は司令塔が本体 Release を公開した後に
# `gh workflow run release.yml -f tag=vX.Y.Z -f feed_only=true` で行う（release-train Phase 4）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          対象タグ（例 v0.1.0）。未指定なら「Use workflow from」で選んだ ref のタグ名を使う。
          feed_only での再実行など、ref 選択と別にタグを明示したい場合に使う
        type: string
        default: ''
      dry_run:
        description: 'true ならビルド成果物を artifact upload のみに留め、Release 作成・フィード更新をスキップする'
        type: boolean
        default: false
      stable:
        description: 'true なら channel を stable にし、prerelease フラグを外して Release を作成する（既定はプレリリース）'
        type: boolean
        default: false
      feed_only:
        description: 'true ならビルド・Release 作成を全てスキップし、対象タグの既存 Release から updates フィードだけを再生成・差し替える（本体 Release を公開した後に司令塔が発火する唯一のフィード更新経路・2026-08-29〜）'
        type: boolean
        default: false

permissions:
  contents: write

env:
  # release-artifacts/ に置く固定名は scripts/release/gen-latest-json.mjs の
  # ARTIFACT_FILES と一致させること（url 組み立て・sha256 計算がこの名前に依存する）。
  # DMG は版付き名を build-mac の dmg_name output で渡す。
  ARTIFACT_MAC: shell-mac.zip
  ARTIFACT_WIN: shell-win.zip
  ARTIFACT_WIN_SETUP: shell-win-setup.exe
  ARTIFACT_CLI: cli.tgz
  # フル構成ソース tarball（install.sh が展開するものと同内容 = タグのソースツリー）。
  # CLI self-update（内部リポ契約 update-and-versioning §11）が latest.json の
  # components.app 経由で DL する実体。cli.tgz（npm パッケージのサブセット）とは別物。
  ARTIFACT_APP: app.tgz
  # electron-updater（U3・契約 §11）自身が読むメタデータ。gen-latest-json.mjs の
  # ARTIFACT_FILES（latest.json 生成の入力契約）とは無関係の別レール — シェルの
  # apps/shell/package.json build.publish（GitHub provider）+ per-target artifactName
  # （mac.artifactName / nsis.artifactName）により、electron-builder がここで固定した
  # ファイル名をそのまま出力する（=「固定名へリネーム」する後処理が要らない設計）。
  ARTIFACT_MAC_UPDATE_YML: latest-mac.yml
  ARTIFACT_MAC_BLOCKMAP: shell-mac.zip.blockmap
  ARTIFACT_WIN_UPDATE_YML: latest.yml
  ARTIFACT_WIN_BLOCKMAP: shell-win-setup.exe.blockmap

jobs:
  # push:tags と workflow_dispatch の両方から同じ形で「対象タグ文字列」を得るための前段ジョブ。
  # env コンテキストの三項演算子は inputs が存在しないイベント（push）で型強制の落とし穴が
  # あるため、bash の文字列比較で解決する（GITHUB_OUTPUT 経由で後続ジョブへ渡す）。
  resolve-tag:
    name: resolve-tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

  version-gate:
    name: version-gate (check-release-versions)
    needs: resolve-tag
    if: ${{ !inputs.feed_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
      - name: 版整合ゲート（タグ ↔ shell/cli/plugin の version）
        run: node scripts/release/check-release-versions.mjs "${{ needs.resolve-tag.outputs.tag }}"

  # 同梱漏れゲート（v0.1.25 の再発防止）: extraResources どおりの模擬 Resources を組み、入口の静的 import を
  # 辿って欠けがあればビルド前に落とす。ci.yml の packaged-imports と同じ手順。
  packaged-imports-gate:
    name: packaged-imports-gate (同梱漏れ検査)
    needs: [resolve-tag, version-gate]
    if: ${{ !inputs.feed_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
      - run: node scripts/release/install-bundled-cli-deps.mjs
      - run: node apps/shell/resources/scripts/bundle-cli-node-modules.mjs
      - run: node scripts/release/check-packaged-imports.mjs

  build-mac:
    name: build-mac (theia build + electron-builder zip/dmg + 署名/公証)
    needs: [resolve-tag, version-gate, packaged-imports-gate]
    if: ${{ !inputs.feed_only }}
    runs-on: macos-14
    timeout-minutes: 90
    outputs:
      dmg_name: ${{ steps.mac-artifacts.outputs.dmg_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'

      # verify スキル L0/L1 の既知の地雷: Homebrew Python 3.14 は node-gyp の pyexpat ABI と
      # 衝突するため、Apple 純正 Python を明示する（docs/dev 系タスクの実測に倣う）。
      #
      # ランナーの npm（Node 26 同梱）は allow-scripts ゲートが既定で有効で、electron の
      # postinstall（本体 DL）等の install script をブロックする。これは
      # .github/workflows/windows-build.yml の Install dependencies ステップ（52-82 行）が
      # win 向けに既に対処済みの問題と同根だが、その対処が release.yml の build-mac には
      # 複製されておらず欠陥だった（実測: dry_run run 30196704779 の build-mac ジョブで
      # `npm warn allow-scripts 11 packages have install scripts not yet covered` の後、
      # electron/dist/version が ENOENT で theia build が失敗）。windows-build.yml の対処
      # （approve-scripts + rebuild + electron 公式リリース zip の直接配置 + 早期ゲート）を
      # mac（bash・macos-14 は arm64）向けに移植する。
      #
      # パッケージ列は windows-build.yml の 12 件から Windows 専用の
      # @vscode/windows-ca-certs を除いたものが基本だが、machine 差を推測に頼らず run
      # 30196704779 の build-mac 実ログ（npm warn allow-scripts の一覧）で裏取りした。
      # 結果は 11 件で、win 版と異なり electron-winstaller は mac でも警告対象に**含まれる**
      # （win 版の想定どおり除外すると承認漏れになるところだった）
      - name: Install dependencies
        working-directory: apps/shell
        env:
          PYTHON: /usr/bin/python3
        run: |
          npm install --no-workspaces
          npm approve-scripts --no-workspaces electron esbuild node-pty native-keymap keytar drivelist "@parcel/watcher" msgpackr-extract "@theia/ffmpeg" electron-winstaller
          npm rebuild --no-workspaces
          # electron 本体は公式リリース zip を直接取得して配置する（windows-build.yml と同じ
          # rationale: npm rebuild は electron の postinstall〔本体 DL〕を実行しない実測が
          # win 側にあり、mac でも npm rebuild だけでは dist/version が生成されない前提で
          # 同じ対処を踏襲する）。zip 展開は verify スキル L1 節が確立済みの ditto -x -k を使う
          # （unzip でなく ditto を使う理由も同節参照）。macos-14 ランナーは arm64
          v=$(node -p "require('./node_modules/electron/package.json').version")
          echo "=== electron $v direct download (darwin-arm64)"
          curl -sSL -o electron.zip "https://github.com/electron/electron/releases/download/v$v/electron-v$v-darwin-arm64.zip"
          rm -rf node_modules/electron/dist
          mkdir -p node_modules/electron/dist
          ditto -x -k electron.zip node_modules/electron/dist
          rm electron.zip
          printf '%s' 'Electron.app/Contents/MacOS/Electron' > node_modules/electron/path.txt
          # electron 実体が入ったことの早期ゲート（無ければ theia build まで進んでも無意味）
          node -e "console.log('electron dist version:', require('fs').readFileSync('node_modules/electron/dist/version','utf8'))"
          node -e "require('fs').accessSync('node_modules/electron/dist/Electron.app/Contents/MacOS/Electron'); console.log('Electron.app OK')"

      - name: Install bundled-CLI runtime deps (repo root)
        # bundle-cli-node-modules.mjs は root node_modules から同梱 CLI の入口
        # （@webav/mp4box.js）を解決する。apps/shell の
        # --no-workspaces install では入らないため、ここで root へ導入する
        # （v0.1.13 の build 失敗の恒久対処。版は packages/*/package.json から導出）
        run: node scripts/release/install-bundled-cli-deps.mjs

      - name: build:ext (tsc -b, 9 extensions)
        working-directory: apps/shell
        run: npm run build:ext

      - name: theia build (production)
        working-directory: apps/shell
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build

      # task/2026-08-17-media-bin-whisper: whisper-cli は公式バイナリ配布が macOS 向けに無いため
      # ここで版固定ソース（binary-manifest.mjs の WHISPER_CPP_SOURCE）を cmake ビルドし、
      # packages/media-bin/vendor/darwin-arm64/ に置く（macos-14 ランナーは arm64。x64 は
      # 当面スコープ外）。prepackage（bundle-media-binaries.mjs）はこの vendor 配置を
      # best-effort で拾って resources/vendor-ffmpeg/ へ同梱するため、必ず prepackage より
      # 前に実行する。cmake は macos-14 イメージに既定同梱（ビルド不能ならスキップし、
      # 文字起こし機能なしで先へ進む — ffmpeg 取得と同じベストエフォート精神。詳細は
      # packages/media-bin/scripts/build-whisper.mjs 冒頭コメント）。
      - name: build-whisper (whisper.cpp ソースビルド, cmake)
        working-directory: packages/media-bin
        run: npm run build:whisper

      # 検収時追加（司令塔・2026-08-17）: build-whisper は cmake 不在環境でベストエフォート
      # スキップする設計だが、cmake が既定同梱の macos-14 ランナーで沈黙スキップ/沈黙失敗を
      # 許すと whisper-cli 無しの dmg が静かに出荷される。windows-build.yml 側の
      # 「whisper-cli 同梱確認」と対で、リリース CI ではビルド成果の実在と実行可否を fail-closed で検収する。
      - name: whisper-cli ビルド確認 (mac)
        working-directory: packages/media-bin
        run: |
          test -x vendor/darwin-arm64/whisper-cli || { echo "whisper-cli がビルドされていません"; exit 1; }
          ./vendor/darwin-arm64/whisper-cli --help > /dev/null || { echo "whisper-cli --help が失敗しました"; exit 1; }
          ls -la vendor/darwin-arm64/whisper-cli

      - name: prepackage (copy native helpers)
        working-directory: apps/shell
        run: npm run prepackage

      # secrets 不在でもビルドは継続する（D2 裁定: Apple secrets 登録はオーナー作業で後回し）。
      # electron-builder は CSC_LINK 未設定なら自動的に未署名ビルドへフォールバックし、
      # notarize 用の APPLE_API_KEY 系が未設定なら公証ステップを自動でスキップするが、
      # それとは別に「secrets が無かった」という事実をジョブサマリに日本語で残す。
      - name: mac 署名・公証 secrets の有無を確認
        run: |
          if [ -z "${{ secrets.CSC_LINK }}" ] || [ -z "${{ secrets.CSC_KEY_PASSWORD }}" ]; then
            {
              echo "### ⚠️ mac 署名スキップ"
              echo ""
              echo "\`CSC_LINK\` / \`CSC_KEY_PASSWORD\` が未登録のため、mac 成果物は未署名のまま作成されました。"
              echo "署名を有効にするにはリポジトリ secrets に両方を登録してください（登録はオーナー作業）。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "${{ secrets.APPLE_API_KEY }}" ] || [ -z "${{ secrets.APPLE_API_KEY_ID }}" ] || [ -z "${{ secrets.APPLE_API_ISSUER }}" ]; then
            {
              echo "### ⚠️ mac 公証（notarize）スキップ"
              echo ""
              echo "\`APPLE_API_KEY\` / \`APPLE_API_KEY_ID\` / \`APPLE_API_ISSUER\` が未登録のため、公証はスキップされました。"
              echo "有効にするには 3 つの secrets を登録してください（登録はオーナー作業）。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # APPLE_API_KEY は electron-builder（@electron/notarize 経由）が xcrun notarytool の
      # `--key` 引数へ無変換でそのまま渡す値で、.p8 秘密鍵ファイルへの「パス」を要求する
      # （@electron/notarize 2.5.0 lib/types.d.ts の NotaryToolApiKeyCredentials.appleApiKey
      # doc コメント「File system path to the `.p8` private key...」、および
      # lib/notarytool.js の authorizationArgs() が opts.appleApiKey をそのまま
      # `--key` の値として渡している実装で確認。app-builder-lib 26.15.3
      # out/mac/MacTargetHelper.js の getNotarizeOptions() も process.env.APPLE_API_KEY を
      # 無変換で appleApiKey に代入するだけなので、env の中身がそのまま notarytool の
      # --key 引数になる）。オーナーの secret 登録運用は .p8 の中身をそのまま登録する形
      # （変更不可・司令塔案内済み）のため、ここで一度ファイルに書き出してからパスを渡す。
      # printf '%s' で書く（echo は改行の扱いが環境依存で、.p8 は複数行の PEM 形式のため
      # 改行を壊さないことを優先した）。secrets コンテキストは if: 条件では参照できない
      # （actionlint 実測: "context 'secrets' is not allowed here"）ため、step 自体は常に
      # 走らせ、env 経由で受け取った値の有無を bash 側で分岐する（secrets を env: に渡すのは
      # 許可された場所）。secret が空なら path 出力を空文字にし、package ステップの
      # APPLE_API_KEY env も空文字のまま（従来どおり notarize スキップ）
      - name: APPLE_API_KEY（.p8）を一時ファイルへ書き出す
        id: apple-api-key-file
        env:
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY_SECRET" ]; then
            key_path="$RUNNER_TEMP/apple_api_key.p8"
            printf '%s' "$APPLE_API_KEY_SECRET" > "$key_path"
            chmod 600 "$key_path"
            echo "path=$key_path" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      # 既存の `npm run package`（package.json の scripts.package）は `electron-builder --dir`
      # 固定で、apps/shell/package.json の mac.target（"dir"）をそのまま使う。ここでは
      # zip/dmg という「リリース成果物としての」ターゲットが要るため、package.json の
      # build 設定（mac.target）自体は変更せず、electron-builder の CLI 引数でこの
      # 呼び出し限りターゲットを上書きする（--mac zip dmg）。CSC_LINK 等が空文字なら
      # electron-builder は自動的に未署名ビルドにフォールバックする（エラーにしない）。
      # secrets 不在時に env: で直接 CSC_LINK 等をセットすると「空文字列」になり、
      # app-builder-lib 側は unset と空文字を区別しないコード経路を通ってしまう
      # （dry_run run 30197297936 の実測: `empty password will be used for code signing`
      # の後 `.../apps/shell not a file` で package が失敗。原因は
      # app-builder-lib@26.15.3 out/platformPackager.js:81-84 の getCscLink() /
      # :708-710 の chooseNotNull(v1,v2){ return v1==null?v2:v1 } —
      # `''=='' == null` は false なので空文字は「値あり」と判定される。macPackager.js:24-26
      # の codeSigningInfo は `cscLink==null` の場合のみ signing をスキップするため、空文字は
      # スキップされず codeSign/codesign.js:8-31 の importCertificate() へ進み、https/base64
      # どちらでもないため builder-util/out/cscLink.js:20-38 の resolveCscLinkPath('', currentDir)
      # → path.resolve(currentDir, '') = currentDir（= apps/shell、ディレクトリ）に解決され、
      # codesign.js:26-27 で `${file} not a file` の InvalidConfigurationError になる。
      # 対策: secrets は一旦 *_SECRET 名で受け、非空のときだけ本来の env 名へ export する
      # （export しなければ process.env に一切現れず、chooseNotNull は undefined を見て
      # 正しく unset 扱いになる）。
      #
      # CSC_LINK が空のときは CSC_IDENTITY_AUTO_DISCOVERY=false も明示する。理由:
      # app-builder-lib@26.15.3 out/util/flags.js:14 の isAutoDiscoveryCodeSignIdentity() は
      # `process.env.CSC_IDENTITY_AUTO_DISCOVERY !== "false"` で既定 true を返し、
      # out/codeSign/macCodeSign.js:264-269 の findIdentity() はこの既定 true のとき
      # ランナーのキーチェーンから署名 identity を自動探索してしまう
      # （CSC_LINK 不在＝明示的な証明書指定なしでも、ランナーのキーチェーンに何か identity が
      # あれば拾われ得る）。CSC_IDENTITY_AUTO_DISCOVERY=false で findIdentity() は探索せず
      # 即 null を返すため、CSC_LINK 不在時は確実に未署名になる
      #
      # APPLE_API_KEY_ID / APPLE_API_ISSUER も同じ *_SECRET パターンへ揃えたが、実害は無い
      # ことをソースで確認済み: app-builder-lib@26.15.3 out/mac/MacTargetHelper.js:236-241 の
      # getNotarizeOptions() は `appleApiKey || appleApiKeyId || appleApiIssuer` という
      # truthy 判定（chooseNotNull の `==null` 判定ではない）を使うため、空文字は falsy として
      # 正しく「未設定」扱いになる（3つとも空文字なら通常どおり notarize スキップに落ちる）。
      # APPLE_API_KEY は前段ステップの出力（steps.apple-api-key-file.outputs.path）を
      # そのまま使う点は変更なし（secret 本文ではなく計算済みの値のため、この空文字問題の対象外）
      - name: package (electron-builder --mac zip dmg)
        working-directory: apps/shell
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_PATH: ${{ steps.apple-api-key-file.outputs.path }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CSC_LINK_SECRET" ]; then
            export CSC_LINK="$CSC_LINK_SECRET"
            export CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_SECRET"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -n "$APPLE_API_KEY_PATH" ] && [ -n "$APPLE_API_KEY_ID_SECRET" ] && [ -n "$APPLE_API_ISSUER_SECRET" ]; then
            export APPLE_API_KEY="$APPLE_API_KEY_PATH"
            export APPLE_API_KEY_ID="$APPLE_API_KEY_ID_SECRET"
            export APPLE_API_ISSUER="$APPLE_API_ISSUER_SECRET"
          fi
          # --publish never: apps/shell/package.json の build.publish（GitHub provider・U3）
          # により electron-builder は electron-updater 用メタデータ（latest-mac.yml +
          # zip の blockmap）をローカルに生成するが、実際の GitHub への publish 試行は
          # しない（この CI ステップに GH_TOKEN は渡していない — publish は既存どおり
          # 後段の release ジョブの `gh release create` が担う。二重の公開経路を作らない）。
          npx electron-builder --mac zip dmg --publish never

      - name: mac DMG の公証 + staple
        working-directory: apps/shell
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          APPLE_API_KEY_PATH: ${{ steps.apple-api-key-file.outputs.path }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "$CSC_LINK_SECRET" ]; then
            {
              echo '### ⚠️ mac DMG 公証スキップ'
              echo ""
              echo '未署名ビルドのため、DMG 公証をスキップしました。'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$APPLE_API_KEY_PATH" ] || [ -z "$APPLE_API_KEY_ID_SECRET" ] || [ -z "$APPLE_API_ISSUER_SECRET" ]; then
            {
              echo '### ❌ mac DMG 公証設定不足'
              echo ""
              echo 'APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER が不足しています。署名済みだが未公証の DMG は Gatekeeper が開かせないため、中途半端な secrets 構成では配布物を作らない。'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          shopt -s nullglob
          dmgs=(electron-builder-out/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::mac dmg 成果物は 1 個必要です（検出: ${#dmgs[@]}）"; exit 1
          fi
          dmg="${dmgs[0]}"
          submission_json="$RUNNER_TEMP/mac-dmg-notarization.json"
          submit_result=0
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY_ID_SECRET" \
            --issuer "$APPLE_API_ISSUER_SECRET" --wait --timeout 30m --output-format json \
            > "$submission_json" || submit_result=$?
          cat "$submission_json"
          status=$(node -e 'const r = require(process.argv[1]); console.log(r.status || "");' "$submission_json")
          submission_id=$(node -e 'const r = require(process.argv[1]); console.log(r.id || "");' "$submission_json")
          if [ "$status" != 'Accepted' ] || [ "$submit_result" -ne 0 ]; then
            if [ -n "$submission_id" ]; then
              xcrun notarytool log "$submission_id" --key "$APPLE_API_KEY_PATH" \
                --key-id "$APPLE_API_KEY_ID_SECRET" --issuer "$APPLE_API_ISSUER_SECRET" || true
            fi
            echo "DMG 公証失敗: status=$status, submission id=$submission_id" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          xcrun stapler staple "$dmg"
          {
            echo '### ✅ mac DMG 公証 + staple 完了'
            echo ""
            echo "DMG: $dmg"
            echo "submission id: $submission_id"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: postpackage (verify asar contents)
        working-directory: apps/shell
        run: npm run postpackage

      # ZIP は mac.artifactName の固定名、DMG は dmg.artifactName の版付き名。
      # DMG が一意であることを確認し、実ファイル名を後続ジョブへ渡す。
      - name: 成果物の確認（固定名 ZIP + 版付き DMG が 1 個）
        id: mac-artifacts
        working-directory: apps/shell/electron-builder-out
        run: |
          test -f "${{ env.ARTIFACT_MAC }}" || { echo "mac zip 成果物（${{ env.ARTIFACT_MAC }}）が見つかりません"; exit 1; }
          shopt -s nullglob
          dmgs=(*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::mac dmg 成果物は 1 個必要です（検出: ${#dmgs[@]}）"
            exit 1
          fi
          test -f "${dmgs[0]}"
          echo "dmg_name=${dmgs[0]}" >> "$GITHUB_OUTPUT"
          ls -la "${{ env.ARTIFACT_MAC }}" "${dmgs[0]}"

      - name: mac 配布物の署名検証ゲート
        working-directory: apps/shell/electron-builder-out
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
        run: |
          set -euo pipefail
          if [ -z "$CSC_LINK_SECRET" ]; then
            echo '未署名ビルドのため署名検証ゲートをスキップ' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          shopt -s nullglob
          dmgs=(*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::mac dmg 成果物は 1 個必要です（検出: ${#dmgs[@]}）"; exit 1
          fi
          dmg="${dmgs[0]}"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          result=0
          bash "$GITHUB_WORKSPACE/scripts/release/verify-mac-artifacts.sh" "$dmg" shell-mac.zip \
            | tee -a "$GITHUB_STEP_SUMMARY" || result=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$result"

      - uses: actions/upload-artifact@v4
        with:
          name: shell-mac
          path: |
            apps/shell/electron-builder-out/${{ env.ARTIFACT_MAC }}
            apps/shell/electron-builder-out/${{ steps.mac-artifacts.outputs.dmg_name }}
          retention-days: 14
          if-no-files-found: error

      # electron-updater メタデータ（U3）。latest-mac.yml は build.publish（GitHub
      # provider）が設定されていれば --publish never でもローカルに生成される。zip の
      # blockmap（差分ダウンロード用）は electron-builder のバージョン・設定次第で
      # 生成されないことがあるため、無くてもこのジョブ自体は落とさない（warn に留める —
      # latest-mac.yml が本体で blockmap は差分適用の最適化に過ぎない）。
      - name: electron-updater メタデータの確認
        working-directory: apps/shell/electron-builder-out
        run: |
          test -f "${{ env.ARTIFACT_MAC_UPDATE_YML }}" || { echo "mac latest-mac.yml が見つかりません（electron-updater メタデータ生成に失敗）"; exit 1; }
          if [ -f "${{ env.ARTIFACT_MAC_BLOCKMAP }}" ]; then
            ls -la "${{ env.ARTIFACT_MAC_UPDATE_YML }}" "${{ env.ARTIFACT_MAC_BLOCKMAP }}"
          else
            echo "::warning::mac blockmap（${{ env.ARTIFACT_MAC_BLOCKMAP }}）が見つかりません（差分ダウンロードは効かないが latest-mac.yml があれば自動更新自体は成立する）"
            ls -la "${{ env.ARTIFACT_MAC_UPDATE_YML }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: shell-mac-update-meta
          path: |
            apps/shell/electron-builder-out/${{ env.ARTIFACT_MAC_UPDATE_YML }}
            apps/shell/electron-builder-out/${{ env.ARTIFACT_MAC_BLOCKMAP }}
          retention-days: 14
          if-no-files-found: warn

  build-win:
    name: build-win (windows-build.yml の手順を踏襲)
    needs: [resolve-tag, version-gate, packaged-imports-gate]
    if: ${{ !inputs.feed_only }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # 以下は .github/workflows/windows-build.yml と同一手順の複製。
      # windows-build.yml 自体は編集禁止（既存トリガー・ジョブの挙動を変えない境界）のため、
      # reusable workflow 化はせずステップをそのまま複製している（手順・地雷情報の正本は
      # windows-build.yml 側のコメントを参照）。
      - name: Enable git symlinks and long paths
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'

      - name: Verify skills symlinks materialized
        run: node scripts/gen-skills-index.mjs --check

      - name: Install dependencies
        working-directory: apps/shell
        env:
          npm_config_enable_lto: 'false'
          npm_config_enable_thin_lto: 'false'
        run: |
          npm install --no-workspaces
          npm approve-scripts --no-workspaces electron esbuild node-pty native-keymap keytar drivelist "@parcel/watcher" msgpackr-extract "@theia/ffmpeg" "@vscode/windows-ca-certs" electron-winstaller
          npm rebuild --no-workspaces
          $v = node -p "require('./node_modules/electron/package.json').version"
          Write-Host "=== electron $v direct download"
          curl.exe -sSL -o electron.zip "https://github.com/electron/electron/releases/download/v$v/electron-v$v-win32-x64.zip"
          if (Test-Path node_modules/electron/dist) { Remove-Item -Recurse -Force node_modules/electron/dist }
          Expand-Archive electron.zip -DestinationPath node_modules/electron/dist -Force
          Remove-Item electron.zip
          Set-Content -NoNewline node_modules/electron/path.txt "electron.exe"
          node -e "console.log('electron dist version:', require('fs').readFileSync('node_modules/electron/dist/version','utf8'))"
          node -e "require('fs').accessSync('node_modules/electron/dist/electron.exe'); console.log('electron.exe OK')"

      - name: Install bundled-CLI runtime deps (repo root)
        # bundle-cli-node-modules.mjs は root node_modules から同梱 CLI の入口
        # （@webav/mp4box.js）を解決する。apps/shell の
        # --no-workspaces install では入らないため、ここで root へ導入する
        # （v0.1.13 の build 失敗の恒久対処。版は packages/*/package.json から導出）
        run: node scripts/release/install-bundled-cli-deps.mjs

      - name: build:ext (tsc -b, 9 extensions)
        working-directory: apps/shell
        run: npm run build:ext

      - name: theia build (production)
        working-directory: apps/shell
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build

      - name: package (electron-builder --dir + verify-asar)
        working-directory: apps/shell
        env:
          npm_config_enable_lto: 'false'
          npm_config_enable_thin_lto: 'false'
        run: npm run package

      # 2026-08-29 Windows アイコンの検収。v0.1.25 までの Windows 版は exe にアイコンが
      # 埋め込まれているのに実機で汎用アイコンに落ちていた。原因は electron-builder が
      # 2026-06（v26.14 / icons toolset 1.x）で PNG→ICO 変換器を wasm-vips 製へ差し替え、
      # 全サイズを PNG 圧縮エントリで詰めるようになったこと（Windows のシェルは 256px 未満の
      # PNG 圧縮エントリを描画できない。素の electron.exe 自身は 16/32/48 が DIB・256 だけ PNG）。
      # build.win.icon を古典形式（DIB エントリ）の icon.ico に固定したうえで、ここでは
      # rcedit 後の exe を PE 解析し (1) 16/32/48/256 を含む (2) 256px 未満は DIB
      # (3) 素の electron.exe と画像が同一でない（= icon.ico が効いている。electron-builder は
      # 指定アイコンが無くても警告だけで既定アイコンのまま続行する）を機械的に確認する。
      # 静的な存在 / git 追跡 / .ico 構造と判定器自体のテストは
      # apps/shell/test/electron-builder-icons.test.mjs（L0）
      - name: アイコン適用確認 (win)
        working-directory: apps/shell
        run: node resources/scripts/verify-win-icon.mjs "electron-builder-out/win-unpacked/AKARI Video.exe" node_modules/electron/dist/electron.exe

      - name: app-update.yml 生成 (win)
        run: node scripts/release/gen-app-update-yml.mjs apps/shell/electron-builder-out/win-unpacked/resources/app-update.yml

      # task/2026-08-17-media-bin-whisper: whisper-cli.exe は win32-x64 の manifest エントリ
      # 経由で `npm run package` の暗黙の prepackage フック（bundle-media-binaries.mjs）が
      # 自動取得・同梱する（ffmpeg/ffprobe と同じ経路 — windows-build.yml に既存の明示的な
      # ffmpeg 同梱ステップが無いのと同じ理由で、ここにも別ステップは要らない）。この新規
      # 追加ステップは「実際に同梱されたか」を電子的に確認するだけの検収で、既存の
      # package/verify-asar ステップ自体には手を入れていない。
      - name: whisper-cli 同梱確認 (win)
        working-directory: apps/shell/electron-builder-out/win-unpacked/resources/media-bin
        run: |
          if (-not (Test-Path "whisper-cli.exe")) { Write-Error "whisper-cli.exe が同梱されていません"; exit 1 }
          if (-not (Test-Path "whisper.dll")) { Write-Error "whisper.dll（依存 DLL）が同梱されていません"; exit 1 }
          if (-not (Test-Path "ggml-base.dll")) { Write-Error "ggml-base.dll（依存 DLL）が同梱されていません"; exit 1 }
          Get-ChildItem "whisper-cli.exe","whisper.dll","ggml-base.dll" | Select-Object Name, Length

      # Windows は D2 の対象外・当面未署名（契約 §5 D2）。SmartScreen 警告は許容。
      - name: Zip win-unpacked
        working-directory: apps/shell/electron-builder-out
        run: 7z a -tzip ${{ env.ARTIFACT_WIN }} win-unpacked

      # 契約 §2 の「win nsis」成果物（one-click installer・per-user・未署名）。
      # --pd (--prepackaged) で verify-asar を通過済みの win-unpacked をそのまま
      # installer に包む（asar の再パックをしないため、zip と installer の中身が
      # 同一実体であることが構成上保証される）。LTO 無効化 env は --pd 経路では
      # native rebuild が走らない想定だが、走った場合に備えて Install と同じ値を与える
      # --publish never: mac 側と同じ理由（package.json build.publish が U3 で追加され、
      # そのままだと electron-builder が CI 環境を publish 試行対象と誤認しうる。
      # メタデータ（latest.yml + blockmap）はローカル生成されるが GitHub への実 publish
      # はしない — 引き続き release ジョブの gh release create が公開を担う）。
      - name: installer (electron-builder --win nsis, prepackaged)
        working-directory: apps/shell
        env:
          npm_config_enable_lto: 'false'
          npm_config_enable_thin_lto: 'false'
        run: npx electron-builder --win nsis --pd electron-builder-out/win-unpacked --publish never

      # nsis.artifactName（apps/shell/package.json = "shell-win-setup.${ext}"）により
      # electron-builder は既にこの固定名で installer を出力している（U3 以前は
      # "${productName}-Setup-${version}.${ext}" だったため find + Copy-Item が必要
      # だった。今 find し直すと送り元 = 送り先になり Copy-Item がエラーになるため、
      # 確認のみに変更。latest.yml / blockmap の存在も合わせて確認する — blockmap は
      # mac と同じ理由で無くてもこのジョブは失敗させない）。
      - name: installer + electron-updater メタデータの確認
        working-directory: apps/shell/electron-builder-out
        run: |
          if (-not (Test-Path "${{ env.ARTIFACT_WIN_SETUP }}")) { Write-Error "win installer（${{ env.ARTIFACT_WIN_SETUP }}）が見つかりません"; exit 1 }
          if (-not (Test-Path "${{ env.ARTIFACT_WIN_UPDATE_YML }}")) { Write-Error "win latest.yml が見つかりません（electron-updater メタデータ生成に失敗）"; exit 1 }
          if (-not (Test-Path "${{ env.ARTIFACT_WIN_BLOCKMAP }}")) {
            Write-Host "::warning::win blockmap（${{ env.ARTIFACT_WIN_BLOCKMAP }}）が見つかりません（差分ダウンロードは効かないが latest.yml があれば自動更新自体は成立する）"
          }
          Get-ChildItem "${{ env.ARTIFACT_WIN_SETUP }}","${{ env.ARTIFACT_WIN_UPDATE_YML }}"

      - uses: actions/upload-artifact@v4
        with:
          name: shell-win
          path: |
            apps/shell/electron-builder-out/${{ env.ARTIFACT_WIN }}
            apps/shell/electron-builder-out/${{ env.ARTIFACT_WIN_SETUP }}
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: shell-win-update-meta
          path: |
            apps/shell/electron-builder-out/${{ env.ARTIFACT_WIN_UPDATE_YML }}
            apps/shell/electron-builder-out/${{ env.ARTIFACT_WIN_BLOCKMAP }}
          retention-days: 14
          if-no-files-found: warn

  build-cli:
    name: build-cli (npm pack)
    needs: [resolve-tag, version-gate, packaged-imports-gate]
    if: ${{ !inputs.feed_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
      - name: npm pack
        working-directory: packages/akari-launcher
        run: |
          tgz=$(npm pack --silent)
          cp "$tgz" "../../${{ env.ARTIFACT_CLI }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-tarball
          path: ${{ env.ARTIFACT_CLI }}
          retention-days: 14
          if-no-files-found: error

  build-app:
    name: build-app (git archive — CLI self-update 用フル構成ソース tarball)
    needs: [resolve-tag, version-gate, packaged-imports-gate]
    if: ${{ !inputs.feed_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `git archive` はタグの git tree をそのまま tar.gz にする —
      # codeload.github.com がタグ tarball を作るのと同じ経路（内部で git archive 相当を
      # 使う）なので、install.sh の fetch_release_tarball（codeload から取得 →
      # `tar --strip-components=1`）と同じ意味論を CI 内で再現できる。単一の先頭
      # ディレクトリ（--prefix）を持つ tar.gz になるため、自己更新側の展開
      # （self-update.mjs の extractTarGz、同じく --strip-components=1）とも一致する。
      # node_modules 等の生成物は追跡外（.gitignore 済み）なので含まれない —
      # self-update は旧インストールの node_modules を引き継いで npm install で整合させる。
      - name: git archive (app.tgz)
        run: git archive --format=tar.gz --prefix=app/ -o ${{ env.ARTIFACT_APP }} HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: app-tarball
          path: ${{ env.ARTIFACT_APP }}
          retention-days: 14
          if-no-files-found: error

  release:
    name: release (latest.json 生成 + Release 作成 + asset 添付 + npm publish)
    needs: [resolve-tag, build-mac, build-win, build-cli, build-app]
    if: ${{ !inputs.feed_only }}
    runs-on: ubuntu-latest
    # id-token: write は npm publish --provenance（Sigstore OIDC 署名）に必要
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          name: shell-mac
          path: release-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: shell-win
          path: release-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: cli-tarball
          path: release-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: app-tarball
          path: release-artifacts
      # electron-updater メタデータ（U3）。build-mac/build-win 側で if-no-files-found: warn
      # にしているため、blockmap が生成されなかった場合はこのアーティファクト自体が
      # 存在しない可能性がある（latest-mac.yml/latest.yml だけの場合はある）。
      # continue-on-error にはしない — アーティファクトが 0 バイトでも yml だけは
      # 必ず含まれる設計（前段のジョブが yml 欠如を fail させている）ので、
      # download 自体は常に成功するはず
      - uses: actions/download-artifact@v4
        with:
          name: shell-mac-update-meta
          path: release-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: shell-win-update-meta
          path: release-artifacts

      # D4 裁定（契約 §5）: 既定はプレリリース。stable 化は workflow_dispatch の
      # stable: true 入力（または Release 編集）でオーナーが行う
      - name: channel を決定する
        id: channel
        run: |
          if [ "${{ inputs.stable }}" = "true" ]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease_flag=" >> "$GITHUB_OUTPUT"
          else
            echo "channel=prerelease" >> "$GITHUB_OUTPUT"
            echo "prerelease_flag=--prerelease" >> "$GITHUB_OUTPUT"
          fi

      - name: latest.json 生成
        run: |
          node scripts/release/gen-latest-json.mjs \
            --artifacts-dir release-artifacts \
            --tag "${{ needs.resolve-tag.outputs.tag }}" \
            --channel "${{ steps.channel.outputs.channel }}" \
            --released "$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" \
            --out release-artifacts/latest.json

      - name: dry_run — 成果物一式を artifact upload のみに留める
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ needs.resolve-tag.outputs.tag }}
          path: release-artifacts/
          retention-days: 14

      # draft + prerelease が既定（契約 §7-1「初回は未署名で出してよい」。npm publish の
      # 認証は Trusted Publishing に移行済み — 下の publish ステップのコメント参照）。
      # stable: true 入力時のみ --prerelease を外す
      #
      # electron-updater メタデータ（U3）: latest-mac.yml / latest.yml は必須アセット
      # （前段のジョブで欠如していれば既に fail している）。blockmap は
      # if-no-files-found: warn で生成されないことがあるため、存在するものだけを
      # 配列へ足す（gh release create は存在しないパスを渡すと即エラーになるため）
      - name: draft Release 作成 + asset 添付
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            "release-artifacts/${{ env.ARTIFACT_MAC }}"
            "release-artifacts/${{ needs.build-mac.outputs.dmg_name }}"
            "release-artifacts/${{ env.ARTIFACT_WIN }}"
            "release-artifacts/${{ env.ARTIFACT_WIN_SETUP }}"
            "release-artifacts/${{ env.ARTIFACT_CLI }}"
            "release-artifacts/${{ env.ARTIFACT_APP }}"
            "release-artifacts/${{ env.ARTIFACT_MAC_UPDATE_YML }}"
            "release-artifacts/${{ env.ARTIFACT_WIN_UPDATE_YML }}"
            "release-artifacts/latest.json"
          )
          for optional in "release-artifacts/${{ env.ARTIFACT_MAC_BLOCKMAP }}" "release-artifacts/${{ env.ARTIFACT_WIN_BLOCKMAP }}"; do
            if [ -f "$optional" ]; then
              assets+=("$optional")
            else
              echo "::warning::任意アセットが見つからないため Release へ添付しません: $optional"
            fi
          done
          gh release create "${{ needs.resolve-tag.outputs.tag }}" \
            --draft ${{ steps.channel.outputs.prerelease_flag }} \
            --title "AKARI Video ${{ needs.resolve-tag.outputs.tag }}" \
            --generate-notes \
            "${assets[@]}"

      # D1 裁定（契約 §5）= GO。認証は NPM_TOKEN secret ではなく npm Trusted Publishing
      # （OIDC）に移行済み（2026-07-29）: npm 側にこのリポ + このワークフローファイル名
      # （release.yml）が trusted publisher として登録されており、長寿命トークンは使わない。
      # 登録ファイル名とこのファイル名がズレると npm が publish を拒否する（改名時は
      # `npm trust` で再登録）。認証失敗時はステップが fail し列車が止まる（npm レールが
      # CLI 配布の正のため fail-loud を選ぶ。tarball 直インストールは応急経路として残る）。
      #
      # unscoped パッケージ（akari-video）なので --access public は本来 no-op だが、将来
      # スコープを付けた場合の安全策として明示しておく。provenance は Trusted Publishing
      # 経由なら自動生成が建前だが、明示フラグが必要だった実測報告があるため付けたままにする
      # （公開リポ + GitHub Actions + id-token: write の 3 条件は引き続き満たしている）。
      # cwd ではなく -w で対象を固定するのは、workspace 子ディレクトリからの npm 実行が
      # ルートパッケージ（akari-video-monorepo）に解決される事故の実測（npm trust で確認）
      # を踏まえた防御
      # Trusted Publishing の OIDC 交換はランナー同梱 npm が古いと紛らわしい E404 で
      # 落ちる（実測 run 30521667859: provenance 署名・透明性ログ掲載まで成功 →
      # レジストリへの PUT だけ 404。npm >= 11.5.1 + workspaces 周りの修正を含む
      # 最新版で解消する既知パターン）。同梱版に依存せず publish 直前に更新し、
      # 使用版をログへ残す
      - name: npm を最新へ更新（Trusted Publishing E404 対策）
        run: |
          npm install -g npm@latest
          npm --version

      # 診断: npm のレジストリが照合に使う OIDC クレームを表示する（トークン本体は
      # 出力しない — デコードした claim のみ）。npm 側の trusted publisher 登録
      # （repository / workflow filename / environment）と突き合わせるため
      - name: OIDC クレーム確認（診断）
        run: |
          payload=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org"             | jq -r .value | cut -d. -f2)
          # base64url → base64 パディング補正
          pad=$(( (4 - ${#payload} % 4) % 4 )); payload="$payload$(printf '=%.0s' $(seq 1 $pad 2>/dev/null))"
          echo "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{repository, workflow_ref, job_workflow_ref, event_name, ref, environment}'

      # -w（workspace 指定）ではなくパッケージディレクトリ内で実行する: OIDC の
      # 資格情報交換が workspace 経由だとルートパッケージ名で行われる疑いを排除する
      # （npm pack は同ディレクトリ実行で正しく launcher を対象にすることを build-cli で実証済み）
      - name: npm publish (packages/akari-launcher, Trusted Publishing)
        if: ${{ !inputs.dry_run }}
        working-directory: packages/akari-launcher
        run: npm publish --provenance --access public

  feed-only:
    name: feed-only (workflow_dispatch feed_only 単独実行)
    needs: resolve-tag
    if: ${{ inputs.feed_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'

      # DMG も取得して任意の mac_dmg を再生成する。旧 Release に DMG がなくても
      # 他の固定名パターンが一致するため download は成立する。
      - name: 対象タグの既存 Release から成果物を取得
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-artifacts
          gh release download "${{ needs.resolve-tag.outputs.tag }}" --dir release-artifacts --clobber \
            --pattern "${{ env.ARTIFACT_MAC }}" \
            --pattern "*.dmg" \
            --pattern "${{ env.ARTIFACT_WIN }}" \
            --pattern "${{ env.ARTIFACT_WIN_SETUP }}" \
            --pattern "${{ env.ARTIFACT_CLI }}" \
            --pattern "${{ env.ARTIFACT_APP }}"

      - name: channel を対象 Release の現在状態から決定する
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_prerelease=$(gh release view "${{ needs.resolve-tag.outputs.tag }}" --json isPrerelease -q .isPrerelease)
          if [ "$is_prerelease" = "true" ]; then
            echo "channel=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: latest.json 再生成
        run: |
          node scripts/release/gen-latest-json.mjs \
            --artifacts-dir release-artifacts \
            --tag "${{ needs.resolve-tag.outputs.tag }}" \
            --channel "${{ steps.channel.outputs.channel }}" \
            --released "$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" \
            --out release-artifacts/latest.json

      - name: updates フィードへ差し替え
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view updates >/dev/null 2>&1; then
            gh release create updates \
              --prerelease \
              --title "updates (machine feed)" \
              --notes "機械用フィードです。akari / シェルの更新確認が参照する latest.json 専用の固定タグ Release です。人間向けの changelog はここに書きません。"
          fi
          gh release upload updates release-artifacts/latest.json --clobber
