name: Windows Build

# Windows 実機の代替として GitHub の windows-latest ランナーでシェルをビルド・パッケージし、
# win-unpacked を artifact として配布する（オーナー指示 2026-07-23 — ci.yml の
# 「app は macOS-only」前提〔2026-07-16 裁定〕は Windows 対応 GO により上書き）。
# 手順は docs/dev/windows-build.md のビルド手順を CI に写したもの。
# 手動トリガーのみ（ビルドは重い: theia build + electron-builder で 20-40 分規模）。

on:
  workflow_dispatch:

jobs:
  windows-build:
    name: windows-build (build:ext + theia build + package)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # checkout より前に symlink / 長パスを有効化する（リポ直下に git 管理 symlink が 46 個。
      # GitHub の Windows ランナーは管理者権限で走るため core.symlinks true で実体化できる）
      - name: Enable git symlinks and long paths
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
          # Windows ランナーの git は autocrlf=true が既定で、checkout 時に LF→CRLF 変換される。
          # gen-skills-index の frontmatter パース等が CRLF で誤検出するため、リポの
          # コミット済みバイト列（LF）のまま checkout する（初回 run 29994519391 の実測失敗より）
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'

      # symlink が正しく実体化されたかの早期ゲート（壊れていれば以降のビルドは無意味）
      - name: Verify skills symlinks materialized
        run: node scripts/gen-skills-index.mjs --check

      # docs/dev/windows-build.md と同一手順。package-lock.json は意図的に gitignore のため
      # npm ci は使えない（ci.yml の L0 ジョブと同じ理由）。--ignore-scripts は付けない
      # （実パッケージにはネイティブモジュールの実体が必要）。
      #
      # npm_config_enable_(thin_)lto=false について（run 29994686512 / 29995591439 / 29996236710 実測）:
      # Windows 公式 node.exe は ClangCL + thin LTO ビルドで、node-gyp は実行中 node の
      # process.config を build/config.gypi に写すため、全アドオンに -flto=thin /
      # /opt:lldltojobs=2 が注入され MSVC link.exe が LNK1117 で死ぬ（mac の node は
      # thin=false のため mac では発生しない）。ヘッダキャッシュの config.gypi は元々
      # false でパッチ無効・GYP_DEFINES も node-gyp に無視されることを実測済み。
      # node-gyp は npm_config_* env を未知オプションとして gyp の -D 定義（config.gypi より
      # 優先）へ変換するので、この経路で LTO を無効化する。
      - name: Install dependencies
        working-directory: apps/shell
        env:
          npm_config_enable_lto: 'false'
          npm_config_enable_thin_lto: 'false'
        run: |
          npm install --no-workspaces
          # ランナーの npm（Node 26 同梱・>=12）は allow-scripts ゲートが既定有効で、
          # electron の postinstall（本体 DL）等 12 パッケージの install script を
          # ブロックする（run 29996855638 実測: electron/dist 不在で theia build が死んだ）。
          # 警告文の案内どおり approve-scripts で承認し、rebuild で script を実行し直す。
          npm approve-scripts electron esbuild puppeteer node-pty native-keymap keytar drivelist "@parcel/watcher" msgpackr-extract "@theia/ffmpeg" "@vscode/windows-ca-certs" electron-winstaller
          npm rebuild
          # electron 実体が入ったことの早期ゲート（無ければ theia build まで進んでも無意味）
          node -e "console.log('electron dist version:', require('fs').readFileSync('node_modules/electron/dist/version','utf8'))"

      - name: build:ext (tsc -b, 9 extensions)
        working-directory: apps/shell
        run: npm run build:ext

      - name: theia build (production)
        working-directory: apps/shell
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build

      # prepackage (copy-native-helpers) → electron-builder --dir（Windows ホストなので
      # win ターゲットが既定・@electron/rebuild が Electron ABI へ自動整合）→
      # postpackage (verify-asar-contents — win32 分岐で app.asar の同梱検証)
      - name: package (electron-builder --dir + verify-asar)
        working-directory: apps/shell
        env:
          # @electron/rebuild も node-gyp 経由のため同じ LTO 無効化を適用（Install の注記参照）
          npm_config_enable_lto: 'false'
          npm_config_enable_thin_lto: 'false'
        run: npm run package

      # upload-artifact は多数の小ファイルに弱いため 7z で単一 zip に固めてから上げる
      - name: Zip win-unpacked
        working-directory: apps/shell/electron-builder-out
        run: 7z a -tzip akari-video-win-x64.zip win-unpacked

      - uses: actions/upload-artifact@v4
        with:
          name: akari-video-win-x64
          path: apps/shell/electron-builder-out/akari-video-win-x64.zip
          retention-days: 14
          if-no-files-found: error
