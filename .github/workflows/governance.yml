name: Governance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: gate (tracked-file leak scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # git grep only, deliberately: no dependency install, no node setup. This job scans
      # *tracked* files only (git grep), never a filesystem walk (grep -r would also pick up
      # gitignored local scratch files and produce false positives — that mistake already
      # happened once against packages/preview-engine/bench/testsrc/generate.sh).
      - name: Scan tracked files for governance leaks
        run: |
          set -uo pipefail

          FAIL=0

          # Verified false positives only — one path:line per entry, with a reason.
          # Do NOT loosen a pattern to kill a false positive; add the specific hit here instead.
          ALLOWLIST=(
            "CLAUDE.md:6|names the internal repo as a repo, not a path (no trailing slash) — public-repo boilerplate, 司令塔裁定・継承"
            "assets/3d/smartphone-mockup/scene.py:4|docs/planning/... is THIS repo's own pre-flatten path (public repo moved docs/planning/ -> docs/ before this file existed), not the internal private repo — stale-link cleanup tracked separately (audit P1 #3 2026-07-16 cycle2), not a leak"
            "assets/3d/vintage-camera-turntable/scene.py:3|same as assets/3d/smartphone-mockup/scene.py:4 — pre-flatten public-repo path, not an internal-repo leak"
            "assets/INDEX.md:26|same as assets/3d/smartphone-mockup/scene.py:4 — pre-flatten public-repo path, not an internal-repo leak"
            "docs/contract-2026-07-13-m1-m4.md:57|references the legacy public repo akari-video-tauri's docs/planning/... path (repo named explicitly), not the internal private repo"
            "packages/overlay-runtime/src/interaction.js:2|comment referencing this repo's pre-flatten docs/planning/... path, not the internal private repo"
            "packages/overlay-runtime/src/overlay-runtime.js:2|comment referencing this repo's pre-flatten docs/planning/... path, not the internal private repo"
            "apps/shell/extensions/akari-preview/src/common/edit-asset-path.ts:47|doc-comment example of a Windows path (C:/Users/a/…) — synthetic, identifies no machine"
            "apps/shell/extensions/akari-preview/test/edit-asset-path.test.mjs:19|synthetic test path (/Users/a/) — identifies no machine"
            "apps/shell/extensions/akari-preview/test/edit-asset-path.test.mjs:25|synthetic Windows test path (C:/Users/a/) — identifies no machine"
            "apps/shell/extensions/akari-preview/test/edit-asset-path.test.mjs:36|synthetic test path (/Users/a/) — identifies no machine"
            "apps/shell/extensions/akari-preview/test/edit-asset-path.test.mjs:54|synthetic Windows test path (C:\\Users\\a\\) — identifies no machine"
            "apps/shell/extensions/akari-preview/test/edit-asset-path.test.mjs:55|synthetic Windows test path (C:/Users/a/) — identifies no machine"
            "apps/shell/extensions/akari-preview/test/edit-asset-path.test.mjs:61|synthetic Windows test path (file:///C:/Users/a/) — identifies no machine"
            "apps/shell/extensions/akari-project/test/catalog-root-search.test.mjs:9|synthetic test path (/Users/example/) — identifies no machine"
            "apps/shell/extensions/akari-project/test/catalog-root-search.test.mjs:10|synthetic test path (/Users/example/) — identifies no machine"
            "apps/shell/extensions/akari-project/test/catalog-root-search.test.mjs:17|synthetic test path (/Users/example/) — identifies no machine"
            "apps/shell/extensions/akari-project/test/catalog-root-search.test.mjs:24|synthetic test path (/Users/example/) — identifies no machine"
            "apps/shell/extensions/akari-shell-strip/test/quick-export-cli.test.mjs:46|synthetic test path (/Users/someone/) — identifies no machine"
            "apps/shell/extensions/akari-shell-strip/test/quick-export-cli.test.mjs:47|synthetic test path (/Users/someone/) — identifies no machine"
            "apps/shell/extensions/akari-shell-strip/test/quick-export-cli.test.mjs:48|synthetic test path (/Users/someone/) — identifies no machine"
            "packages/schemas/fixtures/recipe/invalid-source-project-path/recipe.json:5|fixture must be path-like by design (tests the path rejection); username is synthetic (/Users/example/)"
            "apps/shell/extensions/akari-partner/src/node/cli-provisioner.test.mjs:126|synthetic test path (/Users/x/) — identifies no machine"
            "apps/shell/extensions/akari-surfaces/src/node/tool-install.test.mjs:340|synthetic test path (/Users/fixture) — identifies no machine"
            "apps/shell/extensions/akari-surfaces/src/common/tool-install-ui.test.mjs:65|synthetic test path (/Users/fixture/) — identifies no machine"
            "apps/shell/extensions/akari-surfaces/src/common/tool-install-ui.test.mjs:71|synthetic test path (/Users/fixture/) — identifies no machine"
          )

          is_allowed() {
            local key="$1"
            for entry in "${ALLOWLIST[@]}"; do
              if [ "${entry%%|*}" = "$key" ]; then
                return 0
              fi
            done
            return 1
          }

          # $1 label, $2 extended-regex pattern, $3 remediation hint
          # -I skips binary files: font/media blobs can coincidentally contain any byte
          # sequence (the M PLUS Rounded TTFs match CJK patterns), and no remediation hint
          # applies to a binary — prose patterns are only meaningful in text files.
          check() {
            local label="$1" pattern="$2" hint="$3"
            local matches
            matches="$(git grep -InE "$pattern" -- . ':!.github/workflows/governance.yml' 2>/dev/null || true)"
            [ -z "$matches" ] && return 0

            local reported=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              local path="${line%%:*}"
              local rest="${line#*:}"
              local num="${rest%%:*}"
              if is_allowed "${path}:${num}"; then
                continue
              fi
              if [ "$reported" -eq 0 ]; then
                echo "::error::Governance gate — ${label}"
                reported=1
                FAIL=1
              fi
              echo "  ${line}"
            done <<< "$matches"
            if [ "$reported" -ne 0 ]; then
              echo "  -> ${hint}"
              echo "  -> See CLAUDE.md:6 for the accepted boilerplate wording (names the internal"
              echo "     repo without exposing a path). If this hit is a verified false positive,"
              echo "     add an explicit path:line entry to ALLOWLIST in this workflow file with a"
              echo "     reason — do not loosen the pattern to make it pass."
            fi
          }

          # Bare /tmp/ is deliberately NOT checked. What must not leak is anything that
          # identifies this machine or the harness: a username (/Users/<name>/), a home
          # layout, or a Claude scratchpad (/private/tmp/claude-<pid>/…/<uuid>/scratchpad —
          # covered by the two checks below). A generic temp dir like
          # /tmp/akari-s12-e2e-scratch tells a reader nothing: every machine has /tmp, and
          # the script that picks that name is itself committed. Adding /tmp/ here was
          # tried on 2026-07-16 and reverted — it flagged three legitimate defaults
          # (run-inspector-writeback-e2e.mjs, stub-host.js) and would have forced code to
          # obfuscate harmless paths. Widen this only for patterns that reveal the machine.
          check "local absolute path (/Users/*, /private/tmp/*, /home/*)" \
            '/Users/[A-Za-z0-9_.-]+/|/private/tmp/|/home/[A-Za-z0-9_.-]+/' \
            "Remove the local absolute path before committing. For diff/log evidence, rewrite it as a placeholder like <WORKTREE> or <SCRATCH> — keep the structure readable, drop the machine specifics."

          check "harness worktree naming (akari-video-wt)" \
            'akari-video-wt' \
            "This exposes the local harness's worktree layout. Replace with a repo-relative or generic path."

          check "Claude session / scratchpad leakage (claude-<pid>, scratchpad)" \
            'claude-[0-9]+|scratchpad' \
            "This exposes a Claude session id or scratchpad path from the local machine. Remove or redact it."

          # The internal repo's NAME is not a secret — CLAUDE.md:6 names it on purpose so
          # contributors know internal context exists, and this file's own provenance note
          # names it too. What must not leak is the repo's directory LAYOUT. So the first
          # alternative requires a trailing slash: `akari-video-internal/tasks/...` is a
          # path and fails; "非公開の内部記録（`akari-video-internal`）" is a name and passes.
          # (Owner decision 2026-07-16, after this gate blocked the sweep's own boilerplate:
          # the two lane contracts disagreed — one allowed naming the repo, the other didn't.)
          check "internal repo path (akari-video-internal/…, tasks/YYYY-MM-DD, planning/contract-/waveplan-)" \
            'akari-video-internal/|tasks/20[0-9]{2}-[0-9]{2}-[0-9]{2}|planning/contract-20[0-9]{2}-|planning/waveplan-20[0-9]{2}-' \
            "Rewrite the reference so it doesn't expose the internal repo's directory layout. Naming the repo without a path is fine — see CLAUDE.md:6."

          # Public prose must be self-contained for external readers. Citations of internal
          # adjudications — オーナー口述 (owner dictation), the F48 feedback ledger, 第 N 巡
          # (feedback round numbers), スキルマップ §N — resolve only inside the private repo,
          # so to an outside reader they are dangling references. State the norm itself
          # (optionally with a date + quoted rationale); keep the adjudication trail in the
          # internal repo's contracts. (Added 2026-07-26 after an external review flagged
          # unresolvable F48 citations in public skills.)
          check "internal adjudication citation (口述 / F48 / 第 N 巡 / スキルマップ)" \
            '口述|\bF48\b|第 ?[0-9]+ ?巡|スキルマップ' \
            "Rewrite as a self-contained norm. Move the 口述/F48/巡 provenance to the internal repo's contract and delete it here."

          # Skill adapter symlink integrity: .agents/skills/, .claude/skills/, and .cursor/skills/
          # must be symlinks pointing to ../../skills/<name>. A redirected symlink could cause the
          # agent to load a tampered SKILL.md.
          check_skill_symlinks() {
            local adapter_dir="$1"
            [ -d "$adapter_dir" ] || return 0
            for entry in "$adapter_dir"/*; do
              [ -e "$entry" ] || continue
              local name
              name="$(basename "$entry")"
              if [ ! -L "$entry" ]; then
                echo "::error::Governance gate — skill adapter is not a symlink: ${entry}"
                echo "  -> Each entry in ${adapter_dir}/ must be a symlink to ../../skills/${name}"
                FAIL=1
                continue
              fi
              local target
              target="$(readlink "$entry")"
              local expected="../../skills/${name}"
              if [ "$target" != "$expected" ]; then
                echo "::error::Governance gate — skill adapter symlink target mismatch: ${entry} -> ${target} (expected ${expected})"
                echo "  -> Redirected symlinks could load a tampered SKILL.md"
                FAIL=1
              fi
            done
          }

          check_skill_symlinks ".agents/skills"
          check_skill_symlinks ".claude/skills"
          check_skill_symlinks ".cursor/skills"
          check_skill_symlinks ".opencode/skills"

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "Governance gate failed — see the errors above for file, line, and which pattern matched."
            exit 1
          fi

          echo "Governance gate passed — no tracked-file leaks detected."
