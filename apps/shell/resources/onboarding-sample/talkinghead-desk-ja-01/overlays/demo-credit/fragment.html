  33.2〜35.6 は右の舞台を空けて素で言わせ、言い切った直後にエンドロール風のクレジットで落とす。
  edit.json では段 demo-stage、at 1068 / duration 60（35.600〜37.600 秒 = 動画の終わりまで）。
  時刻はすべてクリップ先頭 0 のローカル秒（30 fps。フレーム n のローカル秒 = (n - 1068) / 30）。
  声の 10ms 包絡の実測: 「ね」の声は 35.62 で −40 dB を割り、35.64 で −59 dB（言い切り）。
    1 行目   0.000 → 0.28   「出演 僕」が右から（translateX 30→0、--ease-smooth）。不透明度は 0.12 秒で立てる。
                             言い切った直後のフレーム 1069（35.633）で最初に見える。効果音「チーン」も 1069
    2 行目   0.117 → 0.40   「編集 AI」が同じ動きで 0.117 秒遅れて（フレーム 1072 から見える）
    キラッ   0.317 → 0.74   「AI」の右上の 4 芒星が回りながら開く（scale 0→1.18→1）
    区切り   0.567 → 0.89   クレジットと名札のあいだの橙の短い線が右から引かれる
    名札     0.667 → 1.07   「✦ AKARI Video」が下から（translateY 12→0）。✦ は冒頭の名札と同じく回りながら開く
    惹句     0.767 → 1.13   「AI と話すだけで動画編集」が下から（translateY 8→0）
    瞬き     1.300 → 1.75   キラッがもう一度光る（scale 1→1.3→1・90° 回って同じ形に戻る）
  抜けは無い（37.6 で動画が終わる）。base（アニメ無しの見た目）は全部が見えている最終の静止状態。

  配置: 壁に直に置く右寄せ（右端 1200px）。役職は右揃え・名前は左揃えで、同じ軸に並べる（エンドロールの組み）。
  人物の届く範囲（y<470 で x<690、y 470〜660 で x<815）と字幕帯（x 300〜980・y≥628）には入らない
  （白フチ・影まで含めた画素の外接 ≈ x 871〜1225・y 116〜474。y 460 より下は惹句だけで x 871 から）。

  文字の大きさ（2026-10-01 作り直し）: アプリのプレビュー枠は縮小表示（幅 640px 程度 = 半分）なので、
  そこで読めることを基準にした。一番小さい惹句が 28px（縮小で 14px）、役職が 32px（16px）。
  前の版（役職 24 / 僕 58 / AI 84 / 名札 30 / 惹句 20px）から、名前と AI は 1.24 倍、
  読みにくいと言われた役職・名札は 1.33 倍、いちばん小さかった惹句は 1.4 倍。白フチは 8 → 9px（小さい字 6 → 7px）。
  動き・時刻は前の版と同じ（大きさだけ変えた）。

  書体: AKARI Demo Sans = Noto Sans JP（SIL Open Font License 1.1、著作権 Adobe、Reserved Font Name
  'Source'）の wght 700 / 900 を、この断片で使う字だけに切り出した改変版（別名で埋め込み、フォント内に
  著作権表示と許諾を保持）。@font-face の family はこの断片専用の「AKARI Demo Sans Credit」にし、
  unicode-range で自分の字（＋空白）だけを受け持つ。書き出しとプレビューは全断片を 1 枚の文書に

/* ── クレジット（役職 | 名前 の 2 列、軸をそろえる）──────── */
.demo-credit__credits {
  position: absolute;
  right: var(--credit-right, 80px);
  top: var(--credit-top, 120px);
  display: grid;
  grid-template-columns: auto auto;
  column-gap: var(--credit-gap, 22px);
  row-gap: var(--credit-row-gap, 20px);
  align-items: baseline;
}

.demo-credit__label {
  justify-self: end;
  /* 字間 .3em の最後の 1 字ぶんを右へ逃がし、字の右端を軸にそろえる */
  margin-right: -.3em;
  font-size: var(--credit-label-size, 32px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: .3em;
  color: var(--demo-ink-sub, #6B5E52);
  white-space: nowrap;
}

.demo-credit__name {
  position: relative;
  justify-self: start;
  font-weight: 900;
  line-height: 1;
  white-space: nowrap;
}
.demo-credit__name--cast {
  font-size: var(--credit-name-size, 72px);
}
.demo-credit__name--editor {
  font-size: var(--credit-hero-size, 104px);
  letter-spacing: .01em;
  color: var(--demo-accent, #F97316);
}

/* 「AI」の右上のキラッ（効果音とエフェクトのキラッと同じ絵柄: 黄の地・橙の縁・白い芯） */
.demo-credit__spark {
  position: absolute;
  right: calc(var(--credit-spark-size, 34px) * -.74);
  top: calc(var(--credit-spark-size, 34px) * -.06);
  width: var(--credit-spark-size, 34px);
  height: var(--credit-spark-size, 34px);
}
.demo-credit__spark-pop,
.demo-credit__spark-glint {
  position: absolute;
  inset: 0;
}
.demo-credit__spark svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* ── 区切りの線 ───────────────────────── */
.demo-credit__rule {
  position: absolute;
  right: var(--credit-right, 80px);
  top: var(--credit-rule-top, 346px);
  width: var(--credit-rule-width, 64px);
  height: 5px;
  border-radius: 2.5px;
  background: var(--demo-accent, #F97316);
  box-shadow: 0 0 0 4px var(--credit-halo-color, #FFFFFF), 0 4px 12px var(--credit-shadow-color, rgba(58, 38, 20, .085));
  transform-origin: right center;
}

/* ── 終わりの名札 ─────────────────────── */
.demo-credit__plate {
  position: absolute;
  right: var(--credit-right, 80px);
  top: var(--credit-plate-top, 378px);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}

.demo-credit__brand {
  display: flex;
  align-items: center;
  gap: .3em;
  font-size: var(--credit-plate-size, 40px);
  font-weight: 900;
  line-height: 1;
  letter-spacing: .01em;
  white-space: nowrap;
}

.demo-credit__star {
  display: block;
  flex: none;
  width: .9em;
  height: .9em;
  overflow: visible;
}
.demo-credit__star-halo {
  fill: var(--credit-halo-color, #FFFFFF);
  stroke: var(--credit-halo-color, #FFFFFF);
  stroke-width: calc(var(--credit-halo, 9px) * 1.8);
  stroke-linejoin: round;
}
.demo-credit__star-body {
  fill: var(--demo-accent, #F97316);
}

.demo-credit__tagline {
  margin-top: var(--credit-tagline-gap, 14px);
  margin-right: -.06em;
  font-size: var(--credit-tagline-size, 28px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: .06em;
  color: var(--demo-ink-sub, #6B5E52);
  white-space: nowrap;
}
