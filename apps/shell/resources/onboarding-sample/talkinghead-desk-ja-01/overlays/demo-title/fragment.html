/*
  タイトル（demo-title）: 冒頭「こんにちは！ 今日はですね、アカリビデオっていう動画編集ツールを、試してみてます。」
  edit.json では段 demo-stage、at 7 / duration 217（0.2333〜7.4667 秒）。時刻はすべてクリップ先頭 0 のローカル秒
  （絶対秒 = ローカル + 0.2333）。語頭は clip.mp4 の声の 10ms 包絡で実測した立ち上がり。
    カード      -0.033 → 0.387  右から滑り込む（translateX 48→0・opacity、--ease-smooth）。
                                「こんにちは」の立ち上がり 0.29 秒を含むフレーム 8 で見え始める
    1 行目       0.10 → 0.45    「AI と話すだけで」が下から（translateY 17→0）
    2 行目       0.18 → 0.55    「動画編集」が下から（translateY 22→0）
    マイク       0.25 → 0.57    右の丸がポップ（scale .6→1、--ease-overshoot-soft）。効果音 whoosh の山 0.49 秒のフレーム 15 で出る
    声の波紋     0.40 / 2.084   話している間だけ、マイクから 2 重の輪が広がる（「こんにちは」の途中と「今日は」の語頭 2.35 秒）

    光           3.45 → 3.85    名札の上を白い斜めの光が左から右へ横切る（既定は名札 + 0.135 秒）
    下線         4.80 → 5.15    「動画編集ツール」の語頭（立ち上がり 5.08 秒 = フレーム 152）で
                                左から引かれる（scaleX 0→1、--ease-slowdown = ペンの勢い）
    抜け         6.95 → 7.20    「試してみてます。」の言い終わり（7.17 秒）の直後に右へ 40px 抜けて消える
                                （--ease-accelerate、forwards。区間の最後のフレーム 7.20 で消え切る）

  中心にして、膨らみが舞台の左端 720 より左（人物の側）へはみ出さないようにした。時刻は変えていない。

  書体: AKARI Demo Sans = Noto Sans JP（SIL Open Font License 1.1、著作権 Adobe、Reserved Font Name

    --title-left / --title-top / --title-width   カードの位置と幅（既定 730px / 60px / 502px）
    --title-padding / --title-radius             カードの内側余白と角丸（既定 24px 26px / 24px）
    --title-card-bg / --title-card-line / --title-shadow

    --title-mic-size / --title-mic-bg            マイクの丸の直径と地（既定 92px / #FFF3E8）
    --title-badge-gap                            カードの上端から名札の上端まで（既定 226px）
    --title-badge-size                           名札の文字サイズ（既定 34px。高さはこの 1.77 倍）
    --demo-ink / --demo-accent / --demo-accent-soft

    --title-font                                 書体（既定 AKARI Demo Sans → Hiragino Sans → Yu Gothic UI …）
    --title-card-delay / --title-mic-delay / --title-listen-1 / --title-listen-2 /

.demo-title,
.demo-title *,
.demo-title *::before,
.demo-title *::after { box-sizing: border-box; }

.demo-title {
  position: absolute;
  inset: 0;
  pointer-events: none;
  font-family: var(--title-font, "AKARI Demo Sans", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif);
  font-weight: 900;
  font-feature-settings: "palt" 1;
  color: var(--demo-ink, #17130F);
  -webkit-font-smoothing: antialiased;
}

.demo-title__group {
  position: absolute;
  inset: 0;
}

/* ── カード ─────────────────────────────── */
.demo-title__card {
  position: absolute;
  left: var(--title-left, 730px);
  top: var(--title-top, 60px);
  width: var(--title-width, 502px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: var(--title-padding, 24px 26px);
  border-radius: var(--title-radius, 24px);
  background: var(--title-card-bg, rgba(255, 255, 255, .97));
  border: 1px solid var(--title-card-line, rgba(23, 19, 15, .07));
  box-shadow: var(--title-shadow, 0 18px 44px rgba(58, 38, 20, .22));
}

.demo-title__text {
  flex: none;
}

/* マイクの丸（図解の「話す」と同じ題材）: 地 #FFF3E8・橙の輪 3px・マイクの絵柄は丸の 54% */
.demo-title__mic {
  position: relative;
  flex: none;
  width: var(--title-mic-size, 92px);
  height: var(--title-mic-size, 92px);
}

.demo-title__mic-disc {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--title-mic-bg, #FFF3E8);
  border: 3px solid var(--demo-accent, #F97316);
  color: var(--demo-accent, #F97316);
}

.demo-title__mic-icon {
  display: block;
  width: 54%;
  height: 54%;
}

/* 声の波紋: 話し始めの瞬間に 2 重の輪が広がって消える（最終状態も不可視の過渡）*/
.demo-title__ripple {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 3px solid var(--demo-accent-soft, #FDBA74);
  opacity: 0;
}

.demo-title__lead {
  display: block;
  font-size: var(--title-lead-size, 48px);
  line-height: 1.22;
  letter-spacing: .01em;
  white-space: nowrap;
}

.demo-title__main {
  position: relative;
  display: inline-block;
  margin-top: 2px;
  padding-bottom: 16px;
  font-size: var(--title-main-size, 80px);
  line-height: 1.1;
  letter-spacing: .02em;
  white-space: nowrap;
}

/* 下線: 文字幅（最後の字の字間 .02em を除く）いっぱい、高さ 10px */
.demo-title__underline {
  position: absolute;
  left: 0;
  right: .02em;
  bottom: 0;
  height: 10px;
  border-radius: 5px;
  background: var(--demo-accent, #F97316);
  transform-origin: left center;
}

/* ── 名札 ─────────────────────────────── */
.demo-title__badge {
  position: absolute;
  left: var(--title-left, 730px);
  top: calc(var(--title-top, 60px) + var(--title-badge-gap, 226px));
  transform-origin: 13% 50%;
}

.demo-title__badge-body {
  position: relative;
  display: flex;
  align-items: center;
  gap: .38em;
  height: calc(var(--title-badge-size, 34px) * 1.77);
  padding: 0 .85em 0 .72em;
  border-radius: 999px;
  overflow: hidden;
  background: var(--demo-accent, #F97316);
  color: #FFFFFF;
  font-size: var(--title-badge-size, 34px);
  line-height: 1;
  letter-spacing: .01em;
  white-space: nowrap;
  box-shadow: 0 10px 24px rgba(58, 38, 20, .24), 0 2px 0 rgba(255, 255, 255, .28) inset;
}

.demo-title__star {
  display: block;
  flex: none;
  width: .92em;
  height: .92em;
}

.demo-title__name {
  display: block;
  padding-top: .04em;
}

/* 光: 名札の中で左から右へ横切る白い斜めの帯（最終状態も不可視の過渡 FX） */
.demo-title__shine {
  position: absolute;
  inset: -2px;
  background: linear-gradient(115deg,
    rgba(255, 255, 255, 0) 34%,
    rgba(255, 255, 255, .55) 42%,
    rgba(255, 255, 255, .95) 46%,
    rgba(255, 255, 255, .55) 50%,
    rgba(255, 255, 255, 0) 56%,
    rgba(255, 255, 255, 0) 59%,
    rgba(255, 255, 255, .7) 61%,
    rgba(255, 255, 255, 0) 63.5%);
  opacity: 0;
}

/* ── 動き（活性区間だけ宣言する）────────────── */
[data-akari-active] .demo-title__group {
  animation: demo-title-exit .25s var(--ease-accelerate, cubic-bezier(1, 0, 0.98, 0.8)) var(--title-exit-delay, 6.95s) forwards;
}
[data-akari-active] .demo-title__card {
  animation: demo-title-card-in .42s var(--ease-smooth, cubic-bezier(0.38, 0, 0.1, 1.1)) var(--title-card-delay, -.033s) both;
}
[data-akari-active] .demo-title__lead {
  animation: demo-title-rise-lead .35s var(--ease-smooth, cubic-bezier(0.38, 0, 0.1, 1.1)) calc(var(--title-card-delay, -.033s) + .133s) both;
}
[data-akari-active] .demo-title__main {
  animation: demo-title-rise-main .37s var(--ease-smooth, cubic-bezier(0.38, 0, 0.1, 1.1)) calc(var(--title-card-delay, -.033s) + .213s) both;
}
[data-akari-active] .demo-title__underline {
  animation: demo-title-underline .35s var(--ease-slowdown, cubic-bezier(0.11, 0.86, 0.98, 0.9)) var(--title-underline-delay, 4.80s) both;
}
[data-akari-active] .demo-title__badge {
  animation: demo-title-badge-pop .32s var(--ease-overshoot-soft, cubic-bezier(0.17, 2.21, 0.17, 0.97)) var(--title-badge-delay, 3.315s) both;
}
[data-akari-active] .demo-title__star {
  animation: demo-title-star-open .5s var(--ease-overshoot-soft, cubic-bezier(0.17, 2.21, 0.17, 0.97)) calc(var(--title-badge-delay, 3.315s) + .03s) both;
}
[data-akari-active] .demo-title__shine {
  animation:
    demo-title-shine-move .4s var(--ease-linear, linear) var(--title-shine-delay, calc(var(--title-badge-delay, 3.315s) + .135s)) both,
    demo-title-shine-fade .4s var(--ease-linear, linear) var(--title-shine-delay, calc(var(--title-badge-delay, 3.315s) + .135s)) both;
}
[data-akari-active] .demo-title__mic-disc {
  animation: demo-title-mic-pop .32s var(--ease-overshoot-soft, cubic-bezier(0.17, 2.21, 0.17, 0.97)) var(--title-mic-delay, .25s) both;
}
[data-akari-active] .demo-title__ripple--1 {
  animation: demo-title-ripple .7s var(--ease-slowdown, cubic-bezier(0.11, 0.86, 0.98, 0.9)) var(--title-listen-1, .40s) forwards;
}
[data-akari-active] .demo-title__ripple--2 {
  animation: demo-title-ripple .7s var(--ease-slowdown, cubic-bezier(0.11, 0.86, 0.98, 0.9)) calc(var(--title-listen-1, .40s) + .16s) forwards;
}
[data-akari-active] .demo-title__ripple--3 {
  animation: demo-title-ripple .7s var(--ease-slowdown, cubic-bezier(0.11, 0.86, 0.98, 0.9)) var(--title-listen-2, 2.084s) forwards;
