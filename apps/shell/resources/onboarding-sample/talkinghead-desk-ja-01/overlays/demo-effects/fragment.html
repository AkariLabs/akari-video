.demo-effects{position:absolute;inset:0;isolation:isolate}
.demo-effects,.demo-effects *,.demo-effects *::before,.demo-effects *::after{box-sizing:border-box}
.demo-effects .fx-stage{position:absolute;inset:0;transform-origin:var(--fx-pa-left,1005px) var(--fx-pa-top,330px)}

/* ── 札 2 枚（白いピル） ───────────────────────────── */
.demo-effects .fx-chip{position:absolute;top:var(--fx-chip-top,92px);height:48px;z-index:4}
.demo-effects .fx-chip--sound{left:var(--fx-chip1-left,780px);width:var(--fx-chip1-width,170px)}
.demo-effects .fx-chip--effect{left:var(--fx-chip2-left,966px);width:var(--fx-chip2-width,214px)}
.demo-effects .fx-chip-bump,.demo-effects .fx-chip-pop{position:absolute;inset:0}
.demo-effects .fx-chip-pop{display:flex;align-items:center;justify-content:center;gap:9px;border-radius:24px;
  background:var(--demo-card,rgba(255,255,255,.97));border:1px solid var(--demo-card-line,rgba(23,19,15,.07));
  box-shadow:var(--demo-shadow,0 18px 44px rgba(58,38,20,.22));transform-origin:22% 60%;
  font:800 22px/1 "AKARI Demo Sans","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
  color:var(--demo-ink,#17130F);letter-spacing:.02em;white-space:nowrap}
.demo-effects .fx-icon{position:relative;flex:none;display:block}
.demo-effects .fx-icon svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.demo-effects .fx-icon--note{width:34px;height:26px}
.demo-effects .fx-icon--spark{width:24px;height:24px}
.demo-effects .fx-echo{transform-origin:9px 13px;opacity:0}
.demo-effects .fx-icon--spark .fx-echo{transform-origin:50% 50%}

/* ── 擬音「パッ!」（バラエティの文法: 白フチ → 墨の縁と厚み → 黄→橙のグラデ） ── */
.demo-effects .fx-pa{position:absolute;left:var(--fx-pa-left,1005px);top:var(--fx-pa-top,330px);width:0;height:0;z-index:2}
.demo-effects .fx-pa-tilt{position:absolute;left:0;top:0;transform:translate(-50%,-50%) rotate(var(--fx-pa-rotate,-6deg))}
.demo-effects .fx-pa-hit,.demo-effects .fx-pa-pop{transform-origin:58% 55%}
.demo-effects .fx-pa-stack{display:grid;width:max-content;white-space:nowrap;
  font:400 var(--fx-pa-size,168px)/1 "AKARI Demo Display","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
  letter-spacing:-.03em;padding:.06em .12em .1em}
.demo-effects .fx-pa-stack>span{grid-area:1/1;paint-order:stroke fill}
.demo-effects .fx-pa-halo{color:#FFFFFF;-webkit-text-stroke:.2em #FFFFFF;
  text-shadow:0 .054em 0 #FFFFFF,0 .095em .167em rgba(58,38,20,.38)}
.demo-effects .fx-pa-depth{color:var(--demo-ink,#17130F);-webkit-text-stroke:.107em var(--demo-ink,#17130F);
  text-shadow:0 .048em 0 var(--demo-ink,#17130F)}
.demo-effects .fx-pa-face{color:transparent;
  background:linear-gradient(180deg,#FFE879 0%,var(--demo-spark,#FFD94A) 34%,var(--demo-accent-hot,#FB923C) 70%,var(--demo-accent,#F97316) 100%);
  -webkit-background-clip:text;background-clip:text}

/* ── 放射線 14 本と衝撃の輪（擬音の中心から。右 0° 時計回り 120〜150° は人物側なので置かない） ── */
.demo-effects .fx-burst{position:absolute;left:var(--fx-pa-left,1005px);top:var(--fx-pa-top,330px);width:0;height:0;z-index:1}
.demo-effects .fx-ray{position:absolute;left:0;top:0;width:0;height:0;transform:rotate(var(--a))}
.demo-effects .fx-ray-bar{position:absolute;left:0;top:-3.5px;width:var(--l);height:7px;border-radius:3.5px;
  background:var(--c);box-shadow:0 0 0 2.5px var(--demo-ink,#17130F);transform-origin:0 50%;opacity:0}
.demo-effects .fx-ring{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;
  border:6px solid var(--demo-spark,#FFD94A);box-shadow:0 0 0 2px var(--demo-ink,#17130F),inset 0 0 0 2px var(--demo-ink,#17130F);opacity:0}

/* ── キラッ 7 個（4 芒星・黄に白い芯） ── */
.demo-effects .fx-spark{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);z-index:3}
.demo-effects .fx-spark-body{position:absolute;inset:0;opacity:0}
.demo-effects .fx-spark-body::before{content:"";position:absolute;inset:-45%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,246,210,.95) 0,rgba(255,217,74,.45) 32%,rgba(255,217,74,0) 68%)}
.demo-effects .fx-spark-body svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

/* ── 動き（[data-akari-active] ゲート内。delay はローカル秒の変数） ── */
[data-akari-active] .demo-effects .fx-chip--sound .fx-chip-pop{animation:demo-effects-chip-pop .28s var(--ease-overshoot-soft, cubic-bezier(0.17, 2.21, 0.17, 0.97)) var(--fx-chip1-at,0s) both}
[data-akari-active] .demo-effects .fx-chip--effect .fx-chip-pop{animation:demo-effects-chip-pop .28s var(--ease-overshoot-soft, cubic-bezier(0.17, 2.21, 0.17, 0.97)) var(--fx-chip2-at,1.2333s) both}
[data-akari-active] .demo-effects .fx-chip--sound .fx-echo{animation:demo-effects-echo-wave .45s var(--ease-smooth, cubic-bezier(0.38, 0, 0.1, 1.1)) calc(var(--fx-chip1-at,0s) + .1s) both}
[data-akari-active] .demo-effects .fx-chip--effect .fx-echo{animation:demo-effects-echo-spark .45s var(--ease-smooth, cubic-bezier(0.38, 0, 0.1, 1.1)) calc(var(--fx-chip2-at,1.2333s) + .1s) both}
[data-akari-active] .demo-effects .fx-chip-bump{animation:demo-effects-chip-bump .2s var(--ease-smooth, cubic-bezier(0.38, 0, 0.1, 1.1)) var(--fx-pa-at,2.2s) both}
[data-akari-active] .demo-effects .fx-pa-pop{animation:demo-effects-pa-pop .28s var(--ease-hard-out, cubic-bezier(0, 0.61, 0, 1)) var(--fx-pa-at,2.2s) both}
[data-akari-active] .demo-effects .fx-pa-hit{animation:demo-effects-pa-hit .25s var(--ease-smooth, cubic-bezier(0.38, 0, 0.1, 1.1)) var(--fx-sparkle-at,3.05s) both}
[data-akari-active] .demo-effects .fx-ray-bar{animation:demo-effects-ray .45s var(--ease-slowdown, cubic-bezier(0.11, 0.86, 0.98, 0.9)) var(--fx-pa-at,2.2s) both}
[data-akari-active] .demo-effects .fx-ring{animation:demo-effects-ring .4s var(--ease-slowdown, cubic-bezier(0.11, 0.86, 0.98, 0.9)) var(--fx-pa-at,2.2s) both}
[data-akari-active] .demo-effects .fx-spark-body{animation:demo-effects-spark .6s var(--ease-hard-out, cubic-bezier(0, 0.61, 0, 1)) calc(var(--fx-sparkle-at,3.05s) + var(--i) * 45ms) both}
[data-akari-active] .demo-effects .fx-stage{animation:demo-effects-exit .25s var(--ease-accelerate, cubic-bezier(1, 0, 0.98, 0.8)) var(--fx-exit-at,4.2333s) forwards}

@keyframes demo-effects-chip-pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes demo-effects-echo-wave{0%{opacity:0;transform:scale(1)}20%{opacity:.95;transform:scale(1.12)}100%{opacity:0;transform:scale(1.45)}}
@keyframes demo-effects-echo-spark{0%{opacity:0;transform:scale(1) rotate(0deg)}20%{opacity:.95;transform:scale(1.2) rotate(10deg)}100%{opacity:0;transform:scale(1.8) rotate(45deg)}}
@keyframes demo-effects-chip-bump{0%{transform:translateY(0)}40%{transform:translateY(-6px)}100%{transform:translateY(0)}}
@keyframes demo-effects-pa-pop{0%{opacity:0;transform:scale(.3)}40%{opacity:1;transform:scale(1.14)}70%{opacity:1;transform:scale(.96)}100%{opacity:1;transform:scale(1)}}
@keyframes demo-effects-pa-hit{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes demo-effects-ray{0%{opacity:0;transform:translateX(70px) scaleX(.2)}40%{opacity:1;transform:translateX(120px) scaleX(1)}100%{opacity:0;transform:translateX(190px) scaleX(.4)}}
@keyframes demo-effects-ring{0%{opacity:0;transform:scale(.3)}12%{opacity:1;transform:scale(.75)}100%{opacity:0;transform:scale(3)}}
@keyframes demo-effects-spark{0%{opacity:0;transform:scale(0) rotate(0deg)}45%{opacity:1;transform:scale(1.15) rotate(30deg)}100%{opacity:0;transform:scale(0) rotate(60deg)}}
@keyframes demo-effects-exit{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.92)}}
