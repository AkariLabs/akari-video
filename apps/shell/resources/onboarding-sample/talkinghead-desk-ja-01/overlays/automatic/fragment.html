<div class="akari-figure automatic" data-akari-hit="pass">
<style>
.akari-figure{position:absolute;inset:0;pointer-events:none;font-family:var(--figure-font,"Yu Gothic",sans-serif);color:var(--figure-text,#fff)}
.akari-figure *{box-sizing:border-box}
.akari-figure .card{position:absolute;left:var(--figure-left,56%);top:var(--figure-top,25%);width:var(--figure-width,41%);max-height:var(--figure-max-height,38%);overflow:hidden;padding:var(--figure-padding,18px 20px);border-radius:var(--figure-radius,16px);background:var(--figure-bg,rgba(23,19,15,.95));border:1px solid var(--figure-border,#786656);box-shadow:0 12px 28px var(--figure-shadow,#0008)}
.akari-figure .heading{margin:0;font-size:var(--figure-heading-size,27px);font-weight:800;line-height:1.25;letter-spacing:.02em}
.akari-figure .accent{color:var(--figure-accent,#d5b48b)}
.akari-figure svg{display:block;max-width:100%}
.akari-figure .label{font-size:var(--figure-label-size,17px);font-weight:700;line-height:1.3}
.automatic .layout{display:grid;grid-template-columns:var(--figure-left-column,34%) 1fr;gap:var(--figure-gap,18px);align-items:center;margin-top:var(--figure-gap-top,12px)}
.automatic .voice{display:grid;justify-items:center;gap:var(--figure-label-gap,5px);color:var(--figure-accent,#d5b48b)}
.automatic .voice svg{width:var(--figure-voice-size,78px);height:var(--figure-voice-size,78px)}
.automatic .checks{display:grid;gap:var(--figure-row-gap,6px)}
.automatic .row{display:flex;align-items:center;gap:var(--figure-row-gap,12px);padding:var(--figure-row-padding,5px 9px);border-radius:var(--figure-row-radius,8px);background:var(--figure-row-bg,#302821);font-size:var(--figure-row-size,18px);font-weight:700}
.automatic .row svg{width:var(--figure-check-size,24px);height:var(--figure-check-size,24px);flex:none;color:var(--figure-accent,#d5b48b)}
[data-akari-active] .automatic .card{animation:automatic-life 3.96s linear both}
[data-akari-active] .automatic .cue{animation:automatic-cue .45s var(--ease-smooth,ease-out) both}
[data-akari-active] .automatic .voice{animation-delay:var(--automatic-voice-delay,0s)}
[data-akari-active] .automatic .cut{animation-delay:var(--automatic-cut-delay,.69s)}
[data-akari-active] .automatic .caption{animation-delay:var(--automatic-caption-delay,1.10s)}
[data-akari-active] .automatic .title{animation-delay:var(--automatic-title-delay,1.64s)}
@keyframes automatic-life{0%{opacity:0;transform:translateY(10px)}8%{opacity:1;transform:translateY(0)}90%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes automatic-cue{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
</style>
<section class="card">
<h2 class="heading">話すだけで完成</h2>
<div class="layout">
<div class="voice cue"><svg viewBox="0 0 80 80" aria-hidden="true"><rect x="30" y="8" width="20" height="42" rx="10" fill="none" stroke="currentColor" stroke-width="3"/><path d="M20 37c0 28 40 28 40 0M40 58v12M27 70h26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span class="label">話す</span></div>
<div class="checks">
<div class="row cue cut"><svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 14 4 4 8-9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>カット</div>
<div class="row cue caption"><svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 14 4 4 8-9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>字幕</div>
<div class="row cue title"><svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="11" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 14 4 4 8-9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>タイトル</div>
</div>
</div>
</section>
</div>
