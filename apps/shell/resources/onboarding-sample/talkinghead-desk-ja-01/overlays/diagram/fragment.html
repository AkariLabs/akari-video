<div class="akari-figure diagram" data-akari-hit="pass">
<style>
.akari-figure{position:absolute;inset:0;pointer-events:none;font-family:var(--figure-font,"Yu Gothic",sans-serif);color:var(--figure-text,#fff)}
.akari-figure *{box-sizing:border-box}
.akari-figure .card{position:absolute;left:var(--figure-left,56%);top:var(--figure-top,25%);width:var(--figure-width,41%);max-height:var(--figure-max-height,38%);overflow:hidden;padding:var(--figure-padding,18px 20px);border-radius:var(--figure-radius,16px);background:var(--figure-bg,rgba(23,19,15,.95));border:1px solid var(--figure-border,#786656);box-shadow:0 12px 28px var(--figure-shadow,#0008)}
.akari-figure .heading{margin:0;font-size:var(--figure-heading-size,27px);font-weight:800;line-height:1.25;letter-spacing:.02em}
.akari-figure .accent{color:var(--figure-accent,#d5b48b)}
.akari-figure svg{display:block;max-width:100%}
.akari-figure .label{font-size:var(--figure-label-size,17px);font-weight:700;line-height:1.3}
.diagram .chart{margin-top:var(--figure-chart-top,10px);padding:var(--figure-chart-padding,5px 12px 0);border-radius:var(--figure-chart-radius,10px);background:var(--figure-chart-bg,#302821)}
.diagram .chart svg{width:100%;height:var(--figure-chart-height,122px);overflow:visible}
.diagram .axis{color:var(--figure-axis,#a99a8b)}
.diagram .bar{color:var(--figure-accent,#d5b48b)}
.diagram .line{color:var(--figure-line,#92b8ab)}
.diagram .note{font-size:var(--figure-note-size,16px);text-align:center;margin-top:var(--figure-note-top,4px)}
[data-akari-active] .diagram .card{animation:diagram-life 4.23s linear both}
[data-akari-active] .diagram .axis{animation:diagram-cue .4s var(--ease-smooth,ease-out) var(--diagram-axis-delay,.23s) both}
[data-akari-active] .diagram .bar-one{animation:diagram-bar .42s var(--ease-smooth,ease-out) var(--diagram-bar-one-delay,.64s) both}
[data-akari-active] .diagram .bar-two{animation:diagram-bar .42s var(--ease-smooth,ease-out) var(--diagram-bar-two-delay,.81s) both}
[data-akari-active] .diagram .bar-three{animation:diagram-bar .42s var(--ease-smooth,ease-out) var(--diagram-bar-three-delay,1.10s) both}
[data-akari-active] .diagram .line{animation:diagram-cue .45s var(--ease-smooth,ease-out) var(--diagram-line-delay,1.57s) both}
@keyframes diagram-life{0%{opacity:0;transform:translateY(10px)}8%{opacity:1;transform:translateY(0)}90%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes diagram-cue{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes diagram-bar{from{opacity:0;transform:translateY(35px) scaleY(.25)}to{opacity:1;transform:translateY(0) scaleY(1)}}
</style>
<section class="card">
<h2 class="heading">図が組み上がる</h2>
<div class="chart"><svg viewBox="0 0 420 122" aria-hidden="true">
<path class="axis" d="M28 8v96h370" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
<rect class="bar bar-one" x="74" y="66" width="54" height="38" rx="5" fill="currentColor"/>
<rect class="bar bar-two" x="177" y="43" width="54" height="61" rx="5" fill="currentColor"/>
<rect class="bar bar-three" x="280" y="19" width="54" height="85" rx="5" fill="currentColor"/>
<path class="line" d="m101 63 103-23 103-25m-11 0h11v11" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg></div><div class="note">話の要点が、ひと目でわかる</div>
</section>
</div>
