.demo-diagram,
.demo-diagram *,
.demo-diagram *::before,
.demo-diagram *::after { box-sizing: border-box; }

.demo-diagram {
  position: absolute;
  inset: 0;
  pointer-events: none;
  font-family: var(--diagram-font, "AKARI Demo Sans", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif);
  font-weight: 800;
  font-feature-settings: "palt" 1;
  color: var(--demo-ink, #17130F);
  -webkit-font-smoothing: antialiased;
}

.demo-diagram svg { display: block; flex: none; overflow: visible; }

.demo-diagram__group,
.demo-diagram__enter {
  position: absolute;
  inset: 0;
}

/* ── カード ─────────────────────────────── */
.demo-diagram__card {
  position: absolute;
  left: var(--diagram-left, 740px);
  top: var(--diagram-top, 150px);
  width: var(--diagram-width, 490px);
  height: var(--diagram-height, 290px);
  border-radius: var(--diagram-radius, 22px);
  background: var(--diagram-card-bg, rgba(255, 255, 255, .97));
  border: 1px solid var(--diagram-card-line, rgba(23, 19, 15, .07));
  box-shadow: var(--diagram-shadow, 0 18px 44px rgba(58, 38, 20, .22));
}

/* 完成の輪郭（橙 3px）。カードの縁に重ねる */
.demo-diagram__outline {
  position: absolute;
  inset: -1px;
  border-radius: var(--diagram-radius, 22px);
  border: 3px solid var(--demo-accent, #F97316);
  box-shadow: 0 0 0 5px color-mix(in srgb, var(--demo-accent, #F97316) 13%, transparent);
}

.demo-diagram__head {
  position: absolute;
  left: var(--diagram-pad, 28px);
  right: var(--diagram-pad, 28px);
  top: 22px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 16px;
  border-bottom: 1px solid rgba(23, 19, 15, .08);
  font-size: var(--diagram-title-size, 24px);
  font-weight: 900;
  line-height: 32px;
  letter-spacing: .02em;
  white-space: nowrap;
}

.demo-diagram__head-dot {
  display: block;
  flex: none;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--demo-accent, #F97316);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--demo-accent, #F97316) 16%, transparent);
}

/* ── 矢印（①→②・②→③）──────────────────────── */
/* 中心 c1 = カード中央 − step、c2 = カード中央、c3 = カード中央 + step */
.demo-diagram__link {
  position: absolute;
  top: calc(var(--diagram-row-y, 150px) - 8px);
  left: calc(50% + var(--link-from) * var(--diagram-step, 159px)
    + var(--diagram-node-size, 96px) / 2 + var(--diagram-link-gap, 5.5px));
  width: calc(var(--diagram-step, 159px) - var(--diagram-node-size, 96px) - 2 * var(--diagram-link-gap, 5.5px));
  height: 16px;
  color: var(--diagram-link-color, var(--demo-accent-soft, #FDBA74));
}

.demo-diagram__bar {
  position: absolute;
  left: 0;
  right: 9px;
  top: 5px;
  height: 6px;
  border-radius: 3px;
  background: currentColor;
  transform-origin: left center;
}

/* 矢じり: バーと同じ幅の入れ物の右端に乗せ、入れ物ごと translateX(-100%)→0 で運ぶと
   バーの先端（scaleX）とぴったり同じ位置を進む（同じ尺・同じイージング）*/
.demo-diagram__tip {
  position: absolute;
  left: 0;
  right: 9px;
  top: 0;
  height: 16px;
}

.demo-diagram__tip svg {
  position: absolute;
  right: -9px;
  top: 0;
  width: 13px;
  height: 16px;
}

/* 余韻の光: バーの範囲で切り抜いた溝の中を、丸い頭（8px）と尾をもつ橙の光が左から右へ流れる。
   光の入れ物は溝と同じ幅で、頭を右端に描き、入れ物ごと translateX(-100%)→0 で運ぶ */
.demo-diagram__track {
  position: absolute;
  left: 0;
  right: 9px;
  top: 4px;
  height: 8px;
  overflow: hidden;
  border-radius: 4px;
}

.demo-diagram__flow {
  position: absolute;
  inset: 0;
  border-radius: 0 4px 4px 0;
  background: linear-gradient(90deg,
    color-mix(in srgb, var(--demo-accent, #F97316) 0%, transparent) calc(100% - 30px),
    color-mix(in srgb, var(--demo-accent, #F97316) 55%, transparent) calc(100% - 12px),
    var(--demo-accent, #F97316) calc(100% - 6px));
  opacity: 0;
}

/* ── ノード ─────────────────────────────── */
.demo-diagram__node {
  position: absolute;
  top: calc(var(--diagram-row-y, 150px) - var(--diagram-node-size, 96px) / 2);
  left: calc(50% + var(--node-i) * var(--diagram-step, 159px) - 80px);
  width: 160px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.demo-diagram__pop {
  position: relative;
  width: var(--diagram-node-size, 96px);
  height: var(--diagram-node-size, 96px);
}

.demo-diagram__beat {
  position: absolute;
  inset: 0;
}

.demo-diagram__disc {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  border-radius: 50%;
}

.demo-diagram__icon {
  position: relative;
  width: calc(var(--diagram-node-size, 96px) * .46);
  height: calc(var(--diagram-node-size, 96px) * .46);
}

.demo-diagram__icon > svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.demo-diagram__node--talk .demo-diagram__disc {
  background: var(--diagram-talk-bg, #FFF3E8);
  border: 3px solid var(--demo-accent, #F97316);
  color: var(--demo-accent, #F97316);
  box-shadow: 0 8px 18px rgba(58, 38, 20, .12);
}

.demo-diagram__node--ai .demo-diagram__disc {
  background: var(--demo-accent, #F97316);
  color: #FFFFFF;
  box-shadow: 0 10px 22px color-mix(in srgb, var(--demo-accent, #F97316) 32%, transparent), 0 2px 0 rgba(255, 255, 255, .22) inset;
}

.demo-diagram__node--done .demo-diagram__disc {
  background: var(--demo-ink, #17130F);
  color: #FFFFFF;
  box-shadow: 0 10px 22px rgba(58, 38, 20, .26);
}

/* ③ の地を墨→橙へ: 上に重ねた橙の円が中心から広がって塗りつぶす（opacity だけの重ね合わせだと
   途中が茶色く濁るため、opacity は 2 フレームで立ち上げ、あとは広がりで見せる）。
   縁の墨がにじまないよう 1px 大きくしてある */
.demo-diagram__lit {
  position: absolute;
  inset: -1px;
  border-radius: 50%;
  background: var(--demo-accent, #F97316);
  box-shadow: 0 10px 22px color-mix(in srgb, var(--demo-accent, #F97316) 36%, transparent), 0 2px 0 rgba(255, 255, 255, .22) inset;
}

/* ✦（AI）: 大きい星と小さい星。大きい星だけが回って開く */
.demo-diagram__star-big {
  transform-origin: 43.2% 50%;
}

.demo-diagram__star-small {
  transform-origin: 84% 16%;
}

/* 完成のバッジ（白地に橙のチェック）: 円の右上 45° の縁に乗せる */
