.demo-phone,.demo-phone *,.demo-phone *::before,.demo-phone *::after{box-sizing:border-box}
.demo-phone{position:absolute;inset:0;font-family:"AKARI Demo Sans","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;font-weight:800;line-height:1}
.demo-phone svg{display:block;flex:none;overflow:visible}
/* 置き場所と大きさ。工房の phone-2d（CC0-1.0）と同じく角丸・枠の太さは幅（縦持ちの短辺）の % で持つ。
   下の段（phone-screen）の映像は角が直角なので、その四隅が本体の角丸の内側に収まる大きさにしてある
   （映像の箱 = 本体の内側 --phone-screen-inset。黒いベゼルが映像の縁を --phone-bezel-overlap だけ覆う） */
.demo-phone__place{position:absolute;left:var(--phone-left,891px);top:var(--phone-top,89px);width:var(--phone-width,242px);height:var(--phone-height,494px);
  --_r:calc(var(--phone-corner-radius,10.8) * var(--phone-width,242px) / 100);
  --_t:calc(var(--phone-frame-thickness,2.6) * var(--phone-width,242px) / 100);
  --_s:var(--phone-screen-inset,9.15px);
  --_v:calc(var(--phone-screen-inset,9.15px) + var(--phone-bezel-overlap,1.2px))}
.demo-phone__out,.demo-phone__in,.demo-phone__fade{position:absolute;inset:0}
/* 接地影（楕円・墨 20%）と本体の影（暖色）。本体の影は外側にしか描かれないので画面の穴には落ちない */
.demo-phone__ground{position:absolute;left:10%;top:calc(100% + 6px);width:80%;height:18px;border-radius:50%;background:radial-gradient(closest-side,rgba(23,19,15,var(--phone-ground-opacity,.2)),rgba(23,19,15,0))}
.demo-phone__shadow{position:absolute;inset:0;border-radius:var(--_r);box-shadow:0 0 0 1px rgba(23,19,15,.16),0 3px 8px rgba(58,38,20,.18),0 14px 30px rgba(58,38,20,.24)}
/* 画面。透明のまま下の段（phone-screen）を透かし、起動画面・UI・波紋・反射だけをこの中で描く。
   縁は映像の箱と同じ位置（ベゼルの下）に置き、見える窓はベゼルの内側になる */
.demo-phone__screen{position:absolute;inset:var(--_s);border-radius:calc(var(--_r) - var(--_s));overflow:hidden}
.demo-phone__layer{position:absolute;inset:0}
.demo-phone__launch{display:grid;place-items:center;align-content:center;gap:12px;background:radial-gradient(120% 70% at 50% 44%,#1C212B 0%,rgba(16,19,25,0) 62%),var(--phone-launch-color,#101319)}
.demo-phone__glow{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-79px 0 0 -66px;border-radius:50%;background:radial-gradient(closest-side,rgba(249,115,22,.34),rgba(249,115,22,0))}
.demo-phone__mark{position:relative;width:40px;height:40px;color:var(--demo-accent,#F97316)}
.demo-phone__mark svg{width:40px;height:40px}
.demo-phone__name{position:relative;font-size:var(--phone-name-size,14px);letter-spacing:.06em;color:rgba(255,255,255,.7);white-space:nowrap}
.demo-phone__shade{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(to top,rgba(0,0,0,var(--phone-ui-shade,.45)),rgba(0,0,0,0))}
.demo-phone__handle{position:absolute;left:14px;bottom:26px;font-size:var(--phone-handle-size,11px);letter-spacing:.02em;color:#FFFFFF;text-shadow:0 1px 2px rgba(0,0,0,.35);white-space:nowrap}
.demo-phone__actions{position:absolute;right:10px;bottom:44px;display:flex;flex-direction:column;align-items:center;gap:14px;color:rgba(255,255,255,.85)}
.demo-phone__icon{position:relative;width:18px;height:18px}
.demo-phone__icon svg{position:absolute;inset:0;width:18px;height:18px}
.demo-phone__like{color:var(--demo-accent,#F97316)}
.demo-phone__bar{position:absolute;left:10%;width:80%;bottom:12px;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.demo-phone__fill{position:absolute;inset:0;border-radius:2px;background:var(--demo-accent,#F97316);transform-origin:0 50%}
.demo-phone__ripple{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:3px solid rgba(255,255,255,.9);background:rgba(255,255,255,.22);opacity:0}
.demo-phone__sheen{position:absolute;inset:-20%;background:linear-gradient(104deg,rgba(255,255,255,0) 36%,rgba(255,255,255,.26) 45%,rgba(255,255,255,.08) 51%,rgba(255,255,255,0) 58%);opacity:0}
.demo-phone__glare{position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.1) 0%,rgba(255,255,255,0) 34%)}
.demo-phone__island{position:absolute;left:50%;top:calc(var(--phone-bezel-overlap,1.2px) + var(--phone-width,242px) * .036);width:calc(var(--phone-width,242px) * .21);height:calc(var(--phone-width,242px) * .063);margin-left:calc(var(--phone-width,242px) * -.105);border-radius:999px;background:#05070A;box-shadow:inset 0 1px 1px rgba(255,255,255,.08)}
/* 画面のふち（黒いベゼル）。枠の下へ 1px 潜り、映像の縁を覆うところまで塗る。外形と同心の角丸 */
.demo-phone__bezel{position:absolute;inset:calc(var(--_t) - 1px);border-radius:calc(var(--_r) - var(--_t) + 1px);border:calc(var(--_v) - var(--_t) + 1px) solid var(--phone-bezel-color,#07080A)}
/* チタン調の枠。外形の角丸から画面の穴（同心の角丸）を抜いた輪だけを塗る */
.demo-phone__frame{position:absolute;inset:0;padding:var(--_t);border-radius:var(--_r);
  background:linear-gradient(128deg,rgba(255,255,255,.42) 0 12%,rgba(255,255,255,.08) 22%,rgba(0,0,0,.14) 58%,rgba(255,255,255,.22) 78%,rgba(0,0,0,.2)),var(--phone-frame-color,#8a8578);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.26);
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.demo-phone__frame::after{content:"";position:absolute;inset:var(--_t);border-radius:calc(var(--_r) - var(--_t));box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.demo-phone__button{position:absolute;width:calc(var(--_t) * .42);border-radius:calc(var(--_t) * .21);background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(255,255,255,.3) 45%,rgba(0,0,0,.26)),var(--phone-frame-color,#8a8578)}
.demo-phone__button--power{right:calc(var(--_t) * -.34);top:24%;height:10%}
.demo-phone__button--action{left:calc(var(--_t) * -.34);top:15%;height:4%}
.demo-phone__button--vol-up{left:calc(var(--_t) * -.34);top:22%;height:7%}
.demo-phone__button--vol-down{left:calc(var(--_t) * -.34);top:31%;height:7%}
/* 動き（ローカル秒）。入り 0→0.40 でせり上がり、0.40〜5.633 は本体を 1px も動かさない。
   イージングは語彙（motion-vocab.css）の名前で呼ぶ。GPU 書き出しの DOM 層は語彙を読み込まないため、
   フォールバックに語彙と同じ値を書いてプレビュー・OSR・GPU の絵をそろえる */
[data-akari-active] .demo-phone__in{animation:demo-phone-rise var(--phone-rise-duration,.433s) var(--ease-smooth,cubic-bezier(.38,0,.1,1.1)) both paused;animation-delay:calc(0s - var(--phone-lead,.033s))}
[data-akari-active] .demo-phone__fade{animation:demo-phone-appear .15s var(--ease-linear,linear) both paused,demo-phone-vanish .15s var(--ease-linear,linear) forwards paused;animation-delay:calc(0s - var(--phone-lead,.033s)),calc(var(--phone-at-out,5.633s) + .15s)}
[data-akari-active] .demo-phone__out{animation:demo-phone-sink .3s var(--ease-accelerate,cubic-bezier(1,0,.98,.8)) forwards paused;animation-delay:var(--phone-at-out,5.633s)}
[data-akari-active] .demo-phone__mark{animation:demo-phone-mark .34s var(--ease-overshoot-soft,cubic-bezier(.17,2.21,.17,.97)) both paused;animation-delay:var(--phone-at-mark,.16s)}
[data-akari-active] .demo-phone__glow{animation:demo-phone-glow .5s var(--ease-smooth,cubic-bezier(.38,0,.1,1.1)) both paused;animation-delay:var(--phone-at-mark,.16s)}
[data-akari-active] .demo-phone__sheen{animation:demo-phone-sheen .6s var(--ease-smooth,cubic-bezier(.38,0,.1,1.1)) forwards paused;animation-delay:var(--phone-at-sheen,.12s)}
[data-akari-active] .demo-phone__launch{animation:demo-phone-reveal .12s var(--ease-linear,linear) forwards paused,demo-phone-cover .1s var(--ease-linear,linear) forwards paused;animation-delay:calc(var(--phone-at-tap,.80s) - var(--phone-lead,.033s)),var(--phone-at-cover,5.50s)}
[data-akari-active] .demo-phone__ripple{animation:demo-phone-ripple .35s var(--ease-smooth,cubic-bezier(.38,0,.1,1.1)) forwards paused;animation-delay:calc(var(--phone-at-tap,.80s) - var(--phone-lead,.033s))}
[data-akari-active] .demo-phone__ui{animation:demo-phone-ui .2s var(--ease-smooth,cubic-bezier(.38,0,.1,1.1)) both paused;animation-delay:calc(var(--phone-at-tap,.80s) - var(--phone-lead,.033s))}
[data-akari-active] .demo-phone__fill{animation:demo-phone-progress calc(var(--phone-progress-end,5.60s) - var(--phone-at-tap,.80s)) var(--ease-linear,linear) both paused;animation-delay:var(--phone-at-tap,.80s)}
[data-akari-active] .demo-phone__like{animation:demo-phone-like .34s var(--ease-overshoot-soft,cubic-bezier(.17,2.21,.17,.97)) both paused;animation-delay:calc(var(--phone-at-like,1.50s) - var(--phone-lead,.033s))}
@keyframes demo-phone-rise{0%{transform:translateY(var(--phone-rise,150px))}100%{transform:translateY(0)}}
@keyframes demo-phone-sink{0%{transform:translateY(0)}100%{transform:translateY(var(--phone-rise,150px))}}
@keyframes demo-phone-appear{0%{opacity:0}100%{opacity:1}}
@keyframes demo-phone-vanish{0%{opacity:1}100%{opacity:0}}
@keyframes demo-phone-mark{0%{transform:scale(.55);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes demo-phone-glow{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes demo-phone-sheen{0%{transform:translateX(-42%);opacity:0}25%{transform:translateX(-18%);opacity:1}75%{transform:translateX(24%);opacity:1}100%{transform:translateX(42%);opacity:0}}
@keyframes demo-phone-reveal{0%{opacity:1}100%{opacity:0}}
@keyframes demo-phone-cover{0%{opacity:0}100%{opacity:1}}
@keyframes demo-phone-ripple{0%{transform:scale(.2);opacity:0}10%{transform:scale(.34);opacity:.55}100%{transform:scale(1.6);opacity:0}}
@keyframes demo-phone-ui{0%{opacity:0}100%{opacity:1}}
@keyframes demo-phone-progress{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes demo-phone-like{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
