.demo-done *,
.demo-done *::before,

.demo-done {
  position: absolute;
  inset: 0;
  pointer-events: none;
  font-family: var(--done-font, "AKARI Demo Sans Done", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif);
  font-feature-settings: "palt" 1;
  font-synthesis: none;
  color: var(--demo-ink, #17130F);
  -webkit-font-smoothing: antialiased;
}

.demo-done__group {
  position: absolute;
  inset: 0;
}

.demo-done__lead {
  position: absolute;
  right: var(--done-lead-right, 82px);
  top: var(--done-lead-top, 162px);
  font-size: var(--done-lead-size, 38px);
  font-weight: 800;
  letter-spacing: .02em;
  text-align: right;
}

.demo-done__head {
  position: absolute;
  left: var(--done-head-left, 780px);
  top: var(--done-head-top, 250px);
}

.demo-done__head-text {
  font-size: var(--done-head-size, 84px);
  font-weight: 900;
  letter-spacing: .01em;
}

/* ── 判子 ─────────────────────────────── */
.demo-done__stamp {
  position: absolute;
  left: calc(var(--done-stamp-cx, 1116px) - var(--done-stamp-size, 164px) / 2);
  top: calc(var(--done-stamp-cy, 306px) - var(--done-stamp-size, 164px) / 2);
  width: var(--done-stamp-size, 164px);
  height: var(--done-stamp-size, 164px);
  transform: rotate(var(--done-stamp-rotate, -12deg));
}

/* 紙（白い円）の落ち影。宙にある間は大きく薄く、着地で紙の真下に締まる */
.demo-done__stamp-shadow {
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  background: radial-gradient(closest-side,
    rgba(58, 38, 20, .30) 0%,
    rgba(58, 38, 20, .22) 62%,
    rgba(58, 38, 20, .08) 84%,
    rgba(58, 38, 20, 0) 100%);
  opacity: 1;
  transform: translate(0, 8px) scale(1);
}

.demo-done__slam {
  position: absolute;
  inset: 0;
  opacity: 1;
  transform: scale(1);
}

.demo-done__paper {
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  background: var(--done-paper, rgba(255, 255, 255, .96));
}

.demo-done__slam svg {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.demo-done__ink-ring,
.demo-done__ink-line {
  fill: none;
  stroke: var(--demo-stamp, #E8541E);
}
.demo-done__ink-ring { stroke-width: 7; }
.demo-done__ink-line { stroke-width: 2; }

.demo-done__stamp-text {
  font-family: var(--done-stamp-font, "AKARI Demo Display Done", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif);
  font-size: 70px;
  font-weight: 400;
  font-feature-settings: normal;
  letter-spacing: 0;
  fill: var(--demo-stamp, #E8541E);
}

/* 着地の輪（最終状態も不可視の過渡 FX） */
.demo-done__ring {
  position: absolute;
  left: calc(var(--done-stamp-cx, 1116px) - var(--done-stamp-size, 164px) / 2 - 4px);
  top: calc(var(--done-stamp-cy, 306px) - var(--done-stamp-size, 164px) / 2 - 4px);
  width: calc(var(--done-stamp-size, 164px) + 8px);
  height: calc(var(--done-stamp-size, 164px) + 8px);
  border-radius: 50%;
  border: 6px solid var(--demo-stamp, #E8541E);
  opacity: 0;
  transform: scale(1);
}

/* ── 動き（活性区間だけ宣言する）────────────── */
[data-akari-active] .demo-done__group {
  animation: demo-done-exit .25s var(--ease-accelerate, cubic-bezier(1, 0, 0.98, 0.8)) var(--done-exit-delay, 3.28s) forwards;
}
[data-akari-active] .demo-done__lead {
  animation:
    demo-done-rise-14 .30s var(--ease-smooth, cubic-bezier(0.38, 0, 0.1, 1.1)) var(--done-lead-delay, 0s) both,
    demo-done-fade-in .10s var(--ease-linear, linear) var(--done-lead-delay, 0s) both;
}
[data-akari-active] .demo-done__head-text {
  animation:
    demo-done-rise-20 .32s var(--ease-smooth, cubic-bezier(0.38, 0, 0.1, 1.1)) var(--done-head-delay, 1.27s) both,
    demo-done-fade-in .10s var(--ease-linear, linear) var(--done-head-delay, 1.27s) both;
}
[data-akari-active] .demo-done__head {
  animation: demo-done-shake .14s var(--ease-linear, linear) calc(var(--done-stamp-delay, 2.09s) + .08s) forwards;
}
[data-akari-active] .demo-done__slam {
  animation:
    demo-done-slam .20s var(--ease-linear, linear) var(--done-stamp-delay, 2.09s) both,
    demo-done-fade-in .06s var(--ease-linear, linear) var(--done-stamp-delay, 2.09s) both;
}
[data-akari-active] .demo-done__stamp-shadow {
  animation: demo-done-shadow .20s var(--ease-linear, linear) var(--done-stamp-delay, 2.09s) both;
}
[data-akari-active] .demo-done__ring {
  animation: demo-done-ring .30s var(--ease-slowdown, cubic-bezier(0.11, 0.86, 0.98, 0.9)) calc(var(--done-stamp-delay, 2.09s) + .08s) forwards;
}

@keyframes demo-done-rise-14 {
  0%   { transform: translateY(14px); }
  100% { transform: translateY(0); }
}
@keyframes demo-done-rise-20 {
  0%   { transform: translateY(20px); }
  100% { transform: translateY(0); }
}
@keyframes demo-done-fade-in {
  0%   { opacity: 0; }
  100% { opacity: 1; }
}
@keyframes demo-done-slam {
  0%   { transform: scale(1.9); }
  40%  { transform: scale(.92); }
  70%  { transform: scale(1.03); }
  100% { transform: scale(1); }
}
@keyframes demo-done-shadow {
  0%   { transform: translate(16px, 34px) scale(1.75); opacity: 0; }
  40%  { transform: translate(0, 6px) scale(.95);      opacity: 1; }
  70%  { transform: translate(0, 9px) scale(1.04);     opacity: 1; }
  100% { transform: translate(0, 8px) scale(1);        opacity: 1; }
}
@keyframes demo-done-ring {
  0%   { transform: scale(1);    opacity: .6; }
  100% { transform: scale(1.35); opacity: 0; }
}
@keyframes demo-done-shake {
  0%   { transform: translateX(0); }
  33%  { transform: translateX(-3px); }
  66%  { transform: translateX(2px); }
  100% { transform: translateX(0); }
}
@keyframes demo-done-exit {
  0%   { transform: translateY(0);     opacity: 1; }
  100% { transform: translateY(-10px); opacity: 0; }
}
</style>

            <stop offset="0" stop-color="#FFFFFF"/>
