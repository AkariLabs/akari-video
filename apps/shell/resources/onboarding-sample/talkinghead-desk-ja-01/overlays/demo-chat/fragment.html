.demo-chat{position:absolute;inset:0;font-family:var(--chat-font,"AKARI Demo Sans","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif);font-weight:800;font-feature-settings:"palt" 1;color:var(--demo-ink,#17130F)}
.demo-chat svg{display:block;flex:none}
.demo-chat__stage{position:absolute;left:var(--chat-left,770px);top:var(--chat-top,140px);width:var(--chat-width,440px);height:var(--chat-height,270px)}
.demo-chat__card{position:absolute;inset:0;display:flex;flex-direction:column;padding:16px 22px 18px;border-radius:var(--chat-radius,22px);background:var(--demo-card,rgba(255,255,255,.97));border:1px solid var(--demo-card-line,rgba(23,19,15,.07));box-shadow:var(--demo-shadow,0 18px 44px rgba(58,38,20,.22))}
.demo-chat__head{display:flex;align-items:center;gap:9px;padding:0 2px 12px;border-bottom:1px solid var(--chat-rule,rgba(23,19,15,.09));font-size:var(--chat-head-size,20px);line-height:26px;letter-spacing:.02em;color:var(--demo-ink-sub,#6B5E52)}
.demo-chat__head svg{width:20px;height:20px;color:var(--demo-accent,#F97316)}
.demo-chat__log{display:flex;flex-direction:column;gap:14px;padding-top:16px}
.demo-chat__you{display:flex;justify-content:flex-end}
.demo-chat__bubble{margin:0;min-height:52px;display:flex;align-items:center;font-size:var(--chat-font-size,24px);line-height:30px;letter-spacing:.01em;white-space:nowrap}
.demo-chat__bubble--you{max-width:300px;padding:11px 19px 11px 20px;border-radius:18px 18px 6px 18px;background:var(--demo-accent,#F97316);color:var(--chat-on-accent,#FFFFFF);box-shadow:0 8px 18px rgba(249,115,22,.26);transform-origin:100% 100%}
.demo-chat__ai{display:flex;align-items:flex-end;gap:10px;transform-origin:0 100%}
.demo-chat__avatar{display:grid;place-items:center;width:36px;height:36px;flex:none;border-radius:50%;background:var(--chat-avatar,#FFF3E8);color:var(--demo-accent,#F97316);box-shadow:inset 0 0 0 1px rgba(249,115,22,.18)}
.demo-chat__avatar svg{width:19px;height:19px}
.demo-chat__slot{display:grid;justify-items:start;align-items:end}
.demo-chat__slot>*{grid-area:1/1}
.demo-chat__bubble--ai{border-radius:18px 18px 18px 6px;background:var(--chat-ai-bubble,#F4EFE9);color:var(--demo-ink,#17130F)}
.demo-chat__typing{opacity:0;transform-origin:0 100%}
.demo-chat__typing .demo-chat__bubble{gap:7px;padding:0 20px}
.demo-chat__dot{width:9px;height:9px;border-radius:50%;background:var(--demo-ink-sub,#6B5E52)}
.demo-chat__reply{gap:10px;padding:11px 14px 11px 20px;transform-origin:0 100%}
.demo-chat__check{position:relative;width:28px;height:28px;flex:none;color:var(--demo-accent,#F97316)}
.demo-chat__check svg{width:28px;height:28px}
.demo-chat__ring{position:absolute;inset:-6px;border-radius:50%;border:2.5px solid var(--demo-accent,#F97316);opacity:0}
.demo-chat__input{display:flex;align-items:center;justify-content:space-between;height:40px;margin-top:auto;padding:0 5px 0 16px;border-radius:20px;background:var(--chat-input,#F7F3EE);border:1px solid rgba(23,19,15,.06);font-weight:500;font-size:16px;letter-spacing:.02em;color:var(--chat-hint,#A3968A)}
.demo-chat__send{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--demo-accent,#F97316)}
.demo-chat__send svg{width:16px;height:16px}

[data-akari-active] .demo-chat__bubble--you{animation:demo-chat-pop .28s var(--ease-overshoot-soft, cubic-bezier(0.17, 2.21, 0.17, 0.97)) both paused;animation-delay:calc(var(--chat-at-you,.017s) - var(--chat-lead,.033s))}
[data-akari-active] .demo-chat__ai{animation:demo-chat-pop .28s var(--ease-overshoot-soft, cubic-bezier(0.17, 2.21, 0.17, 0.97)) both paused;animation-delay:calc(var(--chat-at-ai,.727s) - var(--chat-lead,.033s))}
[data-akari-active] .demo-chat__dot{animation:demo-chat-dot .6s var(--ease-smooth, cubic-bezier(0.38, 0, 0.1, 1.1)) 2 both paused;animation-delay:calc(var(--chat-at-ai,.727s) - var(--chat-lead,.033s) + var(--dot-i) * .12s)}
[data-akari-active] .demo-chat__typing{animation:demo-chat-typing-out .1s var(--ease-linear, linear) both paused;animation-delay:calc(var(--chat-at-done,1.367s) - var(--chat-lead,.033s))}
[data-akari-active] .demo-chat__reply{animation:demo-chat-reply-in .2s var(--ease-overshoot-soft, cubic-bezier(0.17, 2.21, 0.17, 0.97)) both paused;animation-delay:calc(var(--chat-at-done,1.367s) - var(--chat-lead,.033s))}
[data-akari-active] .demo-chat__check{animation:demo-chat-check-in .32s var(--ease-overshoot-mid, cubic-bezier(0.18, 3.16, 0.07, 0.83)) both paused;animation-delay:calc(var(--chat-at-check,1.40s) - var(--chat-lead,.033s))}
[data-akari-active] .demo-chat__ring{animation:demo-chat-ring .45s var(--ease-smooth, cubic-bezier(0.38, 0, 0.1, 1.1)) forwards paused;animation-delay:calc(var(--chat-at-check,1.40s) + .05s)}
@keyframes demo-chat-card-in{0%{transform:translateX(30px)}100%{transform:translateX(0)}}
@keyframes demo-chat-card-fade{0%{opacity:0}100%{opacity:1}}
@keyframes demo-chat-out{0%{transform:translateX(0);opacity:1}100%{transform:translateX(30px);opacity:0}}
@keyframes demo-chat-pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes demo-chat-dot{0%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}60%{transform:translateY(0);opacity:.45}100%{transform:translateY(0);opacity:.45}}
@keyframes demo-chat-typing-out{0%{transform:scale(1);opacity:1}100%{transform:scale(.88);opacity:0}}
@keyframes demo-chat-reply-in{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes demo-chat-check-in{0%{transform:scale(.4) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(0deg);opacity:1}}
