.demo-title,
.demo-title *,
.demo-title *::before,

.demo-title {
  position: absolute;
  inset: 0;
  pointer-events: none;
  font-family: var(--title-font, "AKARI Demo Sans", "Helvetica Neue", Arial, sans-serif);
  font-weight: 900;
  color: var(--demo-ink, #17130F);
  -webkit-font-smoothing: antialiased;
}

.demo-title__group {
  position: absolute;
  inset: 0;
}

/* ── カード ─────────────────────────────── */
.demo-title__card {
  position: absolute;
  left: var(--title-left, 726px);
  top: var(--title-top, 60px);
  width: var(--title-width, 510px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: var(--title-padding, 22px 24px);
  border-radius: var(--title-radius, 24px);
  background: var(--title-card-bg, rgba(255, 255, 255, .97));
  border: 1px solid var(--title-card-line, rgba(23, 19, 15, .07));
  box-shadow: var(--title-shadow, 0 18px 44px rgba(58, 38, 20, .22));
}

.demo-title__text {
  flex: none;
}

/* マイクの丸（図解の「話す」と同じ題材）: 地 #FFF3E8・橙の輪 3px・マイクの絵柄は丸の 54% */
.demo-title__mic {
  position: relative;
  flex: none;
  width: var(--title-mic-size, 70px);
  height: var(--title-mic-size, 70px);
}

.demo-title__mic-disc {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--title-mic-bg, #FFF3E8);
  border: 3px solid var(--demo-accent, #F97316);
  color: var(--demo-accent, #F97316);
}

.demo-title__mic-icon {
  display: block;
  width: 54%;
  height: 54%;
}

/* 声の波紋: 話し始めの瞬間に 2 重の輪が広がって消える（最終状態も不可視の過渡）*/
.demo-title__ripple {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 3px solid var(--demo-accent-soft, #FDBA74);
  opacity: 0;
}

.demo-title__lead {
  display: block;
  font-size: var(--title-lead-size, 40px);
  line-height: 1.22;
  letter-spacing: 0;
  white-space: nowrap;
}

.demo-title__main {
  position: relative;
  display: inline-block;
  margin-top: 2px;
  padding-bottom: 16px;
  font-size: var(--title-main-size, 56px);
  line-height: 1.1;
  letter-spacing: 0;
  white-space: nowrap;
}

/* 下線: 文字幅（最後の字の字間 .02em を除く）いっぱい、高さ 10px */
.demo-title__underline {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 10px;
  border-radius: 5px;
  background: var(--demo-accent, #F97316);
  transform-origin: left center;
}

/* ── 名札 ─────────────────────────────── */
.demo-title__badge {
  position: absolute;
  left: var(--title-left, 726px);
  top: calc(var(--title-top, 60px) + var(--title-badge-gap, 184px));
  transform-origin: 13% 50%;
}

.demo-title__badge-body {
  position: relative;
  display: flex;
  align-items: center;
  gap: .38em;
  height: calc(var(--title-badge-size, 34px) * 1.77);
  padding: 0 .85em 0 .72em;
  border-radius: 999px;
  overflow: hidden;
  background: var(--demo-accent, #F97316);
  color: #FFFFFF;
  font-size: var(--title-badge-size, 34px);
  line-height: 1;
  letter-spacing: .01em;
  white-space: nowrap;
  box-shadow: 0 10px 24px rgba(58, 38, 20, .24), 0 2px 0 rgba(255, 255, 255, .28) inset;
}

.demo-title__star {
  display: block;
  flex: none;
  width: .92em;
  height: .92em;
}

.demo-title__name {
  display: block;
  padding-top: .04em;
}

/* 光: 名札の中で左から右へ横切る白い斜めの帯（最終状態も不可視の過渡 FX） */
.demo-title__shine {
  position: absolute;
  inset: -2px;
  background: linear-gradient(115deg,
    rgba(255, 255, 255, 0) 34%,
    rgba(255, 255, 255, .55) 42%,
    rgba(255, 255, 255, .95) 46%,
    rgba(255, 255, 255, .55) 50%,
    rgba(255, 255, 255, 0) 56%,
    rgba(255, 255, 255, 0) 59%,
    rgba(255, 255, 255, .7) 61%,
    rgba(255, 255, 255, 0) 63.5%);
  opacity: 0;
}

/* ── 動き（活性区間だけ宣言する）────────────── */
[data-akari-active] .demo-title__group {
  animation: demo-title-exit .25s var(--ease-accelerate, cubic-bezier(1, 0, 0.98, 0.8)) var(--title-exit-delay, 5.65s) forwards;
}
[data-akari-active] .demo-title__card {
  animation: demo-title-card-in .42s var(--ease-smooth, cubic-bezier(0.38, 0, 0.1, 1.1)) var(--title-card-delay, -.05s) both;
}
[data-akari-active] .demo-title__lead {
  animation: demo-title-rise-lead .35s var(--ease-smooth, cubic-bezier(0.38, 0, 0.1, 1.1)) calc(var(--title-card-delay, -.05s) + .133s) both;
}
[data-akari-active] .demo-title__main {
  animation: demo-title-rise-main .37s var(--ease-smooth, cubic-bezier(0.38, 0, 0.1, 1.1)) calc(var(--title-card-delay, -.05s) + .213s) both;
}
[data-akari-active] .demo-title__underline {
  animation: demo-title-underline .35s var(--ease-slowdown, cubic-bezier(0.11, 0.86, 0.98, 0.9)) var(--title-underline-delay, 3.173s) both;
}
[data-akari-active] .demo-title__badge {
  animation: demo-title-badge-pop .32s var(--ease-overshoot-soft, cubic-bezier(0.17, 2.21, 0.17, 0.97)) var(--title-badge-delay, 4.598s) both;
}
[data-akari-active] .demo-title__star {
  animation: demo-title-star-open .5s var(--ease-overshoot-soft, cubic-bezier(0.17, 2.21, 0.17, 0.97)) calc(var(--title-badge-delay, 4.598s) + .03s) both;
}
[data-akari-active] .demo-title__shine {
  animation:
    demo-title-shine-move .4s var(--ease-linear, linear) var(--title-shine-delay, calc(var(--title-badge-delay, 4.598s) + .135s)) both,
    demo-title-shine-fade .4s var(--ease-linear, linear) var(--title-shine-delay, calc(var(--title-badge-delay, 4.598s) + .135s)) both;
}
[data-akari-active] .demo-title__mic-disc {
  animation: demo-title-mic-pop .32s var(--ease-overshoot-soft, cubic-bezier(0.17, 2.21, 0.17, 0.97)) var(--title-mic-delay, .233s) both;
}
[data-akari-active] .demo-title__ripple--1 {
  animation: demo-title-ripple .7s var(--ease-slowdown, cubic-bezier(0.11, 0.86, 0.98, 0.9)) var(--title-listen-1, .40s) forwards;
}
[data-akari-active] .demo-title__ripple--2 {
  animation: demo-title-ripple .7s var(--ease-slowdown, cubic-bezier(0.11, 0.86, 0.98, 0.9)) calc(var(--title-listen-1, .40s) + .16s) forwards;
}
[data-akari-active] .demo-title__ripple--3 {
  animation: demo-title-ripple .7s var(--ease-slowdown, cubic-bezier(0.11, 0.86, 0.98, 0.9)) var(--title-listen-2, 1.987s) forwards;
}
[data-akari-active] .demo-title__ripple--4 {
  animation: demo-title-ripple .7s var(--ease-slowdown, cubic-bezier(0.11, 0.86, 0.98, 0.9)) calc(var(--title-listen-2, 1.987s) + .16s) forwards;
}

@keyframes demo-title-card-in {

@keyframes demo-title-underline {

}
@keyframes demo-title-badge-pop {

@keyframes demo-title-shine-move {

}
@keyframes demo-title-mic-pop {

@keyframes demo-title-exit {

  100% { transform: translateX(40px); opacity: 0; }
