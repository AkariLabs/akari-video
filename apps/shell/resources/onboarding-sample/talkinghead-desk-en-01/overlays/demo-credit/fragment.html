/* ── クレジット（役職 | 名前 の 2 列、軸をそろえる）──────── */
.demo-credit__credits {
  position: absolute;
  right: var(--credit-right, 80px);
  top: var(--credit-top, 120px);
  display: grid;
  grid-template-columns: auto auto;
  column-gap: var(--credit-gap, 22px);
  row-gap: var(--credit-row-gap, 20px);
  align-items: baseline;
}

.demo-credit__label {
  justify-self: end;
  /* 字間 .3em の最後の 1 字ぶんを右へ逃がし、字の右端を軸にそろえる */
  font-size: var(--credit-label-size, 32px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: .02em;
  color: var(--demo-ink-sub, #6B5E52);
  white-space: nowrap;
}

.demo-credit__name {
  position: relative;
  justify-self: start;
  font-weight: 900;
  line-height: 1;
  white-space: nowrap;
}
.demo-credit__name--cast {
  font-size: var(--credit-name-size, 72px);
}
.demo-credit__name--editor {
  font-size: var(--credit-hero-size, 104px);
  letter-spacing: .01em;
  color: var(--demo-accent, #F97316);
}

/* 「AI」の右上のキラッ（効果音とエフェクトのキラッと同じ絵柄: 黄の地・橙の縁・白い芯） */
.demo-credit__spark {
  position: absolute;
  right: calc(var(--credit-spark-size, 34px) * -.74);
  top: calc(var(--credit-spark-size, 34px) * -.06);
  width: var(--credit-spark-size, 34px);
  height: var(--credit-spark-size, 34px);
}
.demo-credit__spark-pop,
.demo-credit__spark-glint {
  position: absolute;
  inset: 0;
}
.demo-credit__spark svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* ── 区切りの線 ───────────────────────── */
.demo-credit__rule {
  position: absolute;
  right: var(--credit-right, 80px);
  top: var(--credit-rule-top, 346px);
  width: var(--credit-rule-width, 64px);
  height: 5px;
  border-radius: 2.5px;
  background: var(--demo-accent, #F97316);
  box-shadow: 0 0 0 4px var(--credit-halo-color, #FFFFFF), 0 4px 12px var(--credit-shadow-color, rgba(58, 38, 20, .085));
  transform-origin: right center;
}

/* ── 終わりの名札 ─────────────────────── */
.demo-credit__plate {
  position: absolute;
  right: var(--credit-right, 80px);
  top: var(--credit-plate-top, 378px);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}

.demo-credit__brand {
  display: flex;
  align-items: center;
  gap: .3em;
  font-size: var(--credit-plate-size, 40px);
  font-weight: 900;
  line-height: 1;
  letter-spacing: .01em;
  white-space: nowrap;
}

.demo-credit__star {
  display: block;
  flex: none;
  width: .9em;
  height: .9em;
  overflow: visible;
}
.demo-credit__star-halo {
  fill: var(--credit-halo-color, #FFFFFF);
  stroke: var(--credit-halo-color, #FFFFFF);
  stroke-width: calc(var(--credit-halo, 9px) * 1.8);
  stroke-linejoin: round;
}
.demo-credit__star-body {
  fill: var(--demo-accent, #F97316);
}

.demo-credit__tagline {
  margin-top: var(--credit-tagline-gap, 14px);
    font-size: var(--credit-tagline-size, 28px);
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: .01em;
  text-align: right;
  color: var(--demo-ink-sub, #6B5E52);
  white-space: nowrap;
}

/* ── 動き（活性区間だけ宣言する）──────────────
   イージングはモーション語彙（packages/overlay-runtime/src/motion-vocab.css）の名前で呼ぶ。
   var() の 2 つ目は語彙と同じ値の控え: GPU 書き出し（render-cut --engine gpu / auto の既定）の
   ページは語彙を読み込まないため、控えが無いと animation の宣言ごと無効になり、書き出しでは
   区間の頭から最終の静止状態のまま動かない（2026-10-01 実測。OSR・プレビューは語彙あり）。
   語彙を変えたら控えも合わせる */
