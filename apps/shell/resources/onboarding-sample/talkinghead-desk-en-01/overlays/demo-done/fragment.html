/* ── 1 行目: 強調テロップ（マイク・文字・声の波形）─────────── */
.demo-done__lead {
  position: absolute;
  left: var(--done-lead-left, 750px);
  top: var(--done-lead-top, 140px);
  width: var(--done-lead-width, 470px);
  height: var(--done-lead-size, 50px);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--done-lead-gap, 9px);
}

.demo-done__lead-text {
  font-size: var(--done-lead-size, 50px);
  letter-spacing: 0;
}

/* マイク（demo-title と同じ形。viewBox は形の外形ぴったり 32 × 39.5）。白フチは同じ形を白い太線で下に敷く */
.demo-done__mic {
  width: calc(var(--done-mic-size, 40px) * .8101);
  height: var(--done-mic-size, 40px);
  color: var(--demo-accent, #F97316);
  transform: scale(1);
}
.demo-done__mic-halo {
  fill: var(--done-halo-color, #FFFFFF);
  stroke: var(--done-halo-color, #FFFFFF);
  stroke-linecap: round;
  stroke-linejoin: round;
}
/* 高さ 39.5 単位を 40px に描くので、ユーザー単位 1 = 1.0127px。白フチ 9px = 8.89 単位（× 2 = 線の太さ） */
.demo-done__mic-halo rect { stroke-width: calc(var(--done-halo, 9px) * 1.975); }
.demo-done__mic-halo path { fill: none; stroke-width: calc(4px + var(--done-halo, 9px) * 1.975); }

/* 声の波形: 棒 5 本（幅 6・高さ 12〜36）。線の端を丸め、太さは拡縮しない（non-scaling-stroke）ので
   scaleY で縮んでも丸い棒のまま。白フチは同じ棒を白い太線で下に敷く */
.demo-done__bar {
  vector-effect: non-scaling-stroke;
  stroke-linecap: round;
  transform-box: fill-box;
  transform-origin: 50% 50%;
  transform: scaleY(var(--bar-rest, .7));
}
.demo-done__wave-ink .demo-done__bar {
  stroke: var(--demo-accent, #F97316);
  stroke-width: 6px;
}
.demo-done__wave-halo .demo-done__bar {
  stroke: var(--done-halo-color, #FFFFFF);
  stroke-width: calc(6px + var(--done-halo, 9px) * 2);
}

/* ── 2 行目 ─────────────────────────────────────────── */
.demo-done__head {
  position: absolute;
  left: var(--done-head-left, 750px);
  top: var(--done-head-top, 222px);
}

.demo-done__head-text {
  font-size: var(--done-head-size, 68px);
  letter-spacing: 0;
}

/* ── 判子（地は透明。朱の二重円と朱の字だけ）──────────────── */
.demo-done__stamp {
  position: absolute;
  left: calc(var(--done-stamp-cx, 1122px) - var(--done-stamp-size, 176px) / 2);
  top: calc(var(--done-stamp-cy, 404px) - var(--done-stamp-size, 176px) / 2);
  width: var(--done-stamp-size, 176px);
  height: var(--done-stamp-size, 176px);
  transform: rotate(var(--done-stamp-rotate, -12deg));
}

.demo-done__slam {
  position: absolute;
  inset: 0;
  opacity: 1;
  transform: scale(1);
}

.demo-done__slam svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.demo-done__ink-ring,
.demo-done__ink-line {
  fill: none;
  stroke: var(--demo-stamp, #E8541E);
}
.demo-done__ink-ring { stroke-width: 7; }
.demo-done__ink-line { stroke-width: 2; }

.demo-done__stamp-text {
  font-family: var(--done-stamp-font, "AKARI Demo Display Done", "Helvetica Neue", Arial, sans-serif);
  font-size: 38px;
  font-weight: 400;
    letter-spacing: 0;
  fill: var(--demo-stamp, #E8541E);
}

/* 着地の輪（最終状態も不可視の過渡 FX） */
.demo-done__ring {
  position: absolute;
  left: calc(var(--done-stamp-cx, 1122px) - var(--done-stamp-size, 176px) / 2);
  top: calc(var(--done-stamp-cy, 404px) - var(--done-stamp-size, 176px) / 2);
  width: var(--done-stamp-size, 176px);
  height: var(--done-stamp-size, 176px);
  border-radius: 50%;
  border: 6px solid var(--demo-stamp, #E8541E);
  opacity: 0;
  transform: scale(1);
}

/* ── 動き（活性区間だけ宣言する）────────────────────── */
[data-akari-active] .demo-done__group {
  animation: demo-done-exit .25s var(--ease-accelerate, cubic-bezier(1, 0, 0.98, 0.8)) var(--done-exit-delay, 3.85s) forwards;
}
[data-akari-active] .demo-done__lead {
  animation:
    demo-done-rise-14 .30s var(--ease-smooth, cubic-bezier(0.38, 0, 0.1, 1.1)) var(--done-lead-delay, .01s) both,
    demo-done-fade-in .10s var(--ease-linear, linear) var(--done-lead-delay, .01s) both;
}
[data-akari-active] .demo-done__mic {
  animation: demo-done-mic-pop .36s var(--ease-overshoot-soft, cubic-bezier(0.17, 2.21, 0.17, 0.97)) var(--done-lead-delay, .01s) both;
}
[data-akari-active] .demo-done__bar {
  animation: demo-done-bar var(--done-beat, .70589s) var(--ease-linear, linear) infinite both;
  animation-delay: calc(var(--done-beat-peak, .5586s) - var(--done-beat, .70589s) * 1.5 + var(--bar-offset, 0s));
}
[data-akari-active] .demo-done__head-text {
  animation:
    demo-done-rise-20 .32s var(--ease-smooth, cubic-bezier(0.38, 0, 0.1, 1.1)) var(--done-head-delay, 1.37s) both,
    demo-done-fade-in .10s var(--ease-linear, linear) var(--done-head-delay, 1.37s) both;
}
[data-akari-active] .demo-done__head {
  animation: demo-done-shake .14s var(--ease-linear, linear) calc(var(--done-stamp-delay, 2.68s) + .08s) forwards;
}
[data-akari-active] .demo-done__slam {
  animation:
    demo-done-slam .20s var(--ease-linear, linear) var(--done-stamp-delay, 2.68s) both,
    demo-done-fade-in .06s var(--ease-linear, linear) var(--done-stamp-delay, 2.68s) both;
}
[data-akari-active] .demo-done__ring {
  animation: demo-done-ring .30s var(--ease-slowdown, cubic-bezier(0.11, 0.86, 0.98, 0.9)) calc(var(--done-stamp-delay, 2.68s) + .08s) forwards;
}

@keyframes demo-done-rise-14 {
  0%   { transform: translateY(14px); }
  100% { transform: translateY(0); }
}
@keyframes demo-done-rise-20 {
  0%   { transform: translateY(20px); }
  100% { transform: translateY(0); }
}
@keyframes demo-done-fade-in {
  0%   { opacity: 0; }
  100% { opacity: 1; }
}
@keyframes demo-done-mic-pop {
  0%   { transform: scale(.6); }
  100% { transform: scale(1); }
}
/* 山（50%）の手前 0.085 秒で一気に上がり、残りで落ちる（BGM 札と同じメーターの形） */
@keyframes demo-done-bar {
  0%   { transform: scaleY(.35); }
  38%  { transform: scaleY(.42); }
  50%  { transform: scaleY(1); }
  62%  { transform: scaleY(.78); }
  80%  { transform: scaleY(.52); }
  100% { transform: scaleY(.35); }
}
@keyframes demo-done-slam {
  0%   { transform: scale(1.9); }
  40%  { transform: scale(.92); }
  70%  { transform: scale(1.03); }
  100% { transform: scale(1); }
}
@keyframes demo-done-ring {
  0%   { transform: scale(1);    opacity: .6; }
  100% { transform: scale(1.22); opacity: 0; }
}
@keyframes demo-done-shake {
  0%   { transform: translateX(0); }
  33%  { transform: translateX(-3px); }
  66%  { transform: translateX(2px); }
  100% { transform: translateX(0); }
}
@keyframes demo-done-exit {
  0%   { transform: translateY(0);     opacity: 1; }
  100% { transform: translateY(-10px); opacity: 0; }
}
