  語頭のフレームで見え始めるようにしてある。日本語版（ja-01）から文言・幅・時刻だけを差し替えた版。
    カード       -0.033 → 0.267  右から滑り込む（translateX 30→0 は --ease-smooth 0.30 秒、opacity 0→1 は --ease-slowdown
                                 0.25 秒。語頭のフレームで 4 割見えている）
    あなた        0.000          「With」(6.40) の語頭。橙の吹き出し "Edit it to match what I say" がポップ
                                 （scale .7→1、0.28 秒、--ease-overshoot-soft、右下起点）
    AI 入力中     0.820          「all」(7.22) の語頭。アイコンと入力中の点 3 つの吹き出しがポップ（左下起点）。
                                 点は 0.6 秒周期・0.12 秒ずらしで上下（2 周）
    返事          1.740          「talk」(8.14) の語頭。点の吹き出しが 0.1 秒で消え、"Done!" が 0.2 秒で出る
    チェック      1.770          橙の丸チェックが回りながらポップ（scale .4→1、--ease-overshoot-mid）、
                                 0.05 秒後に橙の輪が 1 回広がって消える
    抜け          2.700 → 2.950  右へ 30px 抜けて消える（--ease-accelerate、0.25 秒、forwards。区間の最後 3.000 の手前で消え切る。

  740 → 730px にした（left 730 / top 130 / 480×248。右端 1210。抜けで右へ 30px ずれても 1240 に収まる）。
  右の舞台（y<460 は x 720〜1240）に収まり、人物の届く範囲（y<470 で x<690）と字幕帯
  （x 300〜980・y≥628）には入らない。ラテン文字用に palt と字間の指定は外した。

  書体: AKARI Demo Sans = Noto Sans JP（SIL Open Font License 1.1、著作権 Adobe、Reserved Font Name 'Source'）の
  wght 800 を、この断片で使う文字（半角英字・空白・"!" の 22 字）だけに切り出した改変版（別名で埋め込み、
  フォント内に著作権表示と許諾を保持。日本語の字形は含まない）。
  unicode-range をこの断片の文字に限ってあるので、同じ家族名の別断片（900 等）と同じ文書に並んでも混ざらない。

  ツマミ（edit.json の overlays[].vars で上書きする）:
    --chat-left / --chat-top / --chat-width / --chat-height   カードの位置と大きさ（既定 730px / 130px / 480px / 248px）
    --chat-radius                                            カードの角丸（既定 26px）
    --chat-font-size / --chat-head-size                      吹き出しと見出しの文字サイズ（既定 28px / 26px）
    --chat-font                                              書体（既定 AKARI Demo Sans → Helvetica Neue → Arial …）
    --demo-ink / --demo-ink-sub                              墨（文字）・補助（見出し・点）
    --demo-card / --demo-card-line / --demo-shadow           カードの地・縁・影
    --demo-accent                                            橙（あなたの吹き出し・✦・チェック）
    --chat-on-accent / --chat-ai-bubble / --chat-avatar      橙の上の文字・AI の吹き出しの地・アイコンの地
    --chat-rule                                              見出しの区切り線
    --chat-lead                                              入りの前倒し（既定 .033s = 1 フレーム）
    --chat-at-you / --chat-at-ai / --chat-at-done / --chat-at-check / --chat-at-out
                                                             各段の発火時刻（ローカル秒。既定 0s / .82s / 1.74s / 1.77s / 2.7s）

.demo-chat,.demo-chat *,.demo-chat *::before,.demo-chat *::after{box-sizing:border-box}
.demo-chat{position:absolute;inset:0;font-family:var(--chat-font,"AKARI Demo Sans","Helvetica Neue",Arial,sans-serif);font-weight:800;color:var(--demo-ink,#17130F)}
.demo-chat svg{display:block;flex:none}
.demo-chat__stage{position:absolute;left:var(--chat-left,730px);top:var(--chat-top,130px);width:var(--chat-width,480px);height:var(--chat-height,248px)}
.demo-chat__card{position:absolute;inset:0;display:flex;flex-direction:column;padding:18px 26px 22px;border-radius:var(--chat-radius,26px);background:var(--demo-card,rgba(255,255,255,.97));border:1px solid var(--demo-card-line,rgba(23,19,15,.07));box-shadow:var(--demo-shadow,0 18px 44px rgba(58,38,20,.22))}
.demo-chat__head{display:flex;align-items:center;gap:11px;padding:0 2px 14px;border-bottom:1px solid var(--chat-rule,rgba(23,19,15,.09));font-size:var(--chat-head-size,26px);line-height:32px;letter-spacing:.01em;color:var(--demo-ink-sub,#6B5E52)}
.demo-chat__head svg{width:25px;height:25px;color:var(--demo-accent,#F97316)}
.demo-chat__log{display:flex;flex-direction:column;gap:16px;padding-top:18px}
.demo-chat__you{display:flex;justify-content:flex-end}
.demo-chat__bubble{margin:0;min-height:62px;display:flex;align-items:center;font-size:var(--chat-font-size,28px);line-height:36px;letter-spacing:0;white-space:nowrap}
.demo-chat__bubble--you{max-width:428px;padding:13px 24px 13px 25px;border-radius:22px 22px 7px 22px;background:var(--demo-accent,#F97316);color:var(--chat-on-accent,#FFFFFF);box-shadow:0 9px 20px rgba(249,115,22,.26);transform-origin:100% 100%}
.demo-chat__ai{display:flex;align-items:flex-end;gap:12px;transform-origin:0 100%}
.demo-chat__avatar{display:grid;place-items:center;width:44px;height:44px;flex:none;border-radius:50%;background:var(--chat-avatar,#FFF3E8);color:var(--demo-accent,#F97316);box-shadow:inset 0 0 0 1px rgba(249,115,22,.18)}
.demo-chat__avatar svg{width:23px;height:23px}
.demo-chat__slot{display:grid;justify-items:start;align-items:end}
.demo-chat__slot>*{grid-area:1/1}
.demo-chat__bubble--ai{border-radius:22px 22px 22px 7px;background:var(--chat-ai-bubble,#F4EFE9);color:var(--demo-ink,#17130F)}
.demo-chat__typing{opacity:0;transform-origin:0 100%}
.demo-chat__typing .demo-chat__bubble{gap:9px;padding:0 25px}
.demo-chat__dot{width:11px;height:11px;border-radius:50%;background:var(--demo-ink-sub,#6B5E52)}
.demo-chat__reply{gap:12px;padding:13px 16px 13px 25px;transform-origin:0 100%}
.demo-chat__check{position:relative;width:34px;height:34px;flex:none;color:var(--demo-accent,#F97316)}
.demo-chat__check svg{width:34px;height:34px}
.demo-chat__ring{position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--demo-accent,#F97316);opacity:0}
[data-akari-active] .demo-chat__stage{animation:demo-chat-out .25s var(--ease-accelerate, cubic-bezier(1, 0, 0.98, 0.8)) forwards paused;animation-delay:var(--chat-at-out,2.7s)}
[data-akari-active] .demo-chat__card{animation:demo-chat-card-in .3s var(--ease-smooth, cubic-bezier(0.38, 0, 0.1, 1.1)) both paused,demo-chat-card-fade .25s var(--ease-slowdown, cubic-bezier(0.11, 0.86, 0.98, 0.9)) both paused;animation-delay:calc(0s - var(--chat-lead,.033s)),calc(0s - var(--chat-lead,.033s))}
[data-akari-active] .demo-chat__bubble--you{animation:demo-chat-pop .28s var(--ease-overshoot-soft, cubic-bezier(0.17, 2.21, 0.17, 0.97)) both paused;animation-delay:calc(var(--chat-at-you,0s) - var(--chat-lead,.033s))}
[data-akari-active] .demo-chat__ai{animation:demo-chat-pop .28s var(--ease-overshoot-soft, cubic-bezier(0.17, 2.21, 0.17, 0.97)) both paused;animation-delay:calc(var(--chat-at-ai,.82s) - var(--chat-lead,.033s))}
[data-akari-active] .demo-chat__dot{animation:demo-chat-dot .6s var(--ease-smooth, cubic-bezier(0.38, 0, 0.1, 1.1)) 2 both paused;animation-delay:calc(var(--chat-at-ai,.82s) - var(--chat-lead,.033s) + var(--dot-i) * .12s)}
[data-akari-active] .demo-chat__typing{animation:demo-chat-typing-out .1s var(--ease-linear, linear) both paused;animation-delay:calc(var(--chat-at-done,1.74s) - var(--chat-lead,.033s))}
[data-akari-active] .demo-chat__reply{animation:demo-chat-reply-in .2s var(--ease-overshoot-soft, cubic-bezier(0.17, 2.21, 0.17, 0.97)) both paused;animation-delay:calc(var(--chat-at-done,1.74s) - var(--chat-lead,.033s))}
[data-akari-active] .demo-chat__check{animation:demo-chat-check-in .32s var(--ease-overshoot-mid, cubic-bezier(0.18, 3.16, 0.07, 0.83)) both paused;animation-delay:calc(var(--chat-at-check,1.77s) - var(--chat-lead,.033s))}
[data-akari-active] .demo-chat__ring{animation:demo-chat-ring .45s var(--ease-smooth, cubic-bezier(0.38, 0, 0.1, 1.1)) forwards paused;animation-delay:calc(var(--chat-at-check,1.77s) + .05s)}
@keyframes demo-chat-card-in{0%{transform:translateX(30px)}100%{transform:translateX(0)}}
@keyframes demo-chat-card-fade{0%{opacity:0}100%{opacity:1}}
@keyframes demo-chat-out{0%{transform:translateX(0);opacity:1}100%{transform:translateX(30px);opacity:0}}
@keyframes demo-chat-pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes demo-chat-dot{0%{transform:translateY(0);opacity:.45}30%{transform:translateY(-6px);opacity:1}60%{transform:translateY(0);opacity:.45}100%{transform:translateY(0);opacity:.45}}
@keyframes demo-chat-typing-out{0%{transform:scale(1);opacity:1}100%{transform:scale(.88);opacity:0}}
@keyframes demo-chat-reply-in{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes demo-chat-check-in{0%{transform:scale(.4) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(0deg);opacity:1}}
@keyframes demo-chat-ring{0%{transform:scale(.85);opacity:.75}100%{transform:scale(1.7);opacity:0}}
</style>
