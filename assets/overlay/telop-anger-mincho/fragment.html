<div
  class="telop-anger-mincho"
  lang="ja"
  data-start="0"
  data-duration="3"
>
  <style>
    /*
     * telop-anger-mincho — 怒り A（赤→黒グラデ + 白縁 + 黒っぽい雲・明朝）の HTML 断片化。
     * 変換元: lab/telop-rich-css-poc/02-style-gallery.html #st-anger-a
     *
     * 構造: __anchor（中央配置 + posX/posY 微調整 + 長文の折返し境界）>
     * __stack（3層を同一 grid セルへ重ねる）> __rh（縁取りなしの複製層・グロー専用。
     * 自身の stroke は0だが text-shadow で「黒っぽい雲」を纏わせる）/
     * __ri（白縁リング・複製層）/ __fill（赤→黒グラデ本体・編集対象・最前面）。
     * PoC 原典の共通 stack テンプレートは sh/rh/ro/ri/fill の5層構成だが、
     * 怒り A/B は sh（ずらし影）と ro（外リング）が既定値のまま無効（--sh-c 未設定 =
     * transparent、--ro-w 未設定 = 0）なので、実際に絵へ寄与する rh/ri/fill の3層だけを
     * DOM に持たせた（グランジ弾痕素材が縁取りなしの層を削った先例と同じ判断）。
     * 怒り C（telop-anger-gold）だけが sh を実際に使う（黒ずらし影）ため4層になる —
     * 3変種の差分は conversion-notes.md の表を参照。
     *
     * 色は役割命名: フィルは上→下の5停止点をそのまま個別ツマミにした（対称構造が無く
     * 2端点への圧縮は色を歪めるため、broadcast-gold-navy と同じ「忠実優先」判断）。
     * グロー（雲）は原典が停止ごとに微妙に異なる3色（暗赤〜黒）を持つが、単一の
     * cloudGlow 色 + 3段のアルファ/ぼかしへ整理した（grunge-bullet の color_glow/
     * glowStrength と同じ簡略化。既定値は視覚的にほぼ同一 — 完全一致は不要という
     * 検収基準の範囲内）。
     */
    .telop-anger-mincho {
      position: absolute;
      inset: 0;
      pointer-events: none;
      isolation: isolate;
      font-family: var(--fontFamily, "Hiragino Mincho ProN", "Yu Mincho", serif);
    }

    .telop-anger-mincho,
    .telop-anger-mincho * {
      box-sizing: border-box;
    }

    .telop-anger-mincho__anchor {
      position: absolute;
      left: 50%;
      top: 50%;
      max-width: min(1600px, 90%);
      transform: translate3d(calc(-50% + var(--posX, 0px)), calc(-50% + var(--posY, 0px)), 0);
    }

    .telop-anger-mincho__stack {
      display: inline-grid;
      justify-items: center;
      line-height: 1.2;
      font-weight: var(--fontWeight, 800);
      font-size: var(--fontSize, 72px);
      letter-spacing: var(--letterSpacing, 0px);
      white-space: normal;
      overflow-wrap: anywhere;
      text-align: center;
      text-wrap: balance;
    }

    .telop-anger-mincho__stack > span {
      grid-area: 1 / 1;
      paint-order: stroke fill;
    }

    /* 層1（最背面）: グロー専用層。自身の stroke は0のまま、text-shadow だけで
       「黒っぽい雲」を纏わせる（PoC 原典の rh 役割）。複製層 — data-mirror。 */
    .telop-anger-mincho__rh {
      z-index: 1;
      color: transparent;
      text-shadow:
        0 0 calc(var(--glowStrength, 1) * 0.1em)
          color-mix(in srgb, var(--cloudGlow, #260a06) 95%, transparent),
        0 0 calc(var(--glowStrength, 1) * 0.25em)
          color-mix(in srgb, var(--cloudGlow, #260a06) 95%, transparent),
        0 0 calc(var(--glowStrength, 1) * 0.5em)
          color-mix(in srgb, var(--cloudGlow, #260a06) 75%, transparent);
    }

    /* 層2: 白縁リング。複製層 — data-mirror。 */
    .telop-anger-mincho__ri {
      z-index: 2;
      color: transparent;
      -webkit-text-stroke: var(--ringWidth, 0.065em) var(--ringColor, #ffffff);
    }

    /* 層3（最前面）: 赤→黒グラデ本体。background-clip: text。編集対象
       （直接テキストを持ち data-mirror なし = overlay-runtime の canEditText 対象）。 */
    .telop-anger-mincho__fill {
      z-index: 3;
      background: linear-gradient(
        180deg,
        var(--fillTop, #ff5a30) 0%,
        var(--fillUpper, #e01810) 28%,
        var(--fillMid, #90100a) 55%,
        var(--fillLower, #380602) 80%,
        var(--fillBottom, #0d0100) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
  </style>

  <div class="telop-anger-mincho__anchor">
    <span class="telop-anger-mincho__stack">
      <span class="telop-anger-mincho__rh" data-mirror="text" aria-hidden="true">ふざけんなよ!!</span>
      <span class="telop-anger-mincho__ri" data-mirror="text" aria-hidden="true">ふざけんなよ!!</span>
      <span class="telop-anger-mincho__fill">ふざけんなよ!!</span>
    </span>
  </div>
</div>
