<div
  class="telop-pop-dot"
  lang="ja"
  data-start="0"
  data-duration="3"
>
  <style>
    /*
     * telop-pop-dot — ポップ柄ドット（角丸ゴシック + 水玉）の HTML 断片化。
     * 変換元: lab/telop-rich-css-poc/02-style-gallery.html #st-pop-dot
     *（オーナーレビュー4ラウンド済み最終形。converted_from は meta.json 参照）
     *
     * 構造: __anchor（中央配置 + posX/posY 微調整 + 長文の折返し境界）>
     * __stack（3層を同一 grid セルへ重ねる）> __sh（ずらし影・最背面・data-mirror）/
     * __ring（白太縁・data-mirror）/ __fill（水玉柄 + 青グラデ本体・編集対象・最前面）。
     * PoC 原典の汎用6層スキーマ（sh/rh/ro/ri/bk/fill）のうち実効果を持つ3層
     * （sh・ri相当を__ring・fill）だけを抽出（telop-grunge-bullet と同じ「必要な層だけ持つ」判断）。
     * rh/ro/bk はPoC原典でも未設定のため実装せず。transform を持つ層（sh）は必ず z-index を
     * 明示する（overlay-authoring 既知の罠: transform がスタッキングコンテキストを作る）。
     *
     * 水玉柄は radial-gradient 2枚（大小の白ドットを互い違いにタイル）+ 青系 linear-gradient。
     * SVG データ URI を使わない CSS ネイティブ柄のため、タイルサイズを --patternSize で
     * ツマミ化した（統一方針: 柄サイズはツマミ候補）。ドット半径自体（4.5px/3.5px 等）は
     * PoC原典の見た目比率を保つため焼き込み。
     */
    .telop-pop-dot {
      position: absolute;
      inset: 0;
      pointer-events: none;
      isolation: isolate;
      font-family: var(--fontFamily, "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif);
    }

    .telop-pop-dot,
    .telop-pop-dot * {
      box-sizing: border-box;
    }

    .telop-pop-dot__anchor {
      position: absolute;
      left: 50%;
      top: 50%;
      /* 長文の折返し境界（統一方針7: px 直値には min(px, %) を併用）。 */
      max-width: min(1600px, 90%);
      transform: translate3d(calc(-50% + var(--posX, 0px)), calc(-50% + var(--posY, 0px)), 0);
    }

    .telop-pop-dot__stack {
      display: inline-grid;
      justify-items: center;
      line-height: 1.2;
      font-weight: 800;
      font-size: var(--fontSize, 104px);
      letter-spacing: var(--letterSpacing, 0px);
      white-space: normal;
      overflow-wrap: anywhere;
      text-align: center;
      text-wrap: balance;
    }
    .telop-pop-dot__stack > span {
      grid-area: 1 / 1;
      paint-order: stroke fill;
    }

    /* 層1（最背面）: ずらし影。複製層 — data-mirror="text"。 */
    .telop-pop-dot__sh {
      z-index: 1;
      transform: translate(var(--shadowOffsetX, 0.05em), var(--shadowOffsetY, 0.06em));
      color: var(--color_shadow, #a8adb5);
      -webkit-text-stroke: var(--shadowWidth, 0.15em) var(--color_shadow, #a8adb5);
    }

    /* 層2: 白太縁。複製層 — data-mirror="text"。 */
    .telop-pop-dot__ring {
      z-index: 2;
      color: transparent;
      -webkit-text-stroke: var(--ringWidth, 0.15em) var(--color_ring, #ffffff);
    }

    /* 層3（最前面）: 水玉柄 + 青グラデ本体。編集対象（DOM テキスト直置き）。 */
    .telop-pop-dot__fill {
      z-index: 3;
      background:
        radial-gradient(circle, rgba(255, 255, 255, 0.4) 4.5px, transparent 5.5px) 0 0 / var(--patternSize, 24px) var(--patternSize, 24px),
        radial-gradient(circle, rgba(255, 255, 255, 0.3) 3.5px, transparent 4.5px) calc(var(--patternSize, 24px) / 2) calc(var(--patternSize, 24px) / 2) / var(--patternSize, 24px) var(--patternSize, 24px),
        linear-gradient(180deg, var(--color_fill, #5a9af0) 0%, var(--color_fill_2, #3a78d8) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
  </style>

  <div class="telop-pop-dot__anchor">
    <span class="telop-pop-dot__stack">
      <span class="telop-pop-dot__sh" data-mirror="text" aria-hidden="true">ドット</span>
      <span class="telop-pop-dot__ring" data-mirror="text" aria-hidden="true">ドット</span>
      <span class="telop-pop-dot__fill">ドット</span>
    </span>
  </div>
</div>
