<div
  class="telop-nega-abyss"
  lang="ja"
  data-start="0"
  data-duration="3"
>
  <style>
    /*
     * telop-nega-abyss — ネガ系「生理的に無理です」（沈む紫グラデ明朝）の HTML 断片化。
     * 変換元: lab/telop-rich-css-poc/02-style-gallery.html #st-negative
     *（オーナーレビュー4ラウンド済み最終形。converted_from は meta.json 参照）
     *
     * 構造: __anchor（中央配置 + posX/posY 微調整 + 長文の折返し境界）>
     * __stack（3層を同一 grid セルへ重ねる）> __glow（弱い白紫グロー・最背面・色transparent+
     * text-shadowのみ・data-mirror）/ __ring（白ヘアライン・data-mirror）/
     * __fill（紫→黒の沈むグラデ明朝本体・編集対象・最前面）。PoC 原典の汎用6層スキーマのうち
     * 実効果を持つ3層（rh相当をglow・ri・fill）だけを抽出（sh・ro・bk はPoC原典でも
     * 未設定のため実装せず）。PoC 原典の他タイルよりフォントサイズが小さい（62px 既定）のは
     * 「生理的に無理です」8文字を1行に収める意匠判断であり実装ミスではない（PoC原典どおり）。
     *
     * グラデは5停止点（0/28/55/80/100%）を3アンカー（上端・中間・下端）へ集約し、
     * 28%・80%は隣接アンカー間の color-mix で比例導出する（telop-grunge-bullet と同じ
     * 「両端＋中間色をツマミ、中間停止点は比例導出」設計）。近似であり conversion-notes.md
     * 参照。
     */
    .telop-nega-abyss {
      position: absolute;
      inset: 0;
      pointer-events: none;
      isolation: isolate;
      font-family: var(--fontFamily, "Hiragino Mincho ProN", "Yu Mincho", serif);
    }

    .telop-nega-abyss,
    .telop-nega-abyss * {
      box-sizing: border-box;
    }

    .telop-nega-abyss__anchor {
      position: absolute;
      left: 50%;
      top: 50%;
      max-width: min(1600px, 90%);
      transform: translate3d(calc(-50% + var(--posX, 0px)), calc(-50% + var(--posY, 0px)), 0);
    }

    .telop-nega-abyss__stack {
      display: inline-grid;
      justify-items: center;
      line-height: 1.2;
      font-weight: 800;
      font-size: var(--fontSize, 62px);
      letter-spacing: var(--letterSpacing, 0px);
      white-space: normal;
      overflow-wrap: anywhere;
      text-align: center;
      text-wrap: balance;
    }
    .telop-nega-abyss__stack > span {
      grid-area: 1 / 1;
      paint-order: stroke fill;
    }

    /* 層1（最背面）: 弱い白紫グロー。マスクは掛けない。文字色は透明、text-shadow だけが見える。
       複製層 — data-mirror="text"。 */
    .telop-nega-abyss__glow {
      z-index: 1;
      color: transparent;
      text-shadow:
        0 0 calc(var(--glowStrength, 1) * 0.14em)
          color-mix(in srgb, var(--color_glow, #c8b4ff) 50%, transparent),
        0 0 calc(var(--glowStrength, 1) * 0.35em)
          color-mix(in srgb, var(--color_glow_2, #8c6edc) 35%, transparent);
    }

    /* 層2: 白ヘアライン。複製層 — data-mirror="text"。 */
    .telop-nega-abyss__ring {
      z-index: 2;
      color: transparent;
      -webkit-text-stroke: var(--ringWidth, 0.02em)
        color-mix(in srgb, var(--color_ring, #ffffff) calc(var(--ringOpacity, 0.85) * 100%), transparent);
    }

    /* 層3（最前面）: 紫→黒の沈むグラデ本体。編集対象（DOM テキスト直置き）。 */
    .telop-nega-abyss__fill {
      z-index: 3;
      background: linear-gradient(180deg,
        var(--color_fill, #c8b4e8) 0%,
        color-mix(in srgb, var(--color_fill, #c8b4e8) 49%, var(--color_fill_mid, #4a2a80) 51%) 28%,
        var(--color_fill_mid, #4a2a80) 55%,
        color-mix(in srgb, var(--color_fill_mid, #4a2a80) 44%, var(--color_fill_2, #0a0418) 56%) 80%,
        var(--color_fill_2, #0a0418) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
  </style>

  <div class="telop-nega-abyss__anchor">
    <span class="telop-nega-abyss__stack">
      <span class="telop-nega-abyss__glow" data-mirror="text" aria-hidden="true">生理的に無理です</span>
      <span class="telop-nega-abyss__ring" data-mirror="text" aria-hidden="true">生理的に無理です</span>
      <span class="telop-nega-abyss__fill">生理的に無理です</span>
    </span>
  </div>
</div>
