<div
  class="telop-kuro-aka"
  lang="ja"
  data-start="0"
  data-duration="3"
>
  <style>
    /*
     * telop-kuro-aka — 黒赤強調（黒文字 + 赤い滲みの縁・明朝）の HTML 断片化。
     * 変換元: lab/telop-rich-css-poc/02-style-gallery.html #st-kuro-aka
     *
     * PoC 原典どおり最小構成: __fill（黒に沈むグラデ本体・編集対象）/ __ri（赤い細縁）/
     * __rh（縁取りの外側へにじむ赤いグロー専用層・自身の stroke は0）の3層のみ。
     * sh（ずらし影）と ro（外リング）は原典で未使用（既定値のまま無効）のため、
     * 他の怒り3変種と同じ判断で DOM に含めていない。「深刻・強調」の定番として、
     * 常時表示のキャプションではなく短い一撃コピーの見出しに使う想定。
     */
    .telop-kuro-aka {
      position: absolute;
      inset: 0;
      pointer-events: none;
      isolation: isolate;
      font-family: var(--fontFamily, "Hiragino Mincho ProN", "Yu Mincho", serif);
    }

    .telop-kuro-aka,
    .telop-kuro-aka * {
      box-sizing: border-box;
    }

    .telop-kuro-aka__anchor {
      position: absolute;
      left: 50%;
      top: 50%;
      max-width: min(1600px, 90%);
      transform: translate3d(calc(-50% + var(--posX, 0px)), calc(-50% + var(--posY, 0px)), 0);
    }

    .telop-kuro-aka__stack {
      display: inline-grid;
      justify-items: center;
      line-height: 1.2;
      font-weight: var(--fontWeight, 800);
      font-size: var(--fontSize, 100px);
      letter-spacing: var(--letterSpacing, 0px);
      white-space: normal;
      overflow-wrap: anywhere;
      text-align: center;
      text-wrap: balance;
    }

    .telop-kuro-aka__stack > span {
      grid-area: 1 / 1;
      paint-order: stroke fill;
    }

    /* 層1（最背面）: 赤いにじみグロー専用層。自身の stroke は0。複製層 — data-mirror。 */
    .telop-kuro-aka__rh {
      z-index: 1;
      color: transparent;
      text-shadow:
        0 0 calc(var(--glowStrength, 1) * 0.05em)
          color-mix(in srgb, var(--glowColor, #e62819) 95%, transparent),
        0 0 calc(var(--glowStrength, 1) * 0.14em)
          color-mix(in srgb, var(--glowColor, #e62819) 85%, transparent),
        0 0 calc(var(--glowStrength, 1) * 0.32em)
          color-mix(in srgb, var(--glowColor, #e62819) 65%, transparent);
    }

    /* 層2: 赤い細縁。複製層 — data-mirror。 */
    .telop-kuro-aka__ri {
      z-index: 2;
      color: transparent;
      -webkit-text-stroke: var(--ringWidth, 0.018em) var(--ringColor, #7a1410);
    }

    /* 層3（最前面）: 黒に沈むグラデ本体。編集対象。 */
    .telop-kuro-aka__fill {
      z-index: 3;
      background: linear-gradient(
        180deg,
        var(--fillTop, #201012) 0%,
        var(--fillMid, #0a0405) 55%,
        var(--fillBottom, #000000) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
  </style>

  <div class="telop-kuro-aka__anchor">
    <span class="telop-kuro-aka__stack">
      <span class="telop-kuro-aka__rh" data-mirror="text" aria-hidden="true">10〜15時間</span>
      <span class="telop-kuro-aka__ri" data-mirror="text" aria-hidden="true">10〜15時間</span>
      <span class="telop-kuro-aka__fill">10〜15時間</span>
    </span>
  </div>
</div>
