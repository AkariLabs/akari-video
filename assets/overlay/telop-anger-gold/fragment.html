<div
  class="telop-anger-gold"
  lang="ja"
  data-start="0"
  data-duration="3"
>
  <style>
    /*
     * telop-anger-gold — 怒り C（赤→黒グラデ + 黄縁 + 黒ずらし影 + 黄色い雲・ゴシック）の
     * HTML 断片化。変換元: lab/telop-rich-css-poc/02-style-gallery.html #st-anger-c
     *
     * フィル（赤→黒5停止）は怒りA/Bと共通だが、縁・影・グローの配色が異なり、かつ
     * PoC 原典で唯一「ずらし影」層 sh が実際に有効（--sh-c: 黒）。他2変種は sh が
     * transparent のまま無効なので層を削ったが、本素材だけは sh を残し4層構成にした
     * （telop-anger-mincho/-gothic との構造差 — conversion-notes.md の表を参照）。
     * transform を持つ sh 層はスタッキングコンテキストを作るため z-index を明示する。
     */
    .telop-anger-gold {
      position: absolute;
      inset: 0;
      pointer-events: none;
      isolation: isolate;
      font-family: var(--fontFamily, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif);
    }

    .telop-anger-gold,
    .telop-anger-gold * {
      box-sizing: border-box;
    }

    .telop-anger-gold__anchor {
      position: absolute;
      left: 50%;
      top: 50%;
      max-width: min(1600px, 90%);
      transform: translate3d(calc(-50% + var(--posX, 0px)), calc(-50% + var(--posY, 0px)), 0);
    }

    .telop-anger-gold__stack {
      display: inline-grid;
      justify-items: center;
      line-height: 1.2;
      font-weight: var(--fontWeight, 900);
      font-size: var(--fontSize, 72px);
      letter-spacing: var(--letterSpacing, 0px);
      white-space: normal;
      overflow-wrap: anywhere;
      text-align: center;
      text-wrap: balance;
    }

    .telop-anger-gold__stack > span {
      grid-area: 1 / 1;
      paint-order: stroke fill;
    }

    /* 層0（最背面）: 黒いずらし影（右下オフセットの太い黒シルエット）。複製層 — data-mirror。
       transform を持つためスタッキングコンテキストを作る — z-index を明示済み。 */
    .telop-anger-gold__sh {
      z-index: 1;
      transform: translate(var(--shadowOffsetX, 0.045em), var(--shadowOffsetY, 0.055em));
      color: var(--shadowColor, #000000);
      -webkit-text-stroke: var(--shadowWidth, 0.05em) var(--shadowColor, #000000);
    }

    /* 層1: グロー専用層（黄色い雲）。自身の stroke は0。複製層 — data-mirror。 */
    .telop-anger-gold__rh {
      z-index: 2;
      color: transparent;
      text-shadow:
        0 0 calc(var(--glowStrength, 1) * 0.14em)
          color-mix(in srgb, var(--cloudGlow, #ffc814) 95%, transparent),
        0 0 calc(var(--glowStrength, 1) * 0.35em)
          color-mix(in srgb, var(--cloudGlow, #ffc814) 65%, transparent),
        0 0 calc(var(--glowStrength, 1) * 0.7em)
          color-mix(in srgb, var(--cloudGlow, #ffc814) 35%, transparent);
    }

    /* 層2: 黄縁リング。複製層 — data-mirror。 */
    .telop-anger-gold__ri {
      z-index: 3;
      color: transparent;
      -webkit-text-stroke: var(--ringWidth, 0.05em) var(--ringColor, #ffd820);
    }

    /* 層3（最前面）: 赤→黒グラデ本体。編集対象。 */
    .telop-anger-gold__fill {
      z-index: 4;
      background: linear-gradient(
        180deg,
        var(--fillTop, #ff5a30) 0%,
        var(--fillUpper, #e01810) 28%,
        var(--fillMid, #90100a) 55%,
        var(--fillLower, #380602) 80%,
        var(--fillBottom, #0d0100) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
  </style>

  <div class="telop-anger-gold__anchor">
    <span class="telop-anger-gold__stack">
      <span class="telop-anger-gold__sh" data-mirror="text" aria-hidden="true">ふざけんなよ!!</span>
      <span class="telop-anger-gold__rh" data-mirror="text" aria-hidden="true">ふざけんなよ!!</span>
      <span class="telop-anger-gold__ri" data-mirror="text" aria-hidden="true">ふざけんなよ!!</span>
      <span class="telop-anger-gold__fill">ふざけんなよ!!</span>
    </span>
  </div>
</div>
