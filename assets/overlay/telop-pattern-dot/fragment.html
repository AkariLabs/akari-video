<div
  class="telop-pattern-dot"
  lang="ja"
  data-start="0"
  data-duration="3"
>
  <style>
    /*
     * telop-pattern-dot — 柄フィル「ドット柄」の HTML 断片化。
     * 変換元: lab/telop-rich-css-poc/02-style-gallery.html .st-dot-dark
     *（PoC 汎用積層テンプレの sh/rh/ro/ri/fill 5 層のうち、実際に視覚効果を持つ層＝
     * グロー(rh) + 内リング(ri) + fill だけを抽出。sh/ro は未設定のため実装しない
     * — telop-pattern-diamond と同型の判断）。
     *
     * 構造: __anchor（中央配置 + posX/posY 微調整 + 長文の折返し境界）>
     * __stack（同一 grid セルへ 3 層を重ねる）> __glow（青グロー・text-shadow のみ・最背面）/
     * __ring（白い内リング・text-stroke）/ __fill（水玉2層+青グラデ本体・編集対象・最前面）。
     *
     * 柄本体は3レイヤーの合成（大小2種の白い水玉の半互い違い配置 + 青の縦グラデ）。
     * 水玉のタイルサイズ・互い違いオフセットは --patternScale で一括スケールする。
     */
    .telop-pattern-dot {
      position: absolute;
      inset: 0;
      pointer-events: none;
      isolation: isolate;
      font-family: var(--fontFamily, "Hiragino Sans", sans-serif);
      --i-fill: radial-gradient(
          circle,
          color-mix(in srgb, var(--dotColor, #ffffff) 50%, transparent) calc(2px * var(--patternScale, 1)),
          transparent calc(3px * var(--patternScale, 1))
        )
          0 0 / calc(16px * var(--patternScale, 1)) calc(16px * var(--patternScale, 1)),
        radial-gradient(
          circle,
          color-mix(in srgb, var(--dotColor, #ffffff) 35%, transparent) calc(1.6px * var(--patternScale, 1)),
          transparent calc(2.6px * var(--patternScale, 1))
        )
          calc(8px * var(--patternScale, 1)) calc(8px * var(--patternScale, 1)) /
          calc(16px * var(--patternScale, 1)) calc(16px * var(--patternScale, 1)),
        linear-gradient(
          180deg,
          var(--fillTop, #8ad0ff) 0%,
          var(--fillMid, #2a6ad0) 55%,
          var(--fillBottom, #0a2a80) 100%
        );
    }

    .telop-pattern-dot,
    .telop-pattern-dot * {
      box-sizing: border-box;
    }

    .telop-pattern-dot__anchor {
      position: absolute;
      left: 50%;
      top: 50%;
      max-width: min(1600px, 90%);
      transform: translate3d(calc(-50% + var(--posX, 0px)), calc(-50% + var(--posY, 0px)), 0);
    }

    .telop-pattern-dot__stack {
      display: inline-grid;
      justify-items: center;
      line-height: 1.2;
      font-weight: 800;
      font-size: var(--fontSize, 104px);
      letter-spacing: var(--letterSpacing, 0px);
      white-space: normal;
      overflow-wrap: anywhere;
      text-align: center;
      text-wrap: balance;
    }
    .telop-pattern-dot__stack > span {
      grid-area: 1 / 1;
      paint-order: stroke fill;
    }

    /* 層1（最背面）: 青のにじみグロー。複製層。 */
    .telop-pattern-dot__glow {
      z-index: 1;
      color: transparent;
      text-shadow:
        0 0 calc(var(--glowStrength, 1) * 0.16em)
          color-mix(in srgb, var(--glowColor, #5096ff) 90%, transparent),
        0 0 calc(var(--glowStrength, 1) * 0.4em)
          color-mix(in srgb, var(--glowColor, #5096ff) 70%, #05173a);
    }

    /* 層2: 白い内リング。複製層。 */
    .telop-pattern-dot__ring {
      z-index: 2;
      color: transparent;
      -webkit-text-stroke: var(--ringWidth, 0.07em) var(--ringColor, #ffffff);
    }

    /* 層3（最前面）: 水玉 + 青グラデの柄フィル本体。編集対象。 */
    .telop-pattern-dot__fill {
      z-index: 3;
      background: var(--i-fill);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
  </style>

  <div class="telop-pattern-dot__anchor">
    <span class="telop-pattern-dot__stack">
      <span class="telop-pattern-dot__glow" data-mirror="text" aria-hidden="true">ドット柄</span>
      <span class="telop-pattern-dot__ring" data-mirror="text" aria-hidden="true">ドット柄</span>
      <span class="telop-pattern-dot__fill">ドット柄</span>
    </span>
  </div>
</div>
