<div
  class="telop-broadcast-gold-navy"
  lang="ja"
  data-start="0"
  data-duration="4"
>
  <style>
    /*
     * telop-broadcast-gold-navy — 放送級テロップ「26年半の歴史に幕」の HTML 断片化。
     * 変換元: lab/telop-rich-css-poc/01-broadcast-gold-navy.html（オーナー採用宣言済みの最終形・2026-08-05）
     *
     * 構造: __anchor（位置調整だけを持つ、posX/posY の中央基準オフセット + 折返し保険）>
     * 3 つの __stack（金 1 + 紺 2 = 助詞の小書き「の」+ 本文「歴史に幕」）を横並び。
     * 各 __stack は同一テキストを inline-grid で 6 層重ね、下から順に
     * ずらし影（sh）→ 外周ヘアライン（r0）→ 太い黒縁（r1）→ 色リング（r2）→ 明るいリム（r3）→
     * 金属グラデ本体（fill）。transform を持つ層（sh）はスタッキングコンテキストを作るため、
     * 全層に z-index を明示して順序を固定している（PoC README「罠」節）。
     *
     * 編集対象: 各 __stack の __fill 層のみ（直接テキストを持ち、data-mirror 無し）。
     * __sh/__r0/__r1/__r2/__r3 の複製層は data-mirror="text" を持ち、overlay-runtime の
     * 層ミラー機能（packages/overlay-runtime/src/interaction.js の syncMirrorLayers、
     * mirrorSyncScope は編集層の親要素 = 本断片では各 __stack を同期範囲として自動検出する）が
     * __fill の編集確定（input / compositionend）のたびに同一テキストへ同期する。
     *
     * テキストは 3 要素（金 1 + 紺の小書き「の」1 + 紺の本文 1）。PoC 最終形は紺セグメント内で
     * 助詞「の」だけ一段小さいサイズにする意匠を採っており、これは単一の contenteditable
     * 要素では表現できない（1 要素内で文字ごとにサイズを変えると多層積み技法が壊れる）ため、
     * 紺セグメントを 2 つの独立した __stack に分けて実装した。設計判断の詳細は
     * conversion-notes.md 参照。
     *
     * 色ツマミは役割命名（--goldRingOuter 等）。金属グラデ本体は元 7 停止点を
     * 4 役割（shade/mid/bright/peak、中心に対して対称に再利用）へ整理してある
     * （--i-fill-grad は内部変数。停止点の位置(%)は構造として焼き込み、色だけをツマミ化）。
     * リングの太さ・影のオフセットは金/紺で共有（元 PoC も同一値、em 単位で各セグメントの
     * font-size に自動追従する）。
     */
    .telop-broadcast-gold-navy {
      position: absolute;
      inset: 0;
      pointer-events: none;
      isolation: isolate;
      font-family: var(--fontFamily, "Hiragino Mincho ProN", "Yu Mincho", serif);
    }

    .telop-broadcast-gold-navy,
    .telop-broadcast-gold-navy * {
      box-sizing: border-box;
    }

    .telop-broadcast-gold-navy__anchor {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate3d(calc(-50% + var(--posX, 0px)), calc(-50% + var(--posY, 0px)), 0);
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: center;
      gap: 0 var(--segmentGap, 0px);
      /* width:auto の abspos を left:50%+transform:translate(-50%) で中央寄せしつつ
         flex-wrap:wrap も併用すると、shrink-to-fit の「使用可能幅」計算が transform を
         考慮せず「left(50%)から先＝コンテナ幅の半分」を可用幅と誤認し、既定文言でも
         セグメント単位で早期に折り返す（実測で踏んだ罠。conversion-notes.md 参照）。
         width: max-content で shrink-to-fit を経由させず内容量どおりの幅を先に確定させ、
         その上で max-width が長文時の折返し安全弁として正しく効くようにする。 */
      width: max-content;
      /* 想定を超える長文でもレイアウトが破綻しないための保険（統一方針7 min(px,%)）。
         各 __stack 内部は nowrap のまま（多層積みの層間ずれを避ける）で、
         __stack 同士の間でだけ折返す。 */
      max-width: min(1800px, 92%);
    }

    .telop-broadcast-gold-navy__stack {
      display: inline-grid;
      line-height: 1.1;
      font-weight: var(--fontWeight, 800);
      white-space: nowrap;
    }

    .telop-broadcast-gold-navy__stack > span {
      grid-area: 1 / 1;
      paint-order: stroke fill;
    }

    /* 層 0: ずらし影 — 右下にオフセットした黒シルエット（立体感） */
    .telop-broadcast-gold-navy__sh {
      z-index: 1;
      transform: translate(var(--shadowOffsetX, 0.055em), var(--shadowOffsetY, 0.07em));
      color: var(--shadowColor, #000000);
      -webkit-text-stroke: var(--shadowStrokeWidth, 0.16em) var(--shadowColor, #000000);
    }

    /* 層 0.5: 最外周ヘアライン（黒縁の外にのぞく細いライン。金は既定 transparent = 無効） */
    .telop-broadcast-gold-navy__r0 {
      z-index: 2;
      color: transparent;
      -webkit-text-stroke: var(--ringHairlineWidth, 0.185em) var(--i-ring-hairline, transparent);
    }

    /* 層 1: 太い黒縁 */
    .telop-broadcast-gold-navy__r1 {
      z-index: 3;
      color: transparent;
      -webkit-text-stroke: var(--ringOuterWidth, 0.155em) var(--i-ring-outer, #050505);
    }

    /* 層 2: 色リング（金文字は暗赤、紺文字は黒紺） */
    .telop-broadcast-gold-navy__r2 {
      z-index: 4;
      color: transparent;
      -webkit-text-stroke: var(--ringMidWidth, 0.095em) var(--i-ring-mid, #7a1710);
    }

    /* 層 3: 明るいリム */
    .telop-broadcast-gold-navy__r3 {
      z-index: 5;
      color: transparent;
      -webkit-text-stroke: var(--ringRimWidth, 0.042em) var(--i-ring-rim, #e8c04a);
    }

    /* 層 4（最前面）: 中央が光る金属グラデ本体。background-clip: text でグリフへ流し込む。
       編集対象（直接テキストを持ち data-mirror なし = overlay-runtime の canEditText 対象）。 */
    .telop-broadcast-gold-navy__fill {
      z-index: 6;
      background: var(--i-fill-grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-stroke: var(--fillEdgeWidth, 0.012em) var(--i-fill-edge, rgba(0, 0, 0, 0.55));
    }

    /* ===== 金セグメント ===== */
    .telop-broadcast-gold-navy__stack--gold {
      font-size: var(--goldFontSize, 200px);
      --i-ring-hairline: var(--goldRingHairline, transparent);
      --i-ring-outer: var(--goldRingOuter, #050505);
      --i-ring-mid: var(--goldRingMid, #82160c);
      --i-ring-rim: var(--goldRingRim, #f0c455);
      --i-fill-edge: var(--goldFillEdge, rgba(60, 30, 0, 0.6));
      --i-fill-grad: linear-gradient(
        180deg,
        var(--goldFillShade, #6b4a12) 0%,
        var(--goldFillMid, #c99a30) 26%,
        var(--goldFillBright, #ffe98a) 44%,
        var(--goldFillPeak, #fff8cf) 50%,
        var(--goldFillBright, #ffe98a) 58%,
        var(--goldFillMid, #c99a30) 78%,
        var(--goldFillShade, #6b4a12) 100%
      );
    }

    /* ===== 紺セグメント（小書き「の」・本文「歴史に幕」で色ロールを共有）===== */
    .telop-broadcast-gold-navy__stack--navy-connector,
    .telop-broadcast-gold-navy__stack--navy-main {
      --i-ring-hairline: var(--navyRingHairline, #c89a38);
      --i-ring-outer: var(--navyRingOuter, #050505);
      --i-ring-mid: var(--navyRingMid, #0d0d18);
      --i-ring-rim: var(--navyRingRim, #d9a83c);
      --i-fill-edge: var(--navyFillEdge, rgba(0, 0, 30, 0.6));
      --i-fill-grad: linear-gradient(
        180deg,
        var(--navyFillShade, #0a1440) 0%,
        var(--navyFillMid, #223a9e) 34%,
        var(--navyFillBright, #6f80d8) 47%,
        var(--navyFillPeak, #8b97e4) 51%,
        var(--navyFillBright, #6f80d8) 62%,
        var(--navyFillMid, #223a9e) 82%,
        var(--navyFillShade, #0a1440) 100%
      );
    }
    .telop-broadcast-gold-navy__stack--navy-main {
      font-size: var(--navyFontSize, 172px);
    }
    .telop-broadcast-gold-navy__stack--navy-connector {
      font-size: calc(var(--navyFontSize, 172px) * var(--navyConnectorScale, 0.86));
    }
  </style>

  <div class="telop-broadcast-gold-navy__anchor">
    <span class="telop-broadcast-gold-navy__stack telop-broadcast-gold-navy__stack--gold">
      <span class="telop-broadcast-gold-navy__sh" data-mirror="text" aria-hidden="true">26年半</span>
      <span class="telop-broadcast-gold-navy__r0" data-mirror="text" aria-hidden="true">26年半</span>
      <span class="telop-broadcast-gold-navy__r1" data-mirror="text" aria-hidden="true">26年半</span>

    </span>
    <span class="telop-broadcast-gold-navy__stack telop-broadcast-gold-navy__stack--navy-connector">
      <span class="telop-broadcast-gold-navy__sh" data-mirror="text" aria-hidden="true">の</span>
      <span class="telop-broadcast-gold-navy__r0" data-mirror="text" aria-hidden="true">の</span>

    </span>
    <span class="telop-broadcast-gold-navy__stack telop-broadcast-gold-navy__stack--navy-main">
      <span class="telop-broadcast-gold-navy__sh" data-mirror="text" aria-hidden="true">歴史に幕</span>

      <span class="telop-broadcast-gold-navy__fill">歴史に幕</span>
    </span>
  </div>
