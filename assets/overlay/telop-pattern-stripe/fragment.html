<div
  class="telop-pattern-stripe"
  lang="ja"
  data-start="0"
  data-duration="3"
>
  <style>
    /*
     * telop-pattern-stripe — 柄フィル「ストライプ」の HTML 断片化。
     * 変換元: lab/telop-rich-css-poc/02-style-gallery.html .st-stripe
     *（PoC 汎用積層テンプレの sh/rh/ro/ri/fill 5 層のうち、実際に視覚効果を持つ層＝
     * グロー(rh) + 外リング(ro) + 内リング(ri) + fill の4層を抽出。sh は未設定のため
     * 実装しない。5種のうち唯一 ro/ri の2重リングを両方使うスタイル）。
     *
     * 構造: __anchor（中央配置 + posX/posY 微調整 + 長文の折返し境界）>
     * __stack（同一 grid セルへ 4 層を重ねる）> __glow（ピンクグロー・最背面）/
     * __ringOuter（白い外リング・太め）/ __ring（赤い内リング・細め）/
     * __fill（横縞+光沢オーバーレイ本体・編集対象・最前面）。
     * ro（太い白）がri（細い赤）より背面にあるため、太い白リングの外周だけが
     * 赤リングの外にのぞき「赤縁+白外縁」に見える（PoC原典どおりの重なり順）。
     *
     * 柄本体は2レイヤーの合成（上部が白く光り下部が赤みへ沈む光沢オーバーレイ +
     * ピンク×白の横縞）。縞のタイル周期は --patternScale で拡縮する。
     */
    .telop-pattern-stripe {
      position: absolute;
      inset: 0;
      pointer-events: none;
      isolation: isolate;
      font-family: var(--fontFamily, "Hiragino Sans", sans-serif);
      --i-fill: linear-gradient(
          180deg,
          color-mix(in srgb, var(--sheenColor, #ffffff) 30%, transparent) 0%,
          transparent 40%,
          color-mix(in srgb, var(--shadeTint, #c80046) 25%, transparent) 100%
        ),
        repeating-linear-gradient(
          0deg,
          var(--stripeColorA, #ff6a9e) 0 calc(7px * var(--patternScale, 1)),
          var(--stripeColorB, #ffe9f1) calc(7px * var(--patternScale, 1)) calc(14px * var(--patternScale, 1))
        );
    }

    .telop-pattern-stripe,
    .telop-pattern-stripe * {
      box-sizing: border-box;
    }

    .telop-pattern-stripe__anchor {
      position: absolute;
      left: 50%;
      top: 50%;
      max-width: min(1600px, 90%);
      transform: translate3d(calc(-50% + var(--posX, 0px)), calc(-50% + var(--posY, 0px)), 0);
    }

    .telop-pattern-stripe__stack {
      display: inline-grid;
      justify-items: center;
      line-height: 1.2;
      font-weight: 800;
      font-size: var(--fontSize, 104px);
      letter-spacing: var(--letterSpacing, 0px);
      white-space: normal;
      overflow-wrap: anywhere;
      text-align: center;
      text-wrap: balance;
    }
    .telop-pattern-stripe__stack > span {
      grid-area: 1 / 1;
      paint-order: stroke fill;
    }

    /* 層1（最背面）: ピンクのにじみグロー。複製層。 */
    .telop-pattern-stripe__glow {
      z-index: 1;
      color: transparent;
      text-shadow: 0 0 calc(var(--glowStrength, 1) * 0.14em)
        color-mix(in srgb, var(--glowColor, #ff5a96) 60%, transparent);
    }

    /* 層2: 白い外リング（太め）。複製層。 */
    .telop-pattern-stripe__ringOuter {
      z-index: 2;
      color: transparent;
      -webkit-text-stroke: var(--ringOuterWidth, 0.14em) var(--ringOuterColor, #ffffff);
    }

    /* 層3: 赤い内リング（細め）。複製層。 */
    .telop-pattern-stripe__ring {
      z-index: 3;
      color: transparent;
      -webkit-text-stroke: var(--ringWidth, 0.05em) var(--ringColor, #e01858);
    }

    /* 層4（最前面）: 横縞 + 光沢オーバーレイの柄フィル本体。編集対象。 */
    .telop-pattern-stripe__fill {
      z-index: 4;
      background: var(--i-fill);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
  </style>

  <div class="telop-pattern-stripe__anchor">
    <span class="telop-pattern-stripe__stack">
      <span class="telop-pattern-stripe__glow" data-mirror="text" aria-hidden="true">ストライプ</span>
      <span class="telop-pattern-stripe__ringOuter" data-mirror="text" aria-hidden="true">ストライプ</span>
      <span class="telop-pattern-stripe__ring" data-mirror="text" aria-hidden="true">ストライプ</span>
      <span class="telop-pattern-stripe__fill">ストライプ</span>
    </span>
  </div>
</div>
