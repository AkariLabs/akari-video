<div
  class="telop-gold-3d"
  lang="ja"
  data-start="0"
  data-duration="4"
>
  <style>
    /*
     * telop-gold-3d — ゴージャス金（極太ゴシック金 + 黒太縁 + 金ヘアライン + 二段押し出し3D
     * + 黄色い雲状グロー）の HTML 断片化。
     * 変換元: lab/telop-rich-css-poc/02-style-gallery.html #st-gold-pop
     *
     * 構造: __anchor（中央配置 + posX/posY 微調整 + 折返し境界）> __stack（5層を同一
     * grid セルへ重ねる。z-index 全層明示）:
     *   __sh（最背面・押し出し3D + 雲グロー） < __rh（金ヘアライン） < __ro（黒太縁）
     *   < __ri（本体極細エッジ） < __fill（金属グラデ本体・編集対象・最前面）。
     *
     * 押し出し3D（sh層）: 指示どおり「層を増やさない」— PoC 原典の
     * `.st-gold-pop .sh { text-shadow: 8本の重ね書き }` を単一層の text-shadow のまま
     * 移植した。8本は「金→黒の押し出し5段」+「黄色い雲グロー3段」の合成。
     * 5段の押し出しオフセットは em比が一定（X≈0.0224em/段・Y=0.028em/段ちょうど）
     * だったため、ツマミは基準オフセット1本ずつ（--extrudeStepX/Y）+ calc(×1〜5) で
     * 段数ぶんを導出する構造に整理した（実測差は最大0.0024em＝小数点以下の副画素で
     * 目視差なし）。色は「近い側の金2色」と「遠い側の黒3色（原典は完全同一色を3回
     * 重ねているため1変数で足りる）」に整理。雲グローは原典が3段でわずかに異なる黄色
     * （彩度・明度が微減）を使うが、単色 + 3段のアルファ/ぼかしへ簡略化した
     * （grunge-bullet の color_glow/glowStrength と同じ判断。既定値は視覚的にほぼ同一）。
     */
    .telop-gold-3d {
      position: absolute;
      inset: 0;
      pointer-events: none;
      isolation: isolate;
      font-family: var(--fontFamily, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif);
    }

    .telop-gold-3d,
    .telop-gold-3d * {
      box-sizing: border-box;
    }

    .telop-gold-3d__anchor {
      position: absolute;
      left: 50%;
      top: 50%;
      max-width: min(1700px, 92%);
      transform: translate3d(calc(-50% + var(--posX, 0px)), calc(-50% + var(--posY, 0px)), 0);
    }

    .telop-gold-3d__stack {
      display: inline-grid;
      justify-items: center;
      line-height: 1.2;
      font-weight: var(--fontWeight, 900);
      font-size: var(--fontSize, 60px);
      letter-spacing: var(--letterSpacing, 0px);
      white-space: normal;
      overflow-wrap: anywhere;
      text-align: center;
      text-wrap: balance;
    }

    .telop-gold-3d__stack > span {
      grid-area: 1 / 1;
      paint-order: stroke fill;
    }

    /* 層0（最背面）: 二段押し出し3D + 黄色い雲グロー。text-shadow 8本の合成（層を増やさない）。
       自身の color は transparent・stroke なし（PoC 原典どおり、text-shadow のみで構成）。 */
    .telop-gold-3d__sh {
      z-index: 1;
      color: transparent;
      text-shadow:
        calc(var(--extrudeStepX, 0.0224em) * 1) calc(var(--extrudeStepY, 0.028em) * 1)
          var(--extrudeNear, #a87408),
        calc(var(--extrudeStepX, 0.0224em) * 2) calc(var(--extrudeStepY, 0.028em) * 2)
          color-mix(in srgb, var(--extrudeNear, #a87408) 85%, black),
        calc(var(--extrudeStepX, 0.0224em) * 3) calc(var(--extrudeStepY, 0.028em) * 3)
          var(--extrudeFar, #141005),
        calc(var(--extrudeStepX, 0.0224em) * 4) calc(var(--extrudeStepY, 0.028em) * 4)
          var(--extrudeFar, #141005),
        calc(var(--extrudeStepX, 0.0224em) * 5) calc(var(--extrudeStepY, 0.028em) * 5)
          var(--extrudeFar, #141005),
        0 0 calc(var(--glowStrength, 1) * 0.2em)
          color-mix(in srgb, var(--cloudGlow, #ffd746) 95%, transparent),
        0 0 calc(var(--glowStrength, 1) * 0.5em)
          color-mix(in srgb, var(--cloudGlow, #ffd746) 65%, transparent),
        0 0 calc(var(--glowStrength, 1) * 0.9em)
          color-mix(in srgb, var(--cloudGlow, #ffd746) 40%, transparent);
    }

    /* 層1: 金ヘアライン（黒太縁の外にわずかにのぞく細いライン）。複製層 — data-mirror。 */
    .telop-gold-3d__rh {
      z-index: 2;
      color: transparent;
      -webkit-text-stroke: var(--hairlineWidth, 0.14em) var(--hairlineColor, #c8a030);
    }

    /* 層2: 黒太縁。複製層 — data-mirror。 */
    .telop-gold-3d__ro {
      z-index: 3;
      color: transparent;
      -webkit-text-stroke: var(--ringWidth, 0.1em) var(--ringColor, #0a0a0a);
    }

    /* 層3: 本体の極細エッジ（フィルのすぐ外側の焦げ茶色い縁）。複製層 — data-mirror。 */
    .telop-gold-3d__ri {
      z-index: 4;
      color: transparent;
      -webkit-text-stroke: var(--edgeWidth, 0.012em) var(--edgeColor, rgba(60, 40, 0, 0.7));
    }

    /* 層4（最前面）: 金属グラデ本体。background-clip: text。編集対象
       （直接テキストを持ち data-mirror なし = overlay-runtime の canEditText 対象）。 */
    .telop-gold-3d__fill {
      z-index: 5;
      background: linear-gradient(
        170deg,
        var(--fillTop, #f8e896) 0%,
        var(--fillUpperShade, #d8a828) 28%,
        var(--fillCoreBright, #fff6c0) 46%,
        var(--fillCoreShade, #f0c860) 55%,
        var(--fillLowerShade, #a87818) 78%,
        var(--fillBottom, #6a4808) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
  </style>

  <div class="telop-gold-3d__anchor">
    <span class="telop-gold-3d__stack">
      <span class="telop-gold-3d__sh" data-mirror="text" aria-hidden="true">友達ができました!!</span>
      <span class="telop-gold-3d__rh" data-mirror="text" aria-hidden="true">友達ができました!!</span>
      <span class="telop-gold-3d__ro" data-mirror="text" aria-hidden="true">友達ができました!!</span>
      <span class="telop-gold-3d__ri" data-mirror="text" aria-hidden="true">友達ができました!!</span>
      <span class="telop-gold-3d__fill">友達ができました!!</span>
    </span>
  </div>
</div>
